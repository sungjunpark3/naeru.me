<script>
/* ── 프레임 사각형 계산: 배경 영상이 cover로 차지하는 16:9 상자.
   #frame(공)과 #stage(내루미) 둘 다 이 식 하나에 맞춘다 — 공 IIFE가 이미
   6개 화면비에서 검증한 수식 그대로, 개체마다 따로 계산하지 않는 게 요점.
   독립 IIFE들이 각자 자기 요소에 대고 부르므로 이 함수 자체는 상태가 없다 ── */
function layoutFrameBox(el) {
  var AR = 16 / 9, vw = innerWidth, vh = innerHeight, W, H;
  if (vw / vh >= AR) { W = vw; H = vw / AR; } else { H = vh; W = vh * AR; }
  el.style.width  = W + "px";
  el.style.height = H + "px";
  el.style.left   = ((vw - W) / 2) + "px";
  el.style.top    = ((vh - H) / 2) + "px";
  return { W: W, H: H };
}

/* ── 장면 동작의 수명 ──────────────────────────────────────────
   시간대 전환·탭 숨김·동작 줄이기에서 각 IIFE의 타이머와 rAF를 함께 취소한다.
   예전 콜백이 뒤늦게 돌아와 새 장면의 transform·busy를 덮어쓰지 않게 한다. */
function sceneMotionAllowed() {
  var root = document.documentElement, reduced = window.naeruReduced();
  // 실행 중인 rAF가 media change 이벤트보다 먼저 새 설정을 읽을 수 있다.
  // 콜백만 버리면 확대·busy가 남으므로 플레이어와 모든 동작을 함께 갱신한다.
  if (root.dataset.motion !== (reduced ? "still" : "on")) {
    document.dispatchEvent(new Event("naeru:settings"));
  }
  return !reduced && !document.hidden && root.dataset.sceneReady === "true";
}
function createSceneMotion(restart, cleanup) {
  var frames = new Set(), timers = new Set();
  function stop() {
    frames.forEach(function (id) { window.cancelAnimationFrame(id); });
    timers.forEach(function (id) { window.clearTimeout(id); });
    frames.clear(); timers.clear();
    cleanup();
  }
  function start() { stop(); if (sceneMotionAllowed()) restart(); }
  document.addEventListener("naeru:scene", start);
  document.addEventListener("visibilitychange", start);
  return {
    start: start,
    frame: function (fn) {
      if (!sceneMotionAllowed()) return 0;
      var id = window.requestAnimationFrame(function (now) {
        frames.delete(id);
        if (sceneMotionAllowed()) fn(now);
      });
      frames.add(id); return id;
    },
    later: function (fn, ms) {
      if (!sceneMotionAllowed()) return 0;
      var id = window.setTimeout(function () {
        timers.delete(id);
        if (sceneMotionAllowed()) fn();
      }, ms);
      timers.add(id); return id;
    }
  };
}
</script>

<script>
(function () {
  var TZ = "Asia/Seoul", WKEY = "naeru-weather";
  var ASSET_V = "3cd0c6104366";
  var root = document.documentElement;
  root.dataset.av = ASSET_V;
  var params = new URLSearchParams(location.search);
  var bands = ["dawn", "day", "dusk", "night"];
  var seasons = ["spring", "summer", "autumn", "winter"];
  var rainy = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67,
               71, 73, 75, 77, 80, 81, 82, 85, 86, 95, 96, 99];
  var codes = [0, 1, 2, 3, 45, 48].concat(rainy);
  var weather = null, fetching = null, fetchFailed = false;
  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var infoEl = document.getElementById("info");
  var statusEl = document.getElementById("weather-status");

  function seoulDate(now) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"
    }).format(now);
  }
  function seoulMinutes(now) {
    var parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).formatToParts(now);
    var p = {};
    parts.forEach(function (x) { p[x.type] = x.value; });
    return Number(p.hour) * 60 + Number(p.minute);
  }
  function minutesOf(iso) {
    var m = /^\d{4}-\d{2}-\d{2}T(\d\d):(\d\d)/.exec(iso || "");
    return m && Number(m[1]) < 24 && Number(m[2]) < 60
      ? Number(m[1]) * 60 + Number(m[2]) : null;
  }
  function hhmm(min) {
    return String(Math.floor(min / 60) % 24).padStart(2, "0") + ":" +
           String(min % 60).padStart(2, "0");
  }
  function validSun(min) { return Number.isInteger(min) && min >= 0 && min < 1440; }
  try {
    var cached = JSON.parse(localStorage.getItem(WKEY) || "null");
    var age = cached && Date.now() - cached.t;
    if (cached && Number.isFinite(cached.t) && age >= 0 && age < 3 * 3600000 &&
        codes.indexOf(cached.cd) >= 0 && Number.isFinite(cached.tp)) {
      weather = cached;
      // 이전 캐시는 조회 시각에서 날짜를 복원한다. 전날의 일출은 쓰지 않는다.
      weather.day = cached.day || seoulDate(new Date(cached.t));
    }
  } catch (e) {}

  function forcedWeather() {
    var w = params.get("w");
    return w === "rain" || w === "clear" ? w : null;
  }
  function currentWeather() {
    return forcedWeather() || (weather && rainy.indexOf(weather.cd) >= 0 ? "rain" : "clear");
  }
  function todaySun() {
    if (!weather || weather.day !== seoulDate(new Date()) ||
        !validSun(weather.sr) || !validSun(weather.ss)) return null;
    return { sr: weather.sr, ss: weather.ss };
  }
  function seasonOf() {
    var chosen = params.get("s") || window.naeruSettings.season;
    if (seasons.indexOf(chosen) >= 0) return chosen;
    var m = Number(new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, month: "numeric"
    }).format(new Date()));
    return m === 12 || m <= 2 ? "winter" : m <= 5 ? "spring" : m <= 8 ? "summer" : "autumn";
  }
  function currentVariant() {
    var band = params.get("v") || window.naeruSettings.band;
    if (bands.indexOf(band) < 0) {
      var min = seoulMinutes(new Date()), fake = params.get("h");
      if (fake !== null && /^\d{1,2}$/.test(fake) && Number(fake) < 24) min = Number(fake) * 60;
      var sun = todaySun();
      if (sun) {
        band = min >= sun.sr - 40 && min < sun.sr + 50 ? "dawn"
             : min >= sun.sr + 50 && min < sun.ss - 50 ? "day"
             : min >= sun.ss - 50 && min < sun.ss + 40 ? "dusk" : "night";
      } else {
        band = min >= 300 && min < 480 ? "dawn" : min >= 480 && min < 1020 ? "day"
             : min >= 1020 && min < 1200 ? "dusk" : "night";
      }
    }
    return band + (currentWeather() === "rain" ? "-rain" : "");
  }
  function skyOf(c) {
    if (c === 0) return "맑음";
    if (c === 1) return "대체로 맑음";
    if (c === 2) return "구름 조금";
    if (c === 3) return "흐림";
    if (c === 45 || c === 48) return "안개";
    if (c >= 51 && c <= 57) return "이슬비";
    if (c >= 61 && c <= 67) return "비";
    if (c >= 71 && c <= 77) return "눈";
    if (c >= 80 && c <= 82) return "소나기";
    if (c === 85 || c === 86) return "소낙눈";
    return "뇌우";
  }
  function renderInfo() {
    var bits = ["서울"], sun = todaySun(), min = seoulMinutes(new Date());
    var stale = weather && (fetchFailed || Date.now() - weather.t > 15 * 60000);
    if (weather && !forcedWeather()) {
      bits.push(Math.round(weather.tp) + "°", skyOf(weather.cd));
      if (sun) {
        if (min < sun.sr) bits.push("일출 " + hhmm(sun.sr));
        else if (min < sun.ss) bits.push("일몰 " + hhmm(sun.ss));
        else if (validSun(weather.sr2)) bits.push("일출 " + hhmm(weather.sr2));
      }
      if (stale) bits.push("갱신 지연");
    }
    infoEl.innerHTML = bits.join('<span class="sep">·</span>');
    infoEl.classList.add("on");
    statusEl.textContent = forcedWeather() ? "날씨 풍경을 미리 보고 있어요."
      : weather ? "날씨 확인 " + hhmm(seoulMinutes(new Date(weather.t))) +
        (stale ? " · 연결되면 다시 갱신해요." : " · 5분마다 갱신해요.")
      : fetchFailed ? "날씨를 불러오지 못했어요. 잠시 뒤 다시 확인할게요."
      : "서울 날씨를 확인하고 있어요.";
  }

  /* 응답을 모두 검증한 다음 한 번에 교체한다. 오류 JSON과 이전 성공 시각을
     섞으면 비 문구 아래 맑은 배경이 생기고 캐시 수명도 잘못 늘어난다. */
  function fetchWeather() {
    if (forcedWeather()) return Promise.resolve();
    if (fetching) return fetching;
    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 8000);
    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=37.5665&longitude=126.978&current=weather_code,temperature_2m" +
      "&daily=sunrise,sunset&forecast_days=2&timezone=Asia%2FSeoul";
    fetching = fetch(url, { signal: controller.signal })
      .then(function (r) {
        if (!r.ok) throw new Error("날씨 HTTP " + r.status);
        return r.json();
      }).then(function (d) {
        var c = d && d.current, daily = d && d.daily;
        if (!c || !daily || codes.indexOf(c.weather_code) < 0 ||
            !Number.isFinite(c.temperature_2m)) throw new Error("날씨 응답 형식");
        var rises = daily.sunrise || [], sets = daily.sunset || [];
        var sr = minutesOf(rises[0]), ss = minutesOf(sets[0]);
        var sr2 = minutesOf(rises[1]);
        if (sr === null || ss === null || sr >= ss || sr2 === null ||
            rises[0].slice(0, 10) !== seoulDate(new Date())) throw new Error("일출 날짜");
        var next = { cd: c.weather_code, tp: c.temperature_2m, sr: sr, ss: ss,
          sr2: sr2, day: rises[0].slice(0, 10), t: Date.now(),
          w: rainy.indexOf(c.weather_code) >= 0 ? "rain" : "clear" };
        weather = next; fetchFailed = false;
        try { localStorage.setItem(WKEY, JSON.stringify(next)); } catch (e) {}
      }).catch(function () { fetchFailed = true; })
      .finally(function () {
        clearTimeout(timeout); fetching = null; render();
      });
    return fetching;
  }

  /* ── 배경과 내루미를 같은 세대로 표시 ───────────────────────── */
  var bgs = [document.getElementById("bgA"), document.getElementById("bgB")];
  var videos = [document.getElementById("naeruA"), document.getElementById("naeruB")];
  var still = document.getElementById("naeruStill");
  var stage = document.getElementById("stage");
  var slot = 0, active = null, activeSeason = null, requested = null;
  var generation = 0, noMotion = window.naeruReduced(), fallback = false, retries = 0;
  var format = null, formatPromise = null, stopWatch = function () {};
  function av(file) { return "img/" + file + "?v=" + ASSET_V; }
  function bgOf(v, s) { return av("bg-" + v + "-" + s + ".jpg"); }
  function stillOf(v) { return av("naeru-" + v + ".png"); }
  function layout() { layoutFrameBox(stage); }
  addEventListener("resize", layout); layout();

  function sceneReady(ready) {
    root.dataset.sceneReady = String(ready);
    document.dispatchEvent(new Event("naeru:scene"));
  }
  function decodeImage(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(); };
      img.onerror = function () { reject(new Error("그림 로딩 실패")); };
      img.src = url;
    });
  }
  function firstFrame(v) {
    return new Promise(function (resolve) {
      var timeout;
      function done() {
        clearTimeout(timeout);
        v.removeEventListener("loadeddata", done); v.removeEventListener("error", done);
        resolve(v.readyState >= 2 && !v.error);
      }
      v.addEventListener("loadeddata", done); v.addEventListener("error", done);
      timeout = setTimeout(done, 4000);
      if (v.readyState >= 2 || v.error) done();
    });
  }
  // Safari는 VP9를 재생해도 알파를 버릴 수 있다. 투명 프로브를 직접 그려 판정한다.
  // 정지 모드에서는 프로브도 요청하지 않고, 움직임이 필요할 때 처음 판정한다.
  function getFormat() {
    if (format) return Promise.resolve(format);
    if (formatPromise) return formatPromise;
    formatPromise = new Promise(function (resolve) {
      var probe = document.createElement("video"), done = false, timeout;
      probe.muted = true; probe.playsInline = true;
      function finish(fmt) {
        if (done) return;
        done = true; clearTimeout(timeout); format = fmt;
        probe.pause(); probe.removeAttribute("src"); probe.load(); resolve(fmt);
      }
      probe.addEventListener("loadeddata", function () {
        try {
          var canvas = document.createElement("canvas"); canvas.width = canvas.height = 2;
          var ctx = canvas.getContext("2d"); ctx.drawImage(probe, 0, 0, 2, 2);
          finish(ctx.getImageData(0, 0, 1, 1).data[3] === 0 ? "webm" : "mp4");
        } catch (e) { finish("mp4"); }
      });
      probe.addEventListener("error", function () { finish("mp4"); });
      function check() {
        timeout = setTimeout(function () {
          if (document.hidden) { check(); return; }
          finish("mp4");
        }, 2500);
      }
      probe.src = av("alpha-probe.webm"); probe.load(); check();
    });
    return formatPromise;
  }
  function watchPlayback(v, token) {
    var moved = false, retried = false, timer;
    function mark() { moved = true; }
    v.addEventListener("timeupdate", mark);
    stopWatch = function () { clearTimeout(timer); v.removeEventListener("timeupdate", mark); };
    function judge() {
      timer = setTimeout(function () {
        if (token !== generation || noMotion) { stopWatch(); return; }
        if (document.hidden || v.dataset.pauseOwner) { moved = false; judge(); return; }
        if (moved) { stopWatch(); return; }
        if (!retried) {
          retried = true; v.play().catch(function () {}); judge(); return;
        }
        stopWatch(); fallback = true;
        videos.forEach(function (x) { x.pause(); x.classList.remove("on"); });
        still.src = stillOf(active); still.classList.add("on");
      }, 1800);
    }
    judge();
  }

  function showScene(variant, season) {
    var token = ++generation, nextSlot = active ? 1 - slot : slot;
    var key = variant + "/" + season, url = bgOf(variant, season);
    requested = key; stopWatch(); sceneReady(false);
    // 첫 화면의 시계와 배경은 날씨 요청을 기다리지 않는다.
    if (!active) {
      root.style.setProperty("--still", 'url("' + url + '")');
      still.src = stillOf(variant); still.classList.add("on");
    }
    function commit(video) {
      if (token !== generation) return;
      var oldSlot = 1 - nextSlot;
      active = variant; activeSeason = season; slot = nextSlot;
      root.dataset.season = season;
      document.body.dataset.variant = variant;
      document.body.dataset.weather = variant.endsWith("-rain") ? "rain" : "clear";
      root.style.setProperty("--fall-far", season === "winter"
        ? 'url("' + av("snow-far.png") + '")' : "none");
      root.style.setProperty("--fall-near", season === "winter"
        ? 'url("' + av("snow-near.png") + '")' : "none");
      bgs[nextSlot].style.backgroundImage = 'url("' + url + '")';
      bgs[nextSlot].classList.add("on"); bgs[oldSlot].classList.remove("on");
      still.src = stillOf(variant);
      still.classList.toggle("on", !video);
      videos.forEach(function (v) {
        v.classList.toggle("on", v === video);
        if (v !== video && !video) v.pause();
      });
      sceneReady(true);
      if (video) watchPlayback(video, token);
      setTimeout(function () {
        if (token !== generation) return;
        root.style.setProperty("--still", 'url("' + url + '")');
        var old = videos[oldSlot]; old.pause(); old.removeAttribute("src"); old.load();
      }, noMotion ? 0 : 2700);
    }
    Promise.all([decodeImage(url), decodeImage(stillOf(variant))]).then(function () {
      if (token !== generation) return;
      if (noMotion || fallback || document.hidden) { commit(null); return; }
      // 첫 접속은 정지본을 먼저 띄우고 디코딩된 영상으로 교체한다.
      if (!active) commit(null);
      getFormat().then(function (fmt) {
        if (token !== generation) return;
        // 코덱 판정을 기다리다 탭이 숨겨져도 요청한 장면은 정지본으로 확정한다.
        // 여기서 반환만 하면 requested와 active가 달라 복귀 후에도 전환이 막힌다.
        if (noMotion || document.hidden) { commit(null); return; }
        var video = videos[nextSlot];
        video.poster = stillOf(variant); video.src = av("naeru-" + variant + "." + fmt);
        delete video.dataset.pauseOwner;
        video.play().catch(function () {});
        firstFrame(video).then(function (ok) {
          if (token !== generation || noMotion) return;
          if (!ok) { fallback = true; commit(null); return; }
          commit(video);
        });
      });
    }).catch(function () {
      if (token !== generation) return;
      requested = null; sceneReady(Boolean(active));
    });
  }
  videos.forEach(function (v) {
    v.addEventListener("error", function () {
      if (!v.classList.contains("on") || !v.getAttribute("src")) return;
      fallback = true; stopWatch(); v.pause(); v.classList.remove("on");
      still.src = stillOf(active); still.classList.add("on");
    });
  });

  function render() {
    var now = new Date(), min = seoulMinutes(now);
    timeEl.innerHTML = hhmm(min).replace(":", '<span class="colon">:</span>');
    timeEl.dateTime = now.toISOString(); timeEl.setAttribute("aria-label", "서울 " + hhmm(min));
    var korean = window.naeruSettings.date === "ko";
    dateEl.textContent = new Intl.DateTimeFormat(korean ? "ko-KR" : "en-US", {
      timeZone: TZ, month: korean ? "long" : "short", day: "numeric",
      year: korean ? undefined : "numeric", weekday: korean ? "long" : undefined
    }).format(now);
    dateEl.dateTime = seoulDate(now);
    renderInfo();
    var variant = currentVariant(), season = seasonOf();
    if (requested !== variant + "/" + season) showScene(variant, season);
  }
  document.addEventListener("naeru:settings", function () {
    params = new URLSearchParams(location.search);
    var reduced = window.naeruReduced();
    if (noMotion !== reduced) {
      noMotion = reduced; requested = null;
      videos.forEach(function (v) { v.pause(); });
      if (noMotion) still.classList.add("on");
    }
    render();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { videos.forEach(function (v) { v.pause(); }); return; }
    render();
    if (!noMotion && active && requested === active + "/" + activeSeason) {
      var v = videos[slot];
      if ((!v.getAttribute("src") || fallback) && retries < 3) {
        retries++; fallback = false; showScene(active, activeSeason);
      } else if (!fallback) v.play().catch(function () {});
    }
    if (!weather || Date.now() - weather.t > 60000) fetchWeather();
  });
  render(); fetchWeather();
  setInterval(function () { if (!document.hidden) fetchWeather(); }, 300000);
  (function tick() {
    setTimeout(function () { render(); tick(); }, 60000 - Date.now() % 60000 + 50);
  })();
})();
</script>

<script>
/* ── 공 콩 ────────────────────────────────────────────────────────
   몇 분에 한 번, 화면 밖에서 공이 날아와 내루미 머리를 때리고 튕겨
   나간다. 시계·배경 코드와 독립된 IIFE라 여기서 터져도 본체는 멀쩡.

   왜 DOM인가: 배경은 316프레임 핑퐁 루프라 영상에 구우면 (1) 13초마다
   반복돼서 "가끔"이 안 되고 (2) 후반부가 역재생이라 때린 게 도로 안
   때린 게 된다. 랜덤 타이밍은 구조상 DOM일 수밖에 없다.

   왜 이건 좌표가 안 어긋나는가: 위치 계산을 개체마다 하지 않는다.
   #frame 하나만 cover 사각형으로 맞춰두고 공은 그 안에서 프레임
   비율로 움직이므로, 화면비가 뭐든 머리 위치와 크기가 같이 따라간다.

   맞는 연기는 공 쪽(찌그러짐 + 임팩트 링) + 배경 190ms 흔들림에 더해,
   내루미 쪽도 hit()가 window.naeru.flinch(dir)를 불러 함께 움찔한다.
   그 뒤 공은 옆 풀밭에 떨어져 통통 구르다 멈추고 사라진다(drop)
   (naeru-split/PLAN §4.4 — 내루미가 DOM으로 분리되기 전엔 구워진
   캐릭터라 움찔이 불가능했던 시절의 흔적이 이 함수였다).

   ?ball=0 끄기 / ?ball=1 즉시·반복(빈도 튜닝용) ─────────────────── */
(function () {
  var flag = new URLSearchParams(location.search).get("ball");
  if (flag === "0") return;
  var DEBUG = flag === "1";

  // window.naeru가 없을 때(행동 IIFE가 꺼졌거나 터졌을 때)의 폴백 조준점.
  // 있으면 naeru.headAt()이 폴짝·움찔 중의 실제 위치를 대신 준다
  var HEAD_U = 0.523, HEAD_V = 0.634;
  var BALL_W = 0.024;                   // 프레임 폭 대비 공 지름
  var IN_MS  = 640, HIT_MS = 110, OUT_MS = 820;
  var FIRST  = [7000, 15000];           // 첫 등장까지
  var GAP    = [40000, 120000];         // 그 뒤 간격 — 여기만 만지면 됨

  var frame = document.getElementById("frame");
  var ball  = document.getElementById("ball");
  var bonk  = document.getElementById("bonk");
  var root  = document.documentElement;
  var W = 0, H = 0;                     // 프레임 박스 크기(px)

  function layout() {
    var box = layoutFrameBox(frame);      // #stage와 같은 공용 식(전역 함수)
    W = box.W; H = box.H;
    // 좌우 마진을 반지름만큼 당겨두면 transform 좌표 = 공의 중심
    var d = BALL_W * W;
    ball.style.width = ball.style.height = d + "px";
    ball.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
  }
  addEventListener("resize", layout);
  layout();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function qbez(p0, c, p1, t) {         // 2차 베지어 = 던진 궤적
    var u = 1 - t;
    return [u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0],
            u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]];
  }

  function place(u, v, rot, sx, sy) {
    ball.style.transform =
      "translate(" + (u * W).toFixed(1) + "px," + (v * H).toFixed(1) + "px)" +
      " rotate(" + rot.toFixed(1) + "deg) scale(" + sx.toFixed(3) + "," +
      sy.toFixed(3) + ")";
  }

  function shake() {
    var t0 = performance.now(), MS = 190;
    (function step(now) {
      var t = (now - t0) / MS;
      if (t >= 1) { root.style.setProperty("--bg-shake", "none"); return; }
      var damp = (1 - t) * (1 - t);
      root.style.setProperty("--bg-shake",
        "scale(1.008) translate(" +
        (Math.sin(t * Math.PI * 6) * 3.2 * damp).toFixed(2) + "px," +
        (Math.cos(t * Math.PI * 5) * 2.0 * damp).toFixed(2) + "px)");
      requestAnimationFrame(step);
    })(t0);
  }

  function ring(head) {                 // 임팩트 순간 퍼지는 원
    var d = BALL_W * W * 2.0;
    var at = "translate(" + (head.x * W).toFixed(1) + "px," +
             (head.y * H).toFixed(1) + "px)";
    bonk.style.transition = "none";
    bonk.style.width = bonk.style.height = d + "px";
    bonk.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
    bonk.style.borderWidth = Math.max(1.5, d * 0.045).toFixed(1) + "px";
    bonk.style.transform = at + " scale(.35)";
    bonk.style.opacity = ".85";
    requestAnimationFrame(function () {
      bonk.style.transition =
        "transform .42s cubic-bezier(.2,.7,.3,1), opacity .42s ease-out";
      bonk.style.transform = at + " scale(1.5)";
      bonk.style.opacity = "0";
    });
  }

  /* 맞은 뒤: 튕겨 올랐다가 내루미 옆 풀밭에 떨어져 두어 번 통통 구르고
     멈춘 다음 사라진다. 화면 밖으로 날려버리는 것보다 "맞고 떨어졌다"가
     읽히고, 공이 어디로 갔는지 눈이 따라갈 수 있다.

     떨어지는 자리는 가로 0.40~0.62로 묶는다 — 세로 모바일에서 보이는 구간이
     프레임 가로 37~63%뿐이라 그 밖에 떨어지면 화면 밖에서 사라진다.
     지면(0.835)은 발끝(0.796)보다 아래로 잡아 공이 앞쪽에 놓인 것처럼 보이게 했다 */
  var GROUND_V = 0.835, GRAVITY = 2.6, BOUNCE_E = 0.42;

  function drop(dir, spin, head) {
    var ballR = (BALL_W / 2) * (W / H);        // 공 반지름을 세로 비율로
    var restV = GROUND_V - ballR;
    var u = head.x, v = head.y;
    var vx = dir * 0.14, vy = -0.30;           // 프레임 비율/초
    var rot = spin * 0.25, squash = 0, settled = 0;
    var grounded = false, bounces = 0, elapsed = 0;
    var last = performance.now();

    (function step(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      elapsed += dt;
      // 지면에 멈춘 뒤에는 중력을 다시 더하지 않는다. 낮은 fps에서 매번
      // 중력만큼 속도가 생겨 영원히 튀던 문제를 막고 반동 횟수도 제한한다.
      if (grounded) { settled += dt; vx *= Math.pow(0.001, dt); }
      else vy += GRAVITY * dt;
      u += vx * dt;
      v += vy * dt;
      if (v >= restV) {                        // 착지 — 튕기고 감쇠
        v = restV;
        if (!grounded && vy * BOUNCE_E > 0.07 && bounces < 3 && elapsed < 4) {
          vy = -vy * BOUNCE_E; vx *= 0.72; squash = 1; bounces++;
        } else { vy = 0; grounded = true; }
      }
      u = Math.max(0.40, Math.min(0.62, u));
      rot += vx * dt * 900;                    // 구르는 만큼 돌린다
      squash = Math.max(0, squash - dt * 9);
      place(u, v, rot, 1 + squash * 0.22, 1 - squash * 0.18);

      if (settled < 0.6) { requestAnimationFrame(step); return; }  // 멈춘 걸 보여준 뒤
      // 멈춘 뒤 잠깐 두었다가 페이드아웃
      ball.style.transition = "opacity .8s ease";
      ball.style.opacity = "0";
      setTimeout(function () {
        ball.style.transition = "";
        if (window.naeru) window.naeru.busy = false;
        schedule();
      }, 850);
    })(last);
  }

  function hit(dir, spin, head) {       // 찌그러졌다 돌아오는 한 박자
    ring(head);
    shake();
    if (window.naeru) window.naeru.flinch(dir);   // 맞은 놈이 더 흔들리는 게 맞다
    var t0 = performance.now();
    (function step(now) {
      var t = (now - t0) / HIT_MS;
      if (t >= 1) { drop(dir, spin, head); return; }
      var k = Math.sin(t * Math.PI);
      place(head.x, head.y, spin, 1 + .30 * k, 1 - .28 * k);
      requestAnimationFrame(step);
    })(t0);
  }

  function toss() {
    var dir = Math.random() < 0.5 ? 1 : -1;        // 1 = 왼쪽에서 날아옴
    // 목표점은 이 던지기 하나에 고정 — 도중에 폴짝이 끼어들어도 흔들리지
    // 않게. window.naeru 없으면(행동 IIFE 꺼짐/에러) 상수로 폴백
    var head = window.naeru ? window.naeru.headAt() : { x: HEAD_U, y: HEAD_V };
    if (window.naeru) window.naeru.busy = true;    // 날아오는 동안 새 행동 금지
    // 프레임은 항상 뷰포트보다 넓으므로, 프레임 밖 = 화면 밖이 보장된다
    var p0 = [dir > 0 ? -0.14 : 1.14, rand(0.20, 0.32)];
    var p1 = [head.x, head.y];
    // 조절점을 출발 높이에 두고 가로로 절반쯤 밀면 포물선 낙하가 된다
    var c  = [p0[0] + (p1[0] - p0[0]) * 0.55, p0[1] - 0.04];
    var spin = rand(140, 300) * dir;
    var t0 = performance.now();
    ball.style.opacity = "1";
    (function step(now) {
      var t = (now - t0) / IN_MS;
      if (t >= 1) { hit(dir, spin, head); return; }
      var e = t * t * .35 + t * .65;               // 끝에서 살짝 가속
      var p = qbez(p0, c, p1, e);
      place(p[0], p[1], spin * e, 1, 1);
      requestAnimationFrame(step);
    })(t0);
  }

  function schedule(first) {
    var ms = DEBUG ? (first ? 1000 : 5000)
                   : rand.apply(null, first ? FIRST : GAP);
    setTimeout(function () {
      if (document.hidden) { schedule(); return; }  // 숨은 탭에선 건너뜀
      // 폴짝·두리번 중이면 미룬다. 조준점은 던지는 순간 한 번만 읽으므로
      // 그때 내루미가 공중이면 640ms 뒤엔 이미 내려와 있어 빗나간다.
      // 나비가 와 있을 때도 미룬다 — 둘이 겹치면 어디를 봐야 할지 모른다
      if (window.naeru && (window.naeru.busy || window.naeru.hold)) { schedule(); return; }
      toss();
    }, ms);
  }
  var motion = createSceneMotion(function () { schedule(true); }, function () {
    ball.style.opacity = "0"; ball.style.transition = ""; bonk.style.opacity = "0";
    root.style.setProperty("--bg-shake", "none");
    if (window.naeru) window.naeru.busy = false;
  });
  var requestAnimationFrame = motion.frame, setTimeout = motion.later;
  motion.start();
})();
</script>

<script>
/* ── 내루미 행동: 제자리 반응 — 폴짝 · 두리번 · 좌우 뒤집기.
   (움찔은 공 IIFE의 hit()가 window.naeru.flinch()로 직접 부른다.)
   공 IIFE와 같은 패턴의 독립 IIFE — 여기가 터져도 시계·배경·공은 살아야
   한다. window.naeru를 공개해서 공 IIFE와 최소한의 계약만 주고받는다.

   진폭 상한은 구워진 접지 그림자가 정한다(그림자가 몸을 안 따라오므로):
   수직(폴짝)은 자기 키의 15% — 자유. 수평(움찔·두리번)은 ±20px@4K(폭의
   6%)까지만. 회전은 2.5deg까지만 — 넘으면 발이 미끄러진 것처럼 보인다.

   transform은 요소 하나에 하나씩: #naeru-move=폴짝(translateY) /
   #naeru-act=움찔·두리번(rotate·translateX·scale) / #naeru-face=방향
   (scaleX). 겹을 안 지키면 서로 덮어쓴다.

   ?act=0 전체 끄기 / ?act=hop|look|flip 해당 동작만 5초 간격 반복 ───── */
(function () {
  var params = new URLSearchParams(location.search);
  var actFlag = params.get("act");
  if (actFlag === "0") return;
  var IDLE_KINDS = ["doze", "stretch", "shiver", "idle"];
  var DEBUG = ["hop", "look", "flip"].concat(IDLE_KINDS).indexOf(actFlag) >= 0
              ? actFlag : null;

  var move = document.getElementById("naeru-move");
  var act  = document.getElementById("naeru-act");
  var face = document.getElementById("naeru-face");
  var head = document.getElementById("naeru-head");
  var brow = document.getElementById("naeru-brow");
  var stage = document.getElementById("stage");
  if (!move || !act || !face || !head || !brow || !stage) return;

  var facing = 1;              // 1 = 원래 방향, -1 = 좌우 뒤집힘
  var HOP_GAP  = [8000, 30000];
  var LOOK_GAP = [13000, 40000];
  var IDLE_GAP = [30000, 80000];   // 졸기·기지개·부르르가 도는 간격

  window.naeru = {
    busy:   false,      // 공이 날아오는 동안(또는 자체 행동 중) 새 행동 금지
    /* 나비가 오는 동안 통째로 잡아 둔다. busy와 따로 둔 이유: 나비가 busy를
       직접 잡으면 앉는 순간의 peek()이 자기 자신 때문에 건너뛰어진다.
       hold는 "새 동작을 시작하지 마라"만 뜻하고, peek는 busy만 본다. */
    hold:   false,
    flinch: flinch,
    peek:   peek,       // 나비 IIFE가 "머리에 앉았다"고 알릴 때 쓴다
    headAt: headAt,     // 머리 꼭대기 — 공의 조준점
    browAt: browAt      // 두 눈 사이 — 나비가 앉는 자리
  };

  function rand(a, b) { return a + Math.random() * (b - a); }

  function anchorAt(el, fx, fy) {        // 기준점의 현재 화면 좌표(프레임 비율)
    var r = el.getBoundingClientRect();
    var s = stage.getBoundingClientRect();
    // #stage가 아직 크기를 못 받은 순간의 폴백. 프레임 비율이어야 한다 —
    // 크롭 기준 비율(0.436, 0.143)을 넣으면 공이 엉뚱한 데로 날아간다
    if (!s.width || !s.height) return { x: fx, y: fy };
    return { x: (r.left - s.left) / s.width, y: (r.top - s.top) / s.height };
  }
  function headAt() { return anchorAt(head, 1995 / 3840, 1399 / 2160); }
  function browAt() { return anchorAt(brow, 2000 / 3840, 1445 / 2160); }

  function setMove(t) { move.style.transform = t; }
  function setAct(t)  { act.style.transform  = t; }

  // 공용 타이밍 헬퍼: dur(ms)짜리 구간을 진행률 0→1로 fn에 넘겨 반복 호출.
  // sequence()가 여러 구간을 이어붙여 폴짝·두리번의 여러 박자를 만든다
  function tick(dur, fn, done) {
    var t0 = performance.now();
    (function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      fn(t);
      if (t < 1) requestAnimationFrame(step);
      else if (done) done();
    })(t0);
  }
  function sequence(steps, onDone) {
    var i = 0;
    function next() {
      if (i >= steps.length) { if (onDone) onDone(); return; }
      var s = steps[i++];
      tick(s.dur, s.fn, next);
    }
    next();
  }

  function hop(forceFlip) {
    window.naeru.busy = true;
    var doDouble = Math.random() < 0.2;             // 가끔(20%) 2연속
    // 방향 전환은 공중에서만 한다(§4.5) — 구워진 그림자는 안 뒤집히므로 땅에
    // 붙은 채로 홱 뒤집히면 티가 난다. 뒤집힌 상태면 되돌릴 확률을 높게 둬서
    // 오래 거울상으로 남지 않게 한다(그래도 전환은 늘 공중에서 일어난다)
    var willFlip = forceFlip || Math.random() < (facing < 0 ? 0.7 : 0.2);
    var didFlip  = false;

    sequence([
      { dur: 110, fn: function (t) {                 // 웅크림
          setAct("scale(" + (1 + 0.06 * t) + "," + (1 - 0.08 * t) + ")");
      } },
      { dur: 260, fn: function (t) {                 // 상승 ease-out
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-13 * e) + "%)");
          setAct("scale(" + (1.06 - 0.09 * t) + "," + (0.92 + 0.13 * t) + ")");
          if (willFlip && !didFlip && t > 0.4) {   // 정점 부근에서 전환
            didFlip = true;
            facing = -facing;
            face.style.transform = facing < 0 ? "scaleX(-1)" : "";
          }
      } },
      { dur: 220, fn: function (t) {                 // 하강 ease-in — 착지 직전 스케일은 중립
          var e = t * t;
          setMove("translateY(" + (-13 * (1 - e)) + "%)");
          setAct("scale(" + (0.97 + 0.03 * e) + "," + (1.05 - 0.05 * e) + ")");
      } },
      // 착지에 아주 짧은 가로 미끄러짐을 얹는다 — 무게가 실렸다가 버티는 한 박자.
      // 0.5%=2.9px@4K로 §4.1 수평 상한(20px) 한참 아래다
      { dur: 90, fn: function (t) {                  // 착지
          setAct("translateX(" + (facing * 0.5 * t).toFixed(2) + "%) scale(" +
                 (1 + 0.05 * t) + "," + (1 - 0.06 * t) + ")");
      } },
      { dur: 120, fn: function (t) {                 // 착지 복귀
          setAct("translateX(" + (facing * 0.5 * (1 - t)).toFixed(2) + "%) scale(" +
                 (1.05 - 0.05 * t) + "," + (0.94 + 0.06 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct("");   // 방향(facing)은 유지 — 되돌리기도 다음 폴짝의 공중에서
      if (doDouble) setTimeout(hopAgain, 60);
      else { window.naeru.busy = false; schedule("hop"); }
    });
  }

  function hopAgain() {                               // 70% 높이로 한 번 더
    sequence([
      { dur: 90, fn: function (t) {
          setAct("scale(" + (1 + 0.05 * t) + "," + (1 - 0.07 * t) + ")");
      } },
      { dur: 200, fn: function (t) {
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-9.1 * e) + "%)");
          setAct("scale(" + (1.05 - 0.08 * t) + "," + (0.93 + 0.12 * t) + ")");
      } },
      { dur: 170, fn: function (t) {
          var e = t * t;
          setMove("translateY(" + (-9.1 * (1 - e)) + "%)");
          setAct("translateX(" + (facing * 0.4 * (1 - t)).toFixed(2) + "%) scale(" +
                 (0.97 + 0.03 * t) + "," + (1.05 - 0.05 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct("");
      window.naeru.busy = false;
      schedule("hop");
    });
  }

  /* 좌우로 뒤뚱뒤뚱. 한 번 갸웃하고 마는 게 아니라 6~8초 동안 계속 흔든다.
     사인파 한 줄로 만들고, 앞뒤 0.9초는 진폭을 0에서 키웠다 0으로 줄여서
     시작·끝이 툭 튀지 않게 한다(들어올 때 이미 기울어 있으면 순간이동처럼 보임).
     진폭은 §4.1 상한 안: 회전 2.2deg(<2.5), 가로 1.2%=7px@4K(<20px).
     기울 때 살짝 눌러주면 무게가 실려 뒤뚱거리는 느낌이 난다 */
  function look() {
    window.naeru.busy = true;
    var dir = Math.random() < 0.5 ? 1 : -1;
    var dur = rand(6000, 8000);
    var period = rand(1500, 1900);                    // 한 번 왕복하는 데 걸리는 시간
    tick(dur, function (t) {
      var ms = t * dur;
      var env = Math.min(1, ms / 900, (dur - ms) / 900);   // 시작·끝 진폭 봉투
      var k = Math.sin(ms / period * Math.PI * 2) * env * dir;
      setAct("rotate(" + (k * 2.2).toFixed(2) + "deg) translateX(" +
             (k * 1.2).toFixed(2) + "%) scale(" +
             (1 + Math.abs(k) * 0.012).toFixed(4) + "," +
             (1 - Math.abs(k) * 0.016).toFixed(4) + ")");
    }, function () {
      setAct("");
      window.naeru.busy = false;
      schedule("look");
    });
  }

  function flinch(dir) {                               // 공에 맞을 때 — 공 IIFE가 호출
    dir = dir || (Math.random() < 0.5 ? 1 : -1);
    sequence([
      { dur: 90, fn: function (t) {                    // 90ms에 최대
          setAct("translateX(" + (dir * 0.9 * t) + "%) rotate(" + (dir * 2 * t) +
                 "deg) scale(" + (1 + 0.04 * t) + "," + (1 - 0.06 * t) + ")");
      } },
      { dur: 320, fn: function (t) {                   // 스프링 복귀
          var damp = (1 - t) * (1 - t);
          var k = Math.cos(t * Math.PI * 2.4) * damp;
          setAct("translateX(" + (dir * 0.9 * k) + "%) rotate(" + (dir * 2 * k) +
                 "deg) scale(" + (1 + 0.04 * k) + "," + (1 - 0.06 * k) + ")");
      } }
    ], function () { setAct(""); });
    // #stage가 --bg-shake 그룹이라 배경 셰이크 + 이 움찔이 합성된다.
    // 셰이크는 #stage, 움찔은 #naeru-act로 겹이 나뉘어 서로 안 덮어쓴다.
  }

  /* ── 머리 위 기호 ──────────────────────────────────────────────
     밝은 노을 하늘부터 밤까지 다 얹히므로, 획을 두 번 그린다: 굵은 어두운
     획을 깔고 그 위에 크림색 — 어느 배경에서도 읽힌다(공 테두리와 같은 이유) */
  var emote = document.getElementById("emote");
  var emoteBusy = false;
  var DARK = 'stroke="rgba(58,42,30,.5)" stroke-width="8.5" fill="none" ' +
             'stroke-linecap="round" stroke-linejoin="round"';
  var LITE = 'stroke="#fdf6e4" stroke-width="3.6" fill="none" ' +
             'stroke-linecap="round" stroke-linejoin="round"';
  var ZS   = '<path d="M5 31h9l-9 8h9"/><path d="M17 18h11l-11 10h11"/>' +
             '<path d="M31 5h9l-9 8h9"/>';
  var QS   = '<path d="M13 14a7 7 0 1 1 7.2 7v3.6"/>';
  var EMOTE = {
    zzz:  '<svg viewBox="0 0 45 45"><g ' + DARK + '>' + ZS + '</g><g ' + LITE + '>' +
          ZS + '</g></svg>',
    what: '<svg viewBox="0 0 45 45"><g ' + DARK + '>' + QS +
          '</g><circle cx="20.2" cy="31.5" r="4.6" fill="rgba(58,42,30,.5)"/><g ' +
          LITE + '>' + QS + '</g>' +
          '<circle cx="20.2" cy="31.5" r="2.3" fill="#fdf6e4"/></svg>'
  };

  function showEmote(kind, hold) {
    if (emoteBusy) return;
    emoteBusy = true;
    emote.innerHTML = EMOTE[kind];
    sequence([
      { dur: 240, fn: function (t) {                 // 통 튀어 오른다
          var e = 1 - Math.pow(1 - t, 3);
          emote.style.opacity = Math.min(1, t * 2.4).toFixed(3);
          emote.style.transform = "translateY(" + (-9 * e).toFixed(1) + "%) scale(" +
                                  (0.45 + 0.65 * e).toFixed(3) + ")";
      } },
      { dur: hold || 900, fn: function (t) {         // 천천히 떠 있는다
          emote.style.transform = "translateY(" + (-9 - 5 * t).toFixed(1) + "%) scale(1.1)";
      } },
      { dur: 420, fn: function (t) {
          emote.style.opacity = (1 - t).toFixed(3);
          emote.style.transform = "translateY(" + (-14 - 7 * t).toFixed(1) + "%) scale(" +
                                  (1.1 - 0.12 * t).toFixed(3) + ")";
      } }
    ], function () { emote.style.opacity = "0"; emote.innerHTML = ""; emoteBusy = false; });
  }

  /* ── 꾸벅꾸벅 졸기 ─────────────────────────────────────────────
     **내려앉는 걸 translateY로 하면 안 된다** — 구워진 접지 그림자는 안
     따라오므로 발이 땅에 박힌 것처럼 보인다. scaleY 압축이면 origin이
     발끝이라 접지가 그대로 유지된다(§4.1). 기울기는 1.6deg로 상한(2.5) 안 */
  function doze() {
    window.naeru.busy = true;
    var night = (document.body.dataset.variant || "").indexOf("night") === 0;
    var dir = facing > 0 ? -1 : 1;                   // 얼굴 쪽으로 고개가 떨어진다
    var nods = 2 + (Math.random() < 0.5 ? 1 : 0);
    var sink = 1000;
    if (night) showEmote("zzz", nods * (sink + 200));

    function pose(k) {                               // k: 0=깨어있음 1=푹 숙임
      setAct("rotate(" + (dir * 1.6 * k).toFixed(2) + "deg) scale(" +
             (1 + 0.012 * k).toFixed(4) + "," + (1 - 0.045 * k).toFixed(4) + ")");
    }
    var steps = [];
    for (var i = 0; i < nods; i++) {
      steps.push({ dur: sink, fn: function (t) { pose(t * t); } });        // 스르르
      steps.push({ dur: 190,  fn: function (t) { pose(1 - t); } });        // 화들짝
    }
    sequence(steps, function () {
      setAct(""); window.naeru.busy = false; schedule("idle");
    });
  }

  /* 기지개 — 웅크렸다 위로 쭉. 발끝 origin이라 세로로 늘려도 접지는 그대로 */
  function stretch() {
    window.naeru.busy = true;
    sequence([
      { dur: 240, fn: function (t) {
          setAct("scale(" + (1 + 0.03 * t) + "," + (1 - 0.04 * t) + ")");
      } },
      { dur: 640, fn: function (t) {
          var e = 1 - Math.pow(1 - t, 2);
          setAct("scale(" + (1.03 - 0.06 * e) + "," + (0.96 + 0.10 * e) + ")");
      } },
      { dur: 540, fn: function (t) {
          var e = t * t;
          setAct("scale(" + (0.97 + 0.03 * e) + "," + (1.06 - 0.06 * e) + ")");
      } }
    ], function () { setAct(""); window.naeru.busy = false; schedule("idle"); });
  }

  /* 비 올 때 부르르. 빠르게(13Hz) 아주 작게(0.45%=2.6px@4K) — 진폭을 키우면
     떠는 게 아니라 미끄러지는 것처럼 보인다 */
  function shiver() {
    window.naeru.busy = true;
    var dur = rand(800, 1200), dir = Math.random() < 0.5 ? 1 : -1;
    tick(dur, function (t) {
      var env = Math.sin(Math.PI * t);               // 시작·끝 진폭 봉투
      var k = Math.sin(t * dur / 1000 * Math.PI * 2 * 13) * env * dir;
      setAct("translateX(" + (k * 0.45).toFixed(3) + "%) rotate(" +
             (k * 0.5).toFixed(2) + "deg) scale(" +
             (1 + Math.abs(k) * 0.006).toFixed(4) + "," +
             (1 - Math.abs(k) * 0.008).toFixed(4) + ")");
    }, function () { setAct(""); window.naeru.busy = false; schedule("idle"); });
  }

  /* 클릭·터치하면 화들짝 놀라 통 뛴다. 지금까지 내루미는 사용자를 전혀
     모르는 존재였다 — 반응 하나로 "살아있다"가 크게 붙는다. */
  function poke(dir) {
    if (window.naeru.busy || window.naeru.hold) return;
    window.naeru.busy = true;
    var d = dir || 1;
    sequence([
      { dur: 80, fn: function (t) {                  // 움찔 웅크림
          setAct("translateX(" + (d * 0.5 * t).toFixed(2) + "%) scale(" +
                 (1 + 0.08 * t) + "," + (1 - 0.10 * t) + ")");
      } },
      { dur: 240, fn: function (t) {                 // 통 튀어오름
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-10 * e) + "%)");
          setAct("translateX(" + (d * 0.5 * (1 - t)).toFixed(2) + "%) scale(" +
                 (1.08 - 0.11 * t) + "," + (0.90 + 0.15 * t) + ")");
      } },
      { dur: 200, fn: function (t) {                 // 하강
          var e = t * t;
          setMove("translateY(" + (-10 * (1 - e)) + "%)");
          setAct("scale(" + (0.97 + 0.03 * e) + "," + (1.05 - 0.05 * e) + ")");
      } },
      { dur: 110, fn: function (t) {
          setAct("scale(" + (1 + 0.06 * t) + "," + (1 - 0.07 * t) + ")");
      } },
      { dur: 150, fn: function (t) {
          setAct("scale(" + (1.06 - 0.06 * t) + "," + (0.93 + 0.07 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct(""); window.naeru.busy = false;
    });
  }

  /* 투명 버튼의 click은 마우스·터치·키보드가 같은 경로를 사용한다. */
  var lastPoke = -Infinity;
  document.addEventListener("naeru:greet", function (e) {
    if (!sceneMotionAllowed() || performance.now() - lastPoke < 500) return;
    lastPoke = performance.now();
    poke(e.detail && e.detail.dir || 1);
  });

  /* 나비가 앉았을 때의 짧은 갸웃. 공 IIFE의 flinch와 달리 busy를 존중한다 —
     폴짝 중에 끼어들면 #naeru-act를 서로 덮어쓴다.

     물음표는 **여기서만** 띄운다. 두리번에 확률로 붙여 놨더니 아무 일도 없는데
     혼자 "?"가 떠서 뜬금없었다(2026-09-05 제보). peek()은 나비 IIFE만 부르므로
     이 자리에 두면 나비와 물음표가 구조적으로 한 쌍이 된다 — busy라 갸웃을
     건너뛰면 물음표도 같이 안 뜬다. */
  function peek(dir) {
    // 기호가 먼저다 — busy면 갸웃(#naeru-act)만 건너뛰고 물음표는 그대로 뜬다.
    // 반대로 두면 폴짝 중에 나비가 앉을 때 물음표까지 사라져서 "나비는 왔는데
    // 아무 반응이 없는" 그림이 된다
    showEmote("what", 900);
    if (window.naeru.busy) return;
    window.naeru.busy = true;
    dir = dir || 1;
    function pose(k) {
      setAct("rotate(" + (dir * 1.8 * k).toFixed(2) + "deg) translateX(" +
             (dir * 0.6 * k).toFixed(2) + "%)");
    }
    sequence([
      { dur: 300,  fn: function (t) { pose(1 - Math.pow(1 - t, 2)); } },
      { dur: 1000, fn: function ()  { pose(1); } },
      { dur: 460,  fn: function (t) { pose(1 - t * t); } }
    ], function () { setAct(""); window.naeru.busy = false; });
  }

  /* 무엇을 할지 고른다. 밤엔 졸기, 비엔 부르르가 많아지게 — 이미 있는
     시간대·날씨 상태에 붙여야 "반응하고 있다"로 읽힌다 */
  function idle() {
    if (DEBUG === "doze")    { doze();    return; }
    if (DEBUG === "stretch") { stretch(); return; }
    if (DEBUG === "shiver")  { shiver();  return; }
    var night = (document.body.dataset.variant || "").indexOf("night") === 0;
    var rain  = document.body.dataset.weather === "rain";
    var r = Math.random();
    if (rain && r < 0.45) { shiver(); return; }
    if (r < (night ? 0.75 : 0.30)) { doze(); return; }
    stretch();
  }

  function schedule(kind) {
    var gap = kind === "hop" ? HOP_GAP : kind === "look" ? LOOK_GAP : IDLE_GAP;
    var ms = DEBUG ? 5000 : rand(gap[0], gap[1]);
    setTimeout(function () {
      if (document.hidden) { schedule(kind); return; }   // 숨은 탭에선 건너뜀
      // 공이 날아오는 중, 자체 동작 중, 나비가 와 있는 중이면 미룬다
      if (window.naeru.busy || window.naeru.hold) { schedule(kind); return; }
      // 무엇을 할지는 kind가 정한다. DEBUG는 빈도만 바꾼다 —
      // 여기서 DEBUG로 분기하면 상시 모드에서 look이 영영 안 돈다
      if (kind === "look") look();
      else if (kind === "idle") idle();
      else hop(DEBUG === "flip");
    }, ms);
  }

  var motion = createSceneMotion(function () {
    if (actFlag === "approach") return;  // 다가오기 미리보기는 한 번만 실행한다.
    if (DEBUG) {
      schedule(DEBUG === "look" ? "look"
               : IDLE_KINDS.indexOf(DEBUG) >= 0 ? "idle" : "hop");
    } else { schedule("hop"); schedule("look"); schedule("idle"); }
  }, function () {
    setMove(""); setAct(""); face.style.transform = ""; facing = 1;
    emote.style.opacity = "0"; emote.innerHTML = ""; emoteBusy = false;
    window.naeru.busy = false; window.naeru.hold = false;
  });
  var requestAnimationFrame = motion.frame, setTimeout = motion.later;
  motion.start();
})();
</script>

<script>
/* ── 나비 ──────────────────────────────────────────────────────────
   가끔 한 마리가 날아와 내루미 머리에 잠깐 앉았다 간다.

   공과 같은 이유로 #frame 안에 있다 — 랜덤 타이밍이라 영상에 못 굽고,
   프레임 비율 좌표라야 화면비가 뭐든 머리에 맞는다. #frame이 변형별
   그레이딩 필터를 갖고 있어서 밤·비에서 혼자 뜨는 것도 자동으로 해결된다.

   앉아 있는 동안은 window.naeru.headAt()을 매 프레임 따라간다 — 그래야
   앉은 채로 폴짝 뛰어도 머리에 붙어 있다. busy는 잡지 않는다(나비를 얹은
   채 뛰는 게 더 재미있다). 앉는 순간에만 peek()으로 갸웃하게 하고, 그건
   busy를 존중하므로 폴짝 중이면 그냥 건너뛴다.

   ?flit=0 끄기 / ?flit=1 자주 ─────────────────────────────────── */
(function () {
  var flag = new URLSearchParams(location.search).get("flit");
  if (flag === "0") return;
  var DEBUG = flag === "1";

  var FIRST = [20000, 50000];
  var GAP   = [70000, 180000];
  var RETRY = [7000, 14000];
  /* 앉을 때 영상을 세운다 — **이게 핵심이다.** 나비는 #naeru-brow(고정 %)를
     따라가는데 영상 속 얼굴은 계속 움직이므로, 영상을 그대로 두면 코에
     붙어 있질 못한다. 세우는 프레임은 혀 개그와 같은 기준 프레임 79이고,
     그 프레임의 눈 위치에 맞춰 #naeru-brow를 잡아 뒀다. 핑퐁이라 한 바퀴에
     두 번(3.29초, 9.875초) 지나가므로, 비행 시간(IN_MS)만큼 앞에서 출발하면
     도착이 곧 그 프레임이 된다. */
  var REF_FRAME = 79, FPS = 24, N_FRAMES = 316;
  var LOOP  = N_FRAMES / FPS;
  var MARKS = [REF_FRAME / FPS, (N_FRAMES - REF_FRAME) / FPS];
  var WINDOW = 1.5 / FPS;
  // 두 눈 사이(크롭 좌표로 62px)에 앉으므로 그보다 좁아야 눈을 안 덮는다.
  // 0.023이면 크롭 환산 87px이라 양쪽 눈을 가렸다(실측)
  var SIZE  = 0.016;                    // 프레임 폭 대비 날개폭
  var IN_MS = 2600, OUT_MS = 2200;

  var frame = document.getElementById("frame");
  var flit  = document.getElementById("flit");
  var wings = document.getElementById("flit-wings");
  var W = 0, H = 0;
  var vid = null;                       // 이번 방문 동안 세워 둘 영상

  function activeVideo() {
    var vs = [document.getElementById("naeruA"), document.getElementById("naeruB")];
    for (var i = 0; i < vs.length; i++) {
      if (vs[i] && vs[i].classList.contains("on") && vs[i].getAttribute("src") && !vs[i].paused) {
        return vs[i];
      }
    }
    return null;
  }

  function layout() {
    var box = layoutFrameBox(frame);
    W = box.W; H = box.H;
    var d = SIZE * W;
    flit.style.width = flit.style.height = d + "px";
    flit.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
  }
  addEventListener("resize", layout);
  layout();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function place(u, v, rot) {
    flit.style.transform = "translate(" + (u * W).toFixed(1) + "px," +
      (v * H).toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg)";
  }
  function flap(hz, now) {              // 날개는 접힘(0.15)~펼침(1) 사이를 오간다
    var k = (Math.sin(now / 1000 * Math.PI * 2 * hz) + 1) / 2;
    wings.style.transform = "scaleX(" + (0.15 + 0.85 * k).toFixed(3) + ")";
  }

  function perch() {                    // 앉는 자리 = 두 눈 사이
    return window.naeru ? window.naeru.browAt() : { x: 0.521, y: 0.669 };
  }

  function leave(dir) {
    releaseVideo();
    var from = perch(), t0 = performance.now();
    var to = [dir > 0 ? 1.15 : -0.15, rand(0.12, 0.26)];
    (function step(now) {
      var t = (now - t0) / OUT_MS;
      if (t >= 1) { flit.style.opacity = "0"; hold(false); schedule(); return; }
      flap(9, now);
      var e = t * t * 0.7 + t * 0.3;
      var u = from.x + (to[0] - from.x) * e;
      var v = from.y + (to[1] - from.y) * e + Math.sin(t * Math.PI * 3.5) * 0.022;
      place(u, v, Math.sin(t * Math.PI * 3.5) * 12);
      flit.style.opacity = (1 - Math.max(0, (t - 0.75) * 4)).toFixed(3);
      requestAnimationFrame(step);
    })(t0);
  }

  function sit(dir) {
    // 코에 닿는 순간 영상을 세운다. 기준 프레임에 맞춰 도착했더라도 rAF와
    // 영상 시계가 몇 ms 어긋날 수 있으므로 그 프레임으로 스냅한다 —
    // 한두 프레임 차이는 눈에 안 보이지만 눈 위치는 정확해진다
    if (vid) {
      var m = MARKS[0];
      for (var i = 1; i < MARKS.length; i++) {
        if (Math.abs(vid.currentTime - MARKS[i]) < Math.abs(vid.currentTime - m)) m = MARKS[i];
      }
      vid.dataset.pauseOwner = "butterfly";
      vid.pause();
      try { vid.currentTime = m + 0.01; } catch (e) {}
    }
    var t0 = performance.now(), DUR = rand(3500, 6500);
    if (window.naeru) window.naeru.peek(-dir);   // 앉은 쪽으로 갸웃
    (function step(now) {
      var t = now - t0;
      if (t >= DUR) { leave(-dir); return; }
      // 앉아 있을 땐 날개를 편 채로 두고 2.5초마다 한 번 짧게 접는다.
      // 반반으로 여닫게 하면 절반의 시간 동안 얇은 조각으로만 보인다
      var ph = (t / 2500) % 1;
      var fold = ph < 0.12 ? Math.sin(ph / 0.12 * Math.PI) : 0;
      wings.style.transform = "scaleX(" + (1 - 0.72 * fold).toFixed(3) + ")";
      var p = perch();
      place(p.x, p.y, 0);
      requestAnimationFrame(step);
    })(t0);
  }

  var holdTimer = null;
  function hold(on) {
    if (!window.naeru) return;
    window.naeru.hold = on;
    clearTimeout(holdTimer);
    // 안전장치: 탭이 숨는 등으로 비행 rAF가 끊기면 hold가 남아 모든 동작이
    // 영영 멈춘다. 방문 최대 길이(약 11초)의 두 배 남짓에서 강제로 푼다
    if (on) holdTimer = setTimeout(function () { window.naeru.hold = false; }, 25000);
  }

  function arrive(v) {
    vid = v;
    var dir = Math.random() < 0.5 ? 1 : -1;      // 1 = 왼쪽에서 날아옴
    var p0 = [dir > 0 ? -0.15 : 1.15, rand(0.16, 0.30)];
    var t0 = performance.now();
    flit.style.opacity = "1";
    (function step(now) {
      var t = (now - t0) / IN_MS;
      var p1 = perch();                        // 목표는 매 프레임 갱신 — 폴짝해도 따라간다
      if (t >= 1) { sit(dir); return; }
      flap(11, now);
      var e = 1 - Math.pow(1 - t, 2);            // 다가오며 느려진다
      var u = p0[0] + (p1.x - p0[0]) * e;
      var v = p0[1] + (p1.y - p0[1]) * e + Math.sin(t * Math.PI * 4.5) * 0.030 * (1 - e);
      place(u, v, Math.sin(t * Math.PI * 4.5) * 14 * (1 - e));
      requestAnimationFrame(step);
    })(t0);
  }

  /* 도착이 곧 기준 프레임이 되도록, 그 프레임보다 비행 시간만큼 앞에서
     출발한다. 최대 한 바퀴(13.2초)면 반드시 온다 */
  function waitForLaunch(v) {
    var giveUp = performance.now() + 16000;
    (function step(now) {
      if (!v.isConnected || v.paused || document.hidden || now > giveUp) {
        hold(false); schedule("retry"); return;
      }
      var t = v.currentTime;
      for (var i = 0; i < MARKS.length; i++) {
        var launch = (MARKS[i] - IN_MS / 1000 + LOOP) % LOOP;
        if (Math.abs(t - launch) < WINDOW) { arrive(v); return; }
      }
      requestAnimationFrame(step);
    })(performance.now());
  }

  function schedule(kind) {
    var gap = kind === "first" ? FIRST : kind === "retry" ? RETRY : GAP;
    var ms = DEBUG ? (kind === "first" ? 1500 : 6000) : rand.apply(null, gap);
    setTimeout(function () {
      if (document.hidden) { schedule("retry"); return; }
      // 비가 오거나 겨울이면 안 온다 — 나비는 맑은 철의 것이다
      if (document.body.dataset.weather === "rain" ||
          document.documentElement.dataset.season === "winter") {
        schedule("retry"); return;
      }
      // 공이 날아오는 중이거나 자체 동작 중이면 미룬다
      if (window.naeru && (window.naeru.busy || window.naeru.hold)) { schedule("retry"); return; }
      var v = activeVideo();
      if (!v) { hold(true); arrive(null); return; }   // 정지본 폴백 등 — 그냥 날아온다
      hold(true);                                     // 기다리는 동안부터 잡아 둔다
      waitForLaunch(v);
    }, ms);
  }
  function releaseVideo() {
    if (vid && vid.dataset.pauseOwner === "butterfly") {
      delete vid.dataset.pauseOwner;
      if (sceneMotionAllowed() && vid.classList.contains("on")) {
        vid.play().catch(function () {});
      }
    }
    vid = null;
  }
  var motion = createSceneMotion(function () { schedule("first"); }, function () {
    releaseVideo(); hold(false); flit.style.opacity = "0";
  });
  var requestAnimationFrame = motion.frame, setTimeout = motion.later;
  motion.start();
})();
</script>

<script>
/* ── 반딧불이 ──────────────────────────────────────────────────────
   밤에만, 비가 안 올 때만 몇 마리가 초원 위를 천천히 떠다닌다.

   #frame이 아니라 #glow에 들어간다 — #frame은 변형별 그레이딩 필터를
   받는데(밤이면 brightness .60) 빛나야 할 것이 그걸 먹으면 도로 어두워진다.
   좌표계는 #frame과 똑같이 layoutFrameBox로 잡으므로 화면비와 무관하다.

   경로는 주기가 서로 다른 사인 둘을 겹쳐 만든다(리사주) — 난수 걸음보다
   훨씬 부드럽고, 상태를 저장할 게 없어서 코드가 짧다. 밝기는 그와 또 다른
   주기로 깜빡여서 규칙성이 안 느껴진다.

   ?ff=0 끄기 ─────────────────────────────────────────────────── */
(function () {
  if (new URLSearchParams(location.search).get("ff") === "0") return;

  var N = 6;
  var glow = document.getElementById("glow");
  if (!glow) return;
  var W = 0, H = 0;

  function layout() {
    var box = layoutFrameBox(glow);
    W = box.W; H = box.H;
    var d = 0.009 * W;                       // 빛 번짐 포함한 지름
    for (var i = 0; i < bugs.length; i++) {
      bugs[i].el.style.width = bugs[i].el.style.height = d + "px";
      bugs[i].el.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
    }
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  // 초원 위쪽만 — 하늘로 올라가거나 발밑으로 내려가면 반딧불이로 안 보인다
  var bugs = [];
  for (var i = 0; i < N; i++) {
    var el = document.createElement("div");
    el.className = "ff";
    glow.appendChild(el);
    // 가로는 세로 모바일에서 보이는 구간(프레임 37~63%)을 크게 안 벗어나게,
    // 세로는 지평선(y≈0.588) 아래 초원에 머물게 잡았다. 실측 범위는
    // 가로 0.17~0.83, 세로 0.57~0.85
    bugs.push({
      el: el,
      cx: rand(0.28, 0.72), cy: rand(0.62, 0.80),
      ax: rand(0.05, 0.11), ay: rand(0.02, 0.045),
      px: rand(9000, 17000), py: rand(5000, 11000),
      ph: rand(0, 6.283),
      blink: rand(1700, 3400), bph: rand(0, 6.283)
    });
  }
  addEventListener("resize", layout);
  layout();

  function on() {
    // 겨울엔 안 나온다 — 반딧불이는 여름 벌레다
    return sceneMotionAllowed() &&
           (document.body.dataset.variant || "").indexOf("night") === 0 &&
           document.body.dataset.weather !== "rain" &&
           document.documentElement.dataset.season !== "winter";
  }

  var running = false;

  function step(now) {
    if (!on()) {                              // 밤이 아니면 조용히 끈다
      for (var k = 0; k < bugs.length; k++) bugs[k].el.style.opacity = "0";
      running = false;
      setTimeout(check, 2000);
      return;
    }
    for (var j = 0; j < bugs.length; j++) {
      var b = bugs[j];
      var u = b.cx + Math.sin(now / b.px * 6.283 + b.ph) * b.ax
                   + Math.sin(now / (b.px * 0.37) + b.ph) * b.ax * 0.25;
      var v = b.cy + Math.cos(now / b.py * 6.283 + b.ph) * b.ay
                   + Math.sin(now / (b.py * 0.53) + b.ph) * b.ay * 0.3;
      b.el.style.transform = "translate(" + (u * W).toFixed(1) + "px," +
                             (v * H).toFixed(1) + "px)";
      // 깜빡임: 대체로 어둡고 가끔 밝게 — sin을 세제곱해 봉우리를 좁힌다
      var k2 = (Math.sin(now / b.blink * 6.283 + b.bph) + 1) / 2;
      b.el.style.opacity = (0.06 + 0.94 * k2 * k2 * k2).toFixed(3);
    }
    requestAnimationFrame(step);
  }

  function check() {
    if (running) return;
    if (document.hidden || !on()) { setTimeout(check, 2000); return; }
    running = true;
    requestAnimationFrame(step);
  }
  var motion = createSceneMotion(check, function () {
    running = false;
    bugs.forEach(function (b) { b.el.style.opacity = "0"; });
  });
  var requestAnimationFrame = motion.frame, setTimeout = motion.later;
  motion.start();
})();
</script>

<script>
/* ── 혀 날름 ────────────────────────────────────────────────────────
   가끔 혀를 쏙 집어넣었다가 다시 뺀다.

   **316프레임 루프에는 혀가 들어간 프레임이 없다.** 혀 영역의 프레임간 변화가
   평균 1.81이고 실루엣 화소수도 75,375~84,075라 혀가 빠질 여지가 없다 —
   재생 구간이나 속도로는 못 만든다. 그래서 혀를 지운 몸(naeru-<변형>-nt.png)과
   혀만(tongue-<변형>.png)을 따로 구웠다(tools/naeru-split/tongue.py).

   두 장은 **기준 프레임 79 한 장씩**이다. 그래서 루프가 그 프레임에 왔을 때만
   시작하고, 그 순간 영상을 세운다. 세운 프레임과 정지본이 같은 그림이라
   바꿔치는 순간이 안 보이고, 몸이 멈춘 채로 혀만 움직인다 — 만화에서 한 동작을
   보여줄 때 몸을 붙잡아 두는 것과 같다. 전 프레임을 구우면 몸도 계속 숨쉬게
   할 수 있지만 변형당 영상이 한 벌 더 생기고(+7MB) 인페인팅이 1,272번이라
   1초짜리 개그에는 값이 안 맞는다.

   핑퐁이라 기준 프레임은 한 바퀴에 두 번(3.29초, 9.875초) 지나간다.

   ?tongue=0 끄기 / ?tongue=1 자주 ──────────────────────────────── */
(function () {
  /* **기본은 꺼져 있다.** 동작 자체는 되지만 아직 불안정해서 감춰 뒀다
     (2026-09-05 "낼름거림은 저장은 하되 보이지 않게"). ?tongue=1로만 나온다.
     자산(naeru-<변형>-nt.png, tongue-<변형>.png)과 tools/naeru-split/tongue.py는
     그대로 남겨 둔다 — 다시 켤 때 여기 한 줄만 되돌리면 된다. */
  var flag = new URLSearchParams(location.search).get("tongue");
  if (flag !== "1" && flag !== "2") return;
  var DEBUG = flag === "1";

  var REF_FRAME = 79, FPS = 24, N_FRAMES = 316;   // tongue.py의 REF와 같아야 한다
  var MARKS = [REF_FRAME / FPS, (N_FRAMES - REF_FRAME) / FPS];
  var WINDOW = 1.5 / FPS;                          // 이 안에 들어오면 그 프레임으로 본다
  var FIRST = [10000, 22000];
  var GAP   = [35000, 85000];
  var RETRY = [7000, 14000];      // 그림이 아직이거나 다른 동작 중이라 미룰 때
  var IN_MS = 220, HOLD_MS = 420, OUT_MS = 280;

  var nt   = document.getElementById("naeruNt");
  var tong = document.getElementById("tongue");
  var frozenVideo = null;
  if (!nt || !tong) return;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function ver() { return "?v=" + (document.documentElement.dataset.av || "0"); }
  function activeVideo() {
    return document.querySelector("#naeruA.on, #naeruB.on");
  }

  /* 미리 받아둬야 바꿔칠 때 안 깜빡인다. **src를 넣고 바로 complete를 보면
     안 된다** — 갓 시작한 요청이라 항상 false라서 첫 시도가 늘 미뤄졌다
     (2026-09-05 "낼름거리는 모션 안 나오는데"의 원인). onload로 기다린다. */
  var ready = false, loadedFor = null;

  function preload(variant) {
    if (loadedFor === variant) return;
    loadedFor = variant;
    ready = false;
    var left = 2;
    function ok() { if (--left === 0) ready = true; }
    nt.onload = tong.onload = ok;
    nt.onerror = tong.onerror = function () { loadedFor = null; };  // 다음에 다시
    nt.src   = "img/naeru-" + variant + "-nt.png" + ver();
    tong.src = "img/tongue-" + variant + ".png" + ver();
  }

  function tick(dur, fn, done) {
    var t0 = performance.now();
    (function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      fn(t);
      if (t < 1) requestAnimationFrame(step);
      else if (done) done();
    })(t0);
  }

  function place(k) {          // k: 1=완전히 나옴 0=입 안
    tong.style.transform = "scale(" + k.toFixed(4) + ") rotate(" +
                           ((1 - k) * -7).toFixed(2) + "deg)";
  }

  function play(v) {
    if (window.naeru) window.naeru.busy = true;
    frozenVideo = v; v.dataset.pauseOwner = "tongue";
    v.pause();
    nt.style.opacity = "1";
    tong.style.opacity = "1";
    place(1);
    tick(IN_MS, function (t) {                     // 쏙 — 끝에서 빨라진다
      place(1 - (t * t) * 0.94);
    }, function () {
      place(0.06);
      setTimeout(function () {
        tick(OUT_MS, function (t) {                // 다시 뿅, 살짝 넘겼다 제자리
          var e = 1 - Math.pow(1 - t, 3);
          place(0.06 + 1.02 * e - (Math.sin(t * Math.PI) * 0.08));
        }, function () {
          tong.style.opacity = "0";
          nt.style.opacity = "0";
          tong.style.transform = "";
          delete v.dataset.pauseOwner; frozenVideo = null;
          if (sceneMotionAllowed() && v.classList.contains("on")) {
            v.play().catch(function () {});
          }
          if (window.naeru) window.naeru.busy = false;
          schedule();
        });
      }, HOLD_MS);
    });
  }

  /* 기준 프레임이 지나갈 때까지 지켜본다. 최대 한 바퀴(13.2초)면 반드시 온다 */
  function waitForFrame(v) {
    var giveUp = performance.now() + 16000;
    (function step(now) {
      if (!v.isConnected || v.paused || document.hidden) { schedule("retry"); return; }
      if (now > giveUp) { schedule("retry"); return; }
      var t = v.currentTime;
      for (var i = 0; i < MARKS.length; i++) {
        if (Math.abs(t - MARKS[i]) < WINDOW) { play(v); return; }
      }
      requestAnimationFrame(step);
    })(performance.now());
  }

  function schedule(kind) {
    var gap = kind === "first" ? FIRST : kind === "retry" ? RETRY : GAP;
    var ms = DEBUG ? (kind === "first" ? 2000 : 5000) : rand.apply(null, gap);
    setTimeout(function () {
      preload(document.body.dataset.variant || "dusk");
      var v = activeVideo();
      // 미루는 이유는 전부 잠깐짜리(그림 로딩·다른 동작 중)라 짧게 다시 온다.
      // 여기서 GAP을 다시 잡으면 한 번 어긋날 때마다 1~2분씩 밀린다
      if (document.hidden || !v || v.paused || !v.getAttribute("src") || !ready ||
          (window.naeru && (window.naeru.busy || window.naeru.hold))) {
        schedule("retry"); return;
      }
      waitForFrame(v);
    }, ms);
  }
  var motion = createSceneMotion(function () {
    preload(document.body.dataset.variant || "dusk"); schedule("first");
  }, function () {
    nt.style.opacity = "0"; tong.style.opacity = "0"; tong.style.transform = "";
    if (frozenVideo) {
      delete frozenVideo.dataset.pauseOwner;
      if (sceneMotionAllowed() && frozenVideo.classList.contains("on")) {
        frozenVideo.play().catch(function () {});
      }
      frozenVideo = null;
    }
    if (window.naeru) window.naeru.busy = false;
  });
  var requestAnimationFrame = motion.frame, setTimeout = motion.later;
  motion.start();
})();
</script>

<script>
/* ── 가을 낮: 다가와 눈 맞추기 ─────────────────────────────────
   6걸음 → 가까이서 2.4초 인사 → 5걸음으로 복귀. 화면 크기로 끝 위치를
   계산하되 배경·꽃은 기존 cover 상자를 그대로 쓴다. 새 보행 영상 없이
   보폭의 가감속·체중 이동을 합성하는 시범 동작이다. */
(function () {
  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var approach = document.getElementById("naeru-approach");
  var stride = document.getElementById("naeru-stride");
  var move = document.getElementById("naeru-move");
  var ground = document.getElementById("approach-ground");
  var shadow = document.getElementById("approach-shadow");
  var back = document.getElementById("approach-return");
  var preview = document.getElementById("approach-preview");
  var panel = document.getElementById("settings-panel");
  var pending = null, running = false, demoPlayed = false;
  var visitGap = 5 * 60 * 1000, nextVisit = performance.now() + visitGap;
  var readyAt = performance.now(), geometry = null, progress = 0;
  var phase = "", phaseStart = 0, returnFrom = 1;

  function eligible() {
    return root.dataset.season === "autumn" && document.body.dataset.variant === "day" &&
           !window.naeruReduced() && params.get("act") !== "0";
  }
  function controls() {
    document.getElementById("approach-setting").hidden = !eligible();
    preview.disabled = running || Boolean(pending) || root.dataset.sceneReady !== "true";
  }
  function reset() {
    var owned = running;
    if (document.hidden && pending !== "focus") pending = null;
    if (pending === "auto" && root.dataset.sceneReady !== "true") pending = null;
    if (window.naeruReduced()) pending = null;
    running = false; geometry = null; progress = 0;
    delete root.dataset.approach;
    approach.style.transform = ""; stride.style.transform = "";
    ground.style.opacity = "0"; shadow.style.opacity = "0";
    if (document.activeElement === back) document.getElementById("settings-open").focus();
    back.hidden = true;
    document.getElementById("naeru-touch").setAttribute("aria-label", "내루미에게 인사하기");
    if (owned && window.naeru) { window.naeru.busy = false; window.naeru.hold = false; }
    controls();
  }
  function pose(p, beat, envelope) {
    progress = p;
    // 뒤쪽에선 작게, 가까워질수록 한 걸음의 이동량이 커진다.
    var depth = Math.pow(p, 1.55);
    var scale = 1 + (geometry.scale - 1) * depth;
    var sway = Math.sin(beat * Math.PI) * envelope;
    var lift = Math.pow(Math.sin(beat * Math.PI), 2) * envelope;
    approach.style.transform = "translate(" + (geometry.x * depth).toFixed(2) + "px," +
      (geometry.y * depth).toFixed(2) + "px) scale(" + scale.toFixed(5) + ")";
    stride.style.transform = "translate(" + (sway * .8).toFixed(3) + "%," +
      (-lift * 1.3).toFixed(3) + "%) rotate(" + (sway * 1.7).toFixed(3) +
      "deg) scaleY(" + (1 - lift * .012).toFixed(4) + ")";
    var departed = Math.min(1, depth * 8);
    ground.style.opacity = departed.toFixed(3);
    shadow.style.opacity = (departed * (1 - lift * .35)).toFixed(3);
  }
  function changePhase(next, now) {
    phase = next; phaseStart = now; root.dataset.approach = next;
  }
  function returnHome() {
    if (!running || phase === "returning") return;
    returnFrom = progress; changePhase("returning", performance.now());
  }
  function animate(now) {
    var t = Math.min(1, (now - phaseStart) /
      (phase === "walking" ? 4200 : phase === "close" ? 2400 : 3400));
    if (phase === "close") {
      // 대기 중 원래 영상의 표정은 계속 움직이고, 몸만 살짝 갸웃한다.
      pose(1, 0, 0);
      stride.style.transform = "rotate(" + (Math.sin(t * Math.PI * 2) * 1.4).toFixed(3) + "deg)";
      if (t === 1) { returnFrom = 1; changePhase("returning", now); }
    } else {
      var steps = phase === "walking" ? 6 : 5;
      var beat = t * steps, foot = beat % 1;
      var walked = (Math.floor(beat) + (1 - Math.cos(foot * Math.PI)) / 2) / steps;
      var envelope = Math.min(1, t * 12, (1 - t) * 12);
      pose(phase === "walking" ? walked : returnFrom * (1 - walked), beat, envelope);
      if (t === 1) {
        if (phase === "returning") { reset(); return; }
        changePhase("close", now);
      }
    }
    motion.frame(animate);
  }
  function begin() {
    pending = null; running = true;
    nextVisit = performance.now() + visitGap;
    window.naeru.busy = true; window.naeru.hold = true;
    var box = move.getBoundingClientRect();
    var eye = document.getElementById("naeru-brow").getBoundingClientRect();
    var footX = box.left + box.width * .479167;
    var footY = box.top + box.height * .790323;
    // 세로 화면은 얼굴이, 가로 화면은 상체가 화면을 메운다. 눈은 중앙에 둔다.
    var scale = Math.max(innerHeight * .92 / (box.height * .46),
                         innerWidth * .8 / (box.width * .54));
    // 좁은 화면에서도 두 눈이 잘리지 않도록 얼굴 폭으로 한 번 더 제한한다.
    scale = Math.min(scale, innerWidth * .94 / (box.width * .29));
    geometry = { scale: scale,
      x: innerWidth * .5 - footX - (eye.left - footX) * scale,
      y: innerHeight * .39 - footY - (eye.top - footY) * scale };
    var url = "img/bg-day-autumn.jpg?v=" + root.dataset.av;
    document.getElementById("approach-grass-image").setAttribute("href", url);
    document.getElementById("approach-flower-image").setAttribute("href", url);
    document.getElementById("approach-flower-mask").setAttribute("href", url);
    back.hidden = false;
    document.getElementById("greeting").hidden = true;
    document.getElementById("naeru-touch").setAttribute("aria-label", "내루미를 제자리로 보내기");
    changePhase("walking", performance.now()); controls(); motion.frame(animate);
  }
  function tryPending() {
    if (!pending || running || !sceneMotionAllowed()) { controls(); return; }
    if (!eligible() || !window.naeru) {
      var greet = pending === "focus"; pending = null; controls();
      if (greet) document.dispatchEvent(new CustomEvent("naeru:greet", { detail: { dir: 1 } }));
      return;
    }
    // 배경 페이드와 이미 진행 중인 공·나비·인사가 끝난 다음 출발한다.
    if (performance.now() - readyAt < 2800 || window.naeru.busy || window.naeru.hold || panel.open) {
      motion.later(tryPending, 250); controls(); return;
    }
    begin();
  }
  function request(kind) {
    if (running || pending) return;
    if (window.naeruReduced()) {
      if (kind === "focus") document.dispatchEvent(new CustomEvent("naeru:greet"));
      return;
    }
    pending = kind; tryPending();
  }
  function scheduleVisit() {
    // URL 동작 검사는 각각의 미리보기 규칙을 유지한다. 일반 접속만 5분마다.
    if (params.has("act") || !eligible()) return;
    motion.later(function () {
      if (performance.now() >= nextVisit) {
        nextVisit = performance.now() + visitGap;
        request("auto");
      }
      scheduleVisit();
    }, Math.max(1, nextVisit - performance.now()));
  }
  // scene 이벤트는 플레이어 초기 정지본/영상 확정 때 두 번 올 수 있다.
  // 예약은 보존하고, 마지막 확정부터 페이드가 끝날 시간을 다시 센다.
  document.addEventListener("naeru:scene", function () {
    readyAt = performance.now(); controls();
  });
  var motion = createSceneMotion(function () {
    // 숨은 탭의 방문을 몰아서 재생하지 않고, 돌아온 장면에서 새로 5분을 센다.
    nextVisit = performance.now() + visitGap;
    if (params.get("act") === "approach" && !demoPlayed && eligible()) {
      demoPlayed = true; pending = "preview";
    }
    tryPending(); scheduleVisit();
  }, reset);
  document.addEventListener("naeru:focus-complete", function () { request("focus"); });
  document.addEventListener("naeru:approach", function () { request("preview"); });
  preview.addEventListener("click", function () {
    panel.close(); request("preview");
    document.getElementById("scene-message").textContent = "내루미가 가까이 다가와요.";
  });
  back.addEventListener("click", returnHome);
  document.getElementById("naeru-touch").addEventListener("click", function (e) {
    if (!running) return;
    e.stopImmediatePropagation(); returnHome();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && running && !panel.open) { e.preventDefault(); returnHome(); }
  });
  addEventListener("resize", function () { if (running) motion.start(); });
  motion.start(); controls();
})();
</script>

<script>
/* ── 작은 설정과 인사, 선택형 집중 시간 ──────────────────────── */
(function () {
  var panel = document.getElementById("settings-panel");
  var opener = document.getElementById("settings-open");
  var greeting = document.getElementById("greeting");
  var message = document.getElementById("scene-message");
  var hintSeen = false, hintTimer = null, hideHintTimer = null;
  try { hintSeen = localStorage.getItem("naeru-hint-seen") === "1"; } catch (e) {}
  opener.addEventListener("click", function () {
    greeting.hidden = true; panel.showModal();
  });
  document.getElementById("settings-close").addEventListener("click", function () {
    panel.close();
  });
  var queryKeys = { season: ["s"], band: ["v", "h"], motion: ["still"] };
  ["season", "band", "motion", "date", "clock"].forEach(function (key) {
    var control = document.getElementById("setting-" + key);
    if (key === "clock") control.checked = window.naeruSettings[key];
    else {
      var query = new URLSearchParams(location.search);
      var preview = key === "season" ? query.get("s") : key === "band" ? query.get("v") : null;
      control.value = window.naeruSettings[key];
      if (preview && Array.from(control.options).some(function (o) { return o.value === preview; })) {
        control.value = preview;
      }
    }
    control.addEventListener("change", function () {
      window.naeruSettings[key] = key === "clock" ? control.checked : control.value;
      // URL 미리보기를 설정에서 바꾸면 그 항목의 강제값만 해제한다.
      var url = new URL(location.href);
      (queryKeys[key] || []).forEach(function (p) { url.searchParams.delete(p); });
      history.replaceState(null, "", url.href);
      try { localStorage.setItem("naeru-settings", JSON.stringify(window.naeruSettings)); } catch (e) {}
      document.dispatchEvent(new Event("naeru:settings"));
    });
  });
  function hideHint() {
    clearTimeout(hintTimer); clearTimeout(hideHintTimer); greeting.hidden = true;
  }
  document.getElementById("naeru-touch").addEventListener("click", function (e) {
    hideHint(); hintSeen = true;
    try { localStorage.setItem("naeru-hint-seen", "1"); } catch (err) {}
    var r = e.currentTarget.getBoundingClientRect();
    var dir = e.detail && e.clientX < r.left + r.width / 2 ? -1 : 1;
    message.textContent = "내루미에게 인사했어요.";
    document.dispatchEvent(new CustomEvent("naeru:greet", { detail: { dir: dir } }));
  });
  document.addEventListener("naeru:scene", function () {
    hideHint();
    if (hintSeen || document.documentElement.dataset.sceneReady !== "true") return;
    hintTimer = setTimeout(function () {
      if (document.hidden || panel.open || focusEnd) return;
      greeting.hidden = false; hintSeen = true;
      try { localStorage.setItem("naeru-hint-seen", "1"); } catch (e) {}
      hideHintTimer = setTimeout(hideHint, 8000);
    }, 1800);
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) hideHint(); });

  /* 종료 시각에서 남은 시간을 계산해 숨은 탭·새로고침에서도 어긋나지 않게 한다. */
  var focusEnd = null;
  try {
    var saved = JSON.parse(sessionStorage.getItem("naeru-focus") || "null");
    if (saved && Number.isFinite(saved.end) && saved.end > Date.now() - 12 * 3600000 &&
        saved.end - Date.now() <= 50 * 60000) focusEnd = saved.end;
  } catch (e) {}
  var strip = document.getElementById("focus-strip");
  var label = document.getElementById("focus-label");
  var start = document.getElementById("focus-start");
  var stop = document.getElementById("focus-stop");
  var duration = document.getElementById("focus-duration");
  var note = document.getElementById("focus-note");
  function renderFocus() {
    start.disabled = duration.disabled = Boolean(focusEnd);
    start.textContent = focusEnd ? "진행 중" : "시작";
    if (!focusEnd) return;
    var seconds = Math.max(0, Math.ceil((focusEnd - Date.now()) / 1000));
    strip.hidden = false;
    if (seconds === 0) {
      focusEnd = null;
      try { sessionStorage.removeItem("naeru-focus"); } catch (e) {}
      label.textContent = "수고했어요. 잠깐 쉬어가요."; stop.textContent = "닫기";
      message.textContent = label.textContent;
      note.textContent = "집중을 마쳤어요. 준비되면 다시 시작해요.";
      document.title = "내루미";
      document.dispatchEvent(new Event("naeru:focus-complete"));
      renderFocus(); return;
    }
    var text = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" +
               String(seconds % 60).padStart(2, "0");
    label.textContent = "집중 " + text; stop.textContent = "종료";
    note.textContent = "지금 집중하고 있어요. 남은 시간 " + text;
    document.title = text + " · 내루미";
  }
  start.addEventListener("click", function () {
    var minutes = Number(duration.value);
    if (focusEnd || [25, 50].indexOf(minutes) < 0) return;
    focusEnd = Date.now() + minutes * 60000;
    try { sessionStorage.setItem("naeru-focus", JSON.stringify({ end: focusEnd })); } catch (e) {}
    hideHint(); panel.close(); renderFocus();
    message.textContent = minutes + "분 집중을 시작해요.";
  });
  stop.addEventListener("click", function () {
    focusEnd = null; strip.hidden = true; document.title = "내루미";
    try { sessionStorage.removeItem("naeru-focus"); } catch (e) {}
    note.textContent = "끝나면 내루미가 쉬어갈 시간을 알려줘요.";
    renderFocus(); opener.focus();
  });
  renderFocus();
  setInterval(function () { if (!document.hidden) renderFocus(); }, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) renderFocus();
  });
})();
</script>
</body>
</html>
