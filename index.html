<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1f2e">
<meta name="robots" content="noindex, nofollow">
<title>내루미</title>
<meta name="description" content="서울의 시간과 계절을 함께하는 내루미.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="내루미">
<meta property="og:description" content="서울의 시간과 계절을 함께하는 내루미.">
<meta property="og:url" content="https://naeru.me/">
<meta property="og:image" content="https://naeru.me/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap"
      rel="stylesheet">
<script>
/* ── 환경설정: 첫 그림부터 저장한 취향을 적용한다 ──────────────── */
window.naeruSettings = { season: "auto", band: "auto", motion: "auto",
                         clock: true, date: "en" };
(function () {
  var choices = {
    season: ["auto", "spring", "summer", "autumn", "winter"],
    band: ["auto", "dawn", "day", "dusk", "night"],
    motion: ["auto", "still"], date: ["en", "ko"], clock: [true, false]
  };
  try {
    var saved = JSON.parse(localStorage.getItem("naeru-settings") || "null");
    Object.keys(choices).forEach(function (key) {
      if (saved && choices[key].indexOf(saved[key]) >= 0) {
        window.naeruSettings[key] = saved[key];
      }
    });
  } catch (e) {}
  var media = matchMedia("(prefers-reduced-motion: reduce)");
  window.naeruReduced = function () {
    return new URLSearchParams(location.search).get("still") === "1" ||
           media.matches || window.naeruSettings.motion === "still";
  };
  function reflect() {
    document.documentElement.dataset.motion = window.naeruReduced() ? "still" : "on";
    document.documentElement.dataset.clock = String(window.naeruSettings.clock);
  }
  reflect();
  document.addEventListener("naeru:settings", reflect);
  media.addEventListener("change", function () {
    document.dispatchEvent(new Event("naeru:settings"));
  });
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1f2e; /* 영상 로딩 전 어두운 배경 */
    font-family: "Comfortaa", "Avenir Next", "Apple SD Gothic Neo",
                 -apple-system, sans-serif;
  }

  /* 배경은 **정지 이미지**다(2026-09-04 — 바람·구름이 도는 4K 영상은 임시로
     포기). img/bg-<변형>.jpg는 그 변형의 첫 프레임에 내루미를 **구워서 지운**
     것이라, 예전처럼 런타임에 patch를 덧대는 레이어가 아예 없다. 움직이는 건
     DOM 내루미·비·공뿐이다. 영상 복귀는 meadow-*.mp4가 그대로 있으니 가능. */

  /* 루프 순간 브라우저가 비디오를 한 프레임 놓쳐도
     어두운 배경 대신 동일한 정지 프레임이 보이도록,
     첫 프레임(=핑퐁 마지막 프레임)을 영상 뒤에 깔아둠 */
  .bg-still {
    position: fixed;
    inset: 0;
    background-image: var(--still);
    background-size: cover;
    background-position: center;
  }

  /* 공에 맞는 순간 배경 전체를 아주 잠깐 흔든다. 겹들을 같은 값으로
     움직여야 정렬이 유지되고, 살짝 확대해서 흔들린 만큼 가장자리에
     빈 틈이 생기지 않게 한다 (기본값 none이면 아무 영향 없음).
     배경·#stage를 같이 넣어야 흔들릴 때 내루미가 배경에서 떨어져 보이지 않는다 */
  .bg-still, .bg-layer, #stage {
    transform: var(--bg-shake, none);
  }

  /* ── 배경 정지 이미지 A/B. 시간대·날씨가 바뀌면 2.5초 크로스페이드.
     cover/center라 화면비가 뭐든 #stage와 픽셀이 맞는다 ── */
  .bg-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2.5s ease;
  }
  .bg-layer.on { opacity: 1; }
  #bgA { background-image: var(--bg-a); }
  #bgB { background-image: var(--bg-b); }

  /* ── 내루미: #stage가 프레임 사각형(=배경 영상이 cover로 차지하는 상자)이라
     자식은 % 좌표만으로 배치된다. JS 기하 계산 없음.
     z-index를 주지 말 것 — .rain/.vignette와 같은 레벨이라 DOM 순서로
     결정된다(마크업에서 .rain 앞) ── */
  #stage { position: fixed; pointer-events: none; }

  /* transform은 속성이 하나뿐이라 두 코드가 같은 요소에 쓰면 서로 덮어쓴다.
     그래서 역할별로 겹을 나눠 각자 자기 transform만 소유하게 한다:
     #stage=배경 셰이크 / #naeru-move=폴짝·이동 / #naeru-act=움찔·두리번 /
     #naeru-face=방향(뒤집기). CROP box(576×496 @ 1744,1328 / 3840×2160)를
     프레임 비율로 환산한 값 — matte.py의 CROP_ORIGIN/CROP_SIZE와 반드시
     같이 맞출 것(tools/naeru-split/coords.py가 원본) */
  #naeru-move {
    position: absolute;
    left: 45.4167%; top: 61.4815%; width: 15%; height: 22.9630%;
  }
  #naeru-approach, #naeru-stride, #naeru-act, #naeru-face {
    position: absolute; inset: 0;
  }
  /* 회전·스쿼시의 기준점은 발끝이다. 크롭 상단이 y1328, 발끝이 y1720이므로
     세로 (1720-1328)/496 = 79.03%, 가로는 몸 중심 x2020 →
     (2020-1744)/576 = 47.92%. 틀리면 기울일 때 발이 지면에서 뜬다 */
  #naeru-approach, #naeru-stride, #naeru-act, #naeru-face {
    transform-origin: 47.9167% 79.0323%;
  }
  /* 다가오기는 바깥 겹의 원근 이동 + 안쪽 겹의 보폭으로 나눈다.
     기존 폴짝·인사와 transform을 공유하지 않는다. */
  html[data-approach] #naeru-approach,
  html[data-approach] #naeru-stride { will-change: transform; }
  #approach-ground, #approach-flowers {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; opacity: 0;
  }
  #approach-shadow {
    position: absolute; left: 17%; top: 75%; width: 62%; height: 11%;
    border-radius: 50%; opacity: 0;
    background: radial-gradient(ellipse, rgba(43, 42, 26, .3), transparent 70%);
  }
  html[data-approach] #approach-flowers { opacity: 1; }
  html[data-approach] .clock-wrap { opacity: .22; transition: opacity .6s; }
  #approach-return {
    left: 50%; top: max(20px, env(safe-area-inset-top)); transform: translateX(-50%);
    padding: 10px 18px; border: 1px solid rgba(255, 249, 237, .45);
    border-radius: 24px; color: #fff9ed; background: rgba(28, 35, 38, .65);
    cursor: pointer; font-size: .85rem;
  }
  .naeru, #naeruStill {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity 2.5s ease;
  }
  .naeru.on, #naeruStill.on { opacity: 1; }

  /* 혀 개그용 두 장. 영상을 세운 그 프레임의 "혀 없는 몸"과 "혀"라서, 둘을
     겹치면 원래 화면과 픽셀이 같다 — 바꿔치는 순간이 안 보인다.
     DOM 순서상 영상·정지본보다 뒤에 있어 위에 그려진다 */
  #naeruNt, #tongue {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; pointer-events: none;
  }
  /* 혀는 입 안으로 빨려 들어가므로 기준점이 입이다.
     크롭 (243, 152) → (243/576, 152/496) */
  #tongue { transform-origin: 42.1875% 30.6452%; will-change: transform; }
  /* 공 IIFE의 headAt()이 겨냥하는, 화면에 안 보이는 기준점. #naeru-face
     안에 있어서 폴짝·움찔·뒤집기 중에도 getBoundingClientRect()로 실제
     렌더 위치를 그대로 읽을 수 있다. 프레임 좌표 (1995,1399) → 크롭
     (1744,1328,576,496) 기준 (43.5764%, 14.3145%) */
  #naeru-head { position: absolute; left: 43.5764%; top: 14.3145%; width: 1px; height: 1px; }
  /* 나비가 앉는 자리 = 두 눈 사이. 나비는 늘 기준 프레임(79)에서 영상을
     세우고 앉으므로, 여러 프레임의 평균이 아니라 **그 프레임의** 눈 중점을
     쓴다 — 실측 크롭 (243.5, 119.5) → 576×496 기준 백분율 */
  #naeru-brow { position: absolute; left: 42.2743%; top: 24.0927%; width: 1px; height: 1px; }

  /* ── 비 레이어: 하늘 프리즈 위에서도 비가 계속 내리도록
     영상이 아닌 DOM에서 렌더. 줄기는 수직 텍스처, 레이어를
     skewX로 기울여 낙하 방향 = 줄기 축. 텍스처 높이(1024px)
     단위로 background-position을 굴리므로 완벽 루프.
     원경(가늘고 느림)/근경(굵고 빠름) 2겹으로 깊이감 ──── */
  .rain {
    position: fixed;
    inset: -14% -8%;
    pointer-events: none;
    transform: skewX(-8deg);
    background-repeat: repeat;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2.5s ease, visibility 2.5s;
    animation: rainfall linear infinite;
    animation-play-state: paused;
  }
  .rain-far  { background-image: url("img/rain-far.png");  animation-duration: 1.8s; }
  .rain-near { background-image: url("img/rain-near.png"); animation-duration: 0.95s; }
  @keyframes rainfall { to { background-position: 0 1024px; } }
  body[data-weather="rain"] .rain {
    visibility: visible;
    animation-play-state: running;
  }
  body[data-weather="rain"] .rain-far  { opacity: 0.5; }
  body[data-weather="rain"] .rain-near { opacity: 0.62; }
  /* 밤에는 줄기가 너무 하얗게 뜨지 않게 */
  body[data-weather="rain"][data-variant^="night"] .rain-far  { opacity: 0.26; }
  body[data-weather="rain"][data-variant^="night"] .rain-near { opacity: 0.34; }

  /* 은은한 비네트 — cozy한 깊이감, 밤에는 조금 더 깊게 */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      ellipse at center,
      transparent 55%,
      rgba(10, 14, 25, 0.42) 100%
    );
    opacity: 0.85;
    transition: opacity 2.5s ease;
  }
  body[data-variant^="night"] .vignette { opacity: 1; }
  body[data-variant="day"]    .vignette { opacity: 0.6; }

  /* ── 시계: 내루미를 가리지 않도록 상단 배치 ─────── */
  .clock-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8vh;
    user-select: none;
    pointer-events: none;
  }

  .clock-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .time {
    font-size: clamp(3.5rem, 10vw, 7.5rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: rgba(255, 252, 245, 0.96);
    text-shadow:
      0 2px 24px rgba(20, 25, 40, 0.55),
      0 0 60px rgba(255, 240, 210, 0.25);
    font-variant-numeric: tabular-nums;
  }

  .time .colon { animation: blink 2s ease-in-out infinite; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* 시계 아래 한 줄: 기온 · 하늘 · 다음 일출/일몰.
     날씨 실황은 배경 변형을 고르려고 어차피 받아오는 것이라, 띄우는 데
     추가 요청이 없다. 날짜보다 한 단계 작고 옅게 둬서 시계를 안 흐린다 */
  .info {
    margin-top: 0.15rem;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    font-weight: 400;
    letter-spacing: 0.12em;
    color: rgba(255, 250, 240, 0.62);
    text-shadow: 0 1px 10px rgba(20, 25, 40, 0.6);
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity 1.2s ease;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .info.on { opacity: 1; }
  .info .sep { opacity: 0.45; margin: 0 0.5em; }

  .date {
    font-size: clamp(1rem, 2.2vw, 1.5rem);
    font-weight: 400;
    letter-spacing: 0.18em;
    color: rgba(255, 250, 240, 0.85);
    text-shadow: 0 1px 12px rgba(20, 25, 40, 0.6);
  }

  /* ── 프레임 박스: 배경 영상이 cover로 실제 차지하는 사각형.
     이 안에서는 좌표를 프레임 비율로 쓸 수 있어서, 영상에 구워진
     내루미 머리 같은 지점을 화면비와 무관하게 정확히 가리킬 수 있다.
     cover 계산을 개체마다 하지 않고 이 상자 하나에만 하는 게 요점 ── */
  #frame {
    position: fixed;
    pointer-events: none;
    z-index: 1;              /* 비네트 위, 시계 아래 */
  }
  #ball, #bonk {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    will-change: transform, opacity;
  }
  #ball svg { display: block; width: 100%; height: 100%; }
  #bonk {
    border-radius: 50%;
    border: 2px solid rgba(255, 252, 245, 0.85);
  }

  /* 공은 DOM으로 그리므로 배경 그레이딩을 안 받는다. 내루미는 변형별로 8벌을
     따로 구워서 맞지만 공은 한 벌뿐이라, 밤·비에서 혼자 형광처럼 뜬다.
     CLAUDE.md §4의 밴드별 체인을 CSS 필터로 근사한다 — 정확할 필요는 없고
     "혼자 튀지 않을" 정도면 된다. 임팩트 링(#bonk)도 같이 먹는 게 자연스럽다.
     dusk는 원본 무보정이라 필터 없음.
     `$="-rain"`이 night-rain도 잡으므로 night-rain 규칙을 뒤에 둔다(같은 우선순위) */
  /* 변형(시간대·날씨) 보정과 계절 보정을 **곱해서** 건다. 각각 따로
     filter를 쓰면 나중 규칙이 앞을 덮어써서 하나만 남는다 */
  /* none은 다른 필터 함수와 함께 쓸 수 없으므로 중립 함수를 기본값으로 둔다. */
  .graded {
    filter: var(--grade, brightness(1)) var(--season, brightness(1));
    transition: filter 2.5s ease;
  }
  body[data-variant="dawn"]       .graded { --grade: brightness(1.04) saturate(.93); }
  body[data-variant="day"]        .graded { --grade: brightness(1.08) saturate(1.06); }
  body[data-variant="night"]      .graded { --grade: brightness(.60)  saturate(.45); }
  body[data-variant$="-rain"]     .graded { --grade: brightness(.97)  saturate(.32); }
  body[data-variant="night-rain"] .graded { --grade: brightness(.50)  saturate(.28); }

  /* ── 계절 ────────────────────────────────────────────────────
     배경은 계절별로 따로 구워서(bg-<변형>-<계절>.jpg) 화질이 좋다.
     내루미·공·나비는 한 벌뿐이라 여기서 델타만 입힌다 — 안 그러면 겨울 배경
     위에 여름 톤 캐릭터가 혼자 떠 있는다. 여름은 원본이라 필터 없음 */
  :root { --season: brightness(1); }
  html[data-season="spring"] { --season: saturate(1.05); }
  html[data-season="autumn"] { --season: sepia(.12) saturate(1.06); }
  /* 겨울은 .55까지 빼면 캐릭터가 배경에 묻혀 초점이 사라진다 — 배경보다는
     조금 더 선명하게 남겨 둔다 */
  html[data-season="winter"] { --season: saturate(.68) brightness(1.04); }
  #stage { filter: var(--season, none); transition: filter 2.5s ease; }

  /* 눈·낙엽. 비 레이어와 같은 타일·키프레임을 쓰고, 옆으로 흔들리는 것만
     더했다(비는 곧게 떨어지지만 눈과 낙엽은 흔들린다) */
  .fall {
    position: fixed;
    inset: -14% -8%;
    pointer-events: none;
    background-repeat: repeat;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2.5s ease, visibility 2.5s;
    animation: rainfall linear infinite, sway ease-in-out infinite;
    animation-play-state: paused;
  }
  /* .graded를 달아 변형 보정을 받는다 — 안 그러면 밤에 순백 점이 떠서
     눈만 대낮처럼 보인다(눈 배경에서 겪은 것과 같은 실수) */
  .fall-far  { background-image: var(--fall-far);  animation-duration: 19s, 13s; }
  .fall-near { background-image: var(--fall-near); animation-duration: 12s, 8s; }
  @keyframes sway {
    0%, 100% { transform: translateX(-1.6%); }
    50%      { transform: translateX(1.6%); }
  }
  /* 내리는 것은 **겨울에 강수일 때의 눈뿐**이다.
     - 겨울엔 비 대신 눈이 온다: .rain을 숨기고 .fall을 띄운다.
     - **맑은 겨울엔 아무것도 안 내린다.** 쌓인 눈은 배경 그림에 이미 구워져
       있다(bg-<변형>-winter.jpg) — "눈이 올 때나 안 올 때나 상시적으로 눈이
       쌓여있는 배경"은 그쪽 이야기지 내리는 눈이 아니다(2026-09-06 제보).
     - 가을 낙엽도 만들어 봤지만 뺐다 — 배경의 단풍만 남긴다. */
  html[data-season="winter"] .rain {
    visibility: hidden; opacity: 0; animation-play-state: paused;
  }
  html[data-season="winter"] body[data-weather="rain"] .fall {
    visibility: visible;
    animation-play-state: running;
  }
  html[data-season="winter"] body[data-weather="rain"] .fall-far  { opacity: 0.68; }
  html[data-season="winter"] body[data-weather="rain"] .fall-near { opacity: 0.85; }

  /* 머리 위에 잠깐 뜨는 기호(별·zzz·물음표). #naeru-act의 자식이라 폴짝·움찔을
     따라가고, #naeru-face 밖이라 좌우 뒤집기에는 안 따라간다 — 기호가 거울상이
     되면 안 되기 때문. 크기는 #naeru-move 상자 기준 %라 화면비와 무관하다 */
  #emote {
    position: absolute;
    left: 33%; top: -12%; width: 24%; height: 24%;
    opacity: 0;
    will-change: transform, opacity;
  }
  #emote svg { display: block; width: 100%; height: 100%; overflow: visible; }

  #flit { position: absolute; left: 0; top: 0; opacity: 0;
          will-change: transform, opacity; }

  /* 반딧불이용 두 번째 프레임 상자. #frame과 같은 사각형이지만 **변형별
     그레이딩 필터를 안 받는다**(.graded가 아니다) — 밤 필터가 brightness .60
     이라 그걸 먹으면 빛나야 할 것이 도로 어두워진다 */
  #glow { position: fixed; pointer-events: none; z-index: 1; }
  .ff {
    position: absolute; left: 0; top: 0; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 247, 198, 0.95) 0%, rgba(255, 228, 130, 0.5) 34%,
      rgba(255, 214, 90, 0) 70%);
    opacity: 0;
    will-change: transform, opacity;
  }
  #flit svg { display: block; width: 100%; height: 100%; }
  #flit-wings { transform-box: fill-box; transform-origin: 50% 52%; }

  .clock-wrap { z-index: 2; }

  /* 조작 영역도 같은 프레임 안에 둔다. 투명한 버튼이 키보드 초점을 받는다. */
  #naeru-touch {
    position: absolute; left: 20%; top: 13%; width: 60%; height: 66%;
    pointer-events: auto; border: 0; border-radius: 35%;
    background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button, select { font: inherit; }
  button:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid #ffe5ad; outline-offset: 4px;
  }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  html[data-clock="false"] .clock-wrap { display: none; }
  .scene-ui {
    position: fixed; z-index: 3; color: #fff9ed;
    text-shadow: 0 1px 8px rgba(10, 14, 25, .75);
  }
  #settings-open {
    right: max(18px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 44px; height: 44px; border: 1px solid rgba(255, 249, 237, .35);
    border-radius: 50%; background: rgba(24, 30, 33, .55); cursor: pointer;
  }
  #settings-open svg { width: 21px; height: 21px; vertical-align: middle; }
  #greeting, #focus-strip {
    bottom: max(25px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); max-width: calc(100% - 140px);

  }
  #greeting { pointer-events: none; }
  #focus-strip button {
    color: inherit; background: transparent; border: 0;

  }
  #settings-panel {
    margin: auto 18px 76px auto; padding: 24px; width: 340px;
    max-width: calc(100vw - 32px); max-height: calc(100dvh - 108px);
    overflow-y: auto; border: 1px solid rgba(255, 249, 237, .25);
    border-radius: 18px; color: #fff9ed; background: rgba(28, 35, 38, .97);
    box-shadow: 0 12px 45px rgba(0, 0, 0, .25);

  }
  #settings-panel::backdrop { background: rgba(12, 20, 26, .18); }
  .settings-heading { display: flex; justify-content: space-between; align-items: center; }
  .settings-heading h2 { font-size: 1.1rem; font-weight: 600; }
  .settings-heading button {
    width: 44px; height: 44px; border: 0; background: transparent;
    color: inherit; cursor: pointer; font-size: 1.4rem;
  }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-top: 16px; font-size: .9rem;
  }
  .setting-row select {

  .settings-note { font-size: .78rem; line-height: 1.6; color: #c1c8c3; margin-top: 16px; }
  .settings-note a { color: inherit; }
  #focus-start, #approach-preview {

  }
  #settings-panel fieldset { border: 0; border-top: 1px solid #52615f; margin-top: 22px; }
  #settings-panel legend { padding: 0 8px 0 0; font-size: .9rem; }

  html[data-motion="still"] :is(.clock-inner, .time .colon) { animation: none; }
  html[data-motion="still"] :is(.rain, .fall, .naeru, #naeruNt, #tongue, #glow, #frame) {
    display: none !important;
  }
  html[data-motion="still"] :is(.bg-layer, #stage, #naeruStill) { transition: none; }
  html[data-motion="still"] #naeruStill.on { opacity: 1; }

  /* 움직임 최소화 설정 존중: 영상 없이 정지 프레임만 표시
     (JS도 이 경우 영상을 아예 로드하지 않음) */
  @media (prefers-reduced-motion: reduce) {
    .clock-inner, .time .colon { animation: none !important; }
    .rain, .fall { display: none !important; }
    .naeru, #naeruNt, #tongue { display: none !important; }
    #glow { display: none !important; }
    .bg-layer, #naeruStill { transition: none !important; }
    #frame { display: none !important; }
  }
</style>
</head>
<body>

<!-- 배경 영상에서 내루미를 지운 자리에 다시 얹는 DOM 내루미.

<div id="stage">

       원본 배경을 참조하므로 새 풍경 파일이나 색이 다른 패치가 필요 없다. -->
  <svg id="approach-ground" viewBox="0 0 3840 2160" aria-hidden="true">
    <defs>
      <radialGradient id="ground-feather">
        <stop offset=".65" stop-color="white"/>

        <ellipse cx="1860" cy="1720" rx="340" ry="94" fill="url(#ground-feather)"/>

    <image id="approach-grass-image" x="0" y="155" width="3840" height="2160"

  </svg>
  <div id="naeru-move"><div id="naeru-approach">
  <div id="approach-shadow" aria-hidden="true"></div>
  <div id="naeru-stride"><div id="naeru-act"><div id="naeru-face">

    <video id="naeruB" class="naeru" aria-hidden="true" muted loop playsinline preload="none"></video>

    <img id="naeruNt" alt="">

    <div id="naeru-brow"></div>
  </div><div id="emote" class="graded" aria-hidden="true"></div></div></div>
  <button id="naeru-touch" type="button" aria-label="내루미에게 인사하기"></button>
  </div></div>
  <!-- 앞꽃은 같은 배경의 픽셀을 SVG 색상 마스크로 다시 보여준다.
       R-2G+B로 분홍·보라·흰 꽃잎과 잔디를 구분해 붓질 경계를 보존한다.
       꽃술·줄기는 좌표로 보완하고 가장 아래 풀은 부드럽게 연결한다. -->
  <svg id="approach-flowers" viewBox="0 0 2048 1152" aria-hidden="true">
    <defs>
      <filter id="flower-ink" color-interpolation-filters="sRGB">
        <feColorMatrix in="SourceGraphic" type="matrix" result="pink"

        <feColorMatrix in="SourceGraphic" type="matrix" result="white"

        <feComposite in="pink" in2="white" operator="arithmetic" k2="1" k3="1"

        <feColorMatrix in="SourceGraphic" type="matrix" result="no-brown"

        <feComposite in="petals" in2="no-brown" operator="in"/>
        <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-.1"/></feComponentTransfer>
        <feMorphology operator="erode" radius=".3"/>
        <feGaussianBlur stdDeviation=".45"/>
      </filter>
      <clipPath id="flower-area">
        <ellipse cx="538" cy="1026" rx="67" ry="42"/>
        <ellipse cx="390" cy="1090" rx="61" ry="27"/>
        <ellipse cx="135" cy="1131" rx="74" ry="43"/>
        <ellipse cx="888" cy="1090" rx="67" ry="43"/>
        <ellipse cx="1874" cy="938" rx="74" ry="40"/>
        <ellipse cx="1778" cy="997" rx="59" ry="40"/>
        <ellipse cx="1937" cy="1047" rx="91" ry="64"/>
      </clipPath>
      <radialGradient id="front-grass-fade">
        <stop offset=".35" stop-color="white"/>
        <stop offset="1" stop-color="black"/>
      </radialGradient>
      <mask id="front-flowers" maskUnits="userSpaceOnUse" x="0" y="0"

               filter="url(#flower-ink)" clip-path="url(#flower-area)"/>
        <g fill="white">
          <ellipse cx="532" cy="1030" rx="12" ry="6"/>
          <ellipse cx="386" cy="1090" rx="15" ry="7"/>
          <ellipse cx="1848" cy="935" rx="9" ry="7"/>
          <ellipse cx="1938" cy="1045" rx="19" ry="11"/>
        </g>
        <path d="M537 1037Q563 1097 564 1152M388 1093l-10 59
          M886 1098l-8 54M1937 1053l26 99M1849 942q-19 85-17 210
          M1776 999q-38 65-54 153" fill="none" stroke="white" stroke-width="4"/>
      </mask>
    </defs>
    <image id="approach-flower-image" width="2048" height="1152"
           mask="url(#front-flowers)"/>
  </svg>
</div>

<div class="fall fall-near graded"></div>

<!-- 가끔 날아와 내루미 머리를 때리고 사라지는 공.

<div id="frame" class="graded" aria-hidden="true">

    <!-- 애플뮤직 앱아이콘 빨강(2026-09-04 지정). 아이콘의 그러데이션은

    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="47" fill="#fa3b4e"/>
      <circle cx="50" cy="50" r="47" fill="none"
              stroke="rgba(62,46,36,.22)" stroke-width="3"/>
      <circle cx="35" cy="33" r="12" fill="#ffffff" opacity=".28"/>

  </div>
  <div id="bonk"></div>
  <!-- 가끔 날아와 머리에 앉았다 가는 나비. 공과 같은 이유로 #frame 안에

      <ellipse cx="34" cy="44" rx="24" ry="17" fill="#fdf3dc" opacity=".92"/>
      <ellipse cx="66" cy="44" rx="24" ry="17" fill="#fdf3dc" opacity=".92"/>
      <ellipse cx="32" cy="62" rx="16" ry="12" fill="#f2dcae" opacity=".9"/>
      <ellipse cx="68" cy="62" rx="16" ry="12" fill="#f2dcae" opacity=".9"/>
    </g>
    <ellipse cx="50" cy="52" rx="4.5" ry="16" fill="#6b5433"/>
  </svg></div>
</div>

<div class="clock-wrap">

<noscript><style>
