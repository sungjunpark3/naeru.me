<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1f2e">
<meta name="robots" content="noindex, nofollow">
<title>Naerum Naerum</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="내루미">
<meta property="og:url" content="https://naeru.me/">
<meta property="og:image" content="https://naeru.me/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap"
      rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1f2e; /* 영상 로딩 전 어두운 배경 */
    font-family: "Comfortaa", "Avenir Next", "Apple SD Gothic Neo",
                 -apple-system, sans-serif;
  }

  /* 시간대별 정지 프레임(각 영상의 첫 프레임)은 JS가
     --still(전체 배경)·--freeze-a/--freeze-b(하늘 프리즈)
     변수로 주입한다 */

  /* 루프 순간 브라우저가 비디오를 한 프레임 놓쳐도
     어두운 배경 대신 동일한 정지 프레임이 보이도록,
     첫 프레임(=핑퐁 마지막 프레임)을 영상 뒤에 깔아둠 */
  .bg-still {
    position: fixed;
    inset: 0;
    background-image: var(--still);
    background-size: cover;
    background-position: center;
  }

  /* 공에 맞는 순간 배경 전체를 아주 잠깐 흔든다. 겹들을 같은 값으로
     움직여야 정렬이 유지되고, 살짝 확대해서 흔들린 만큼 가장자리에
     빈 틈이 생기지 않게 한다 (기본값 none이면 아무 영향 없음).
     plate·#stage도 여기 포함 — 안 넣으면 배경만 흔들리고 패치 경계·
     내루미가 그대로 있어서 어긋나 보인다 */
  .bg-still, video.bg, .sky-freeze, .plate, #stage {
    transform: var(--bg-shake, none);
  }

  /* ── 배경 영상: A/B 두 장을 겹쳐두고 시간대가 바뀌면
     currentTime을 맞춘 뒤 크로스페이드(같은 원본 영상의
     색보정 변형들이라 픽셀이 정렬됨 → 순수 색상 디졸브) ── */
  video.bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 2.5s ease;
  }
  video.bg.on { opacity: 1; }

  /* ── 구름 고정: 첫 프레임을 하늘 영역에만 덮어서
     구름 움직임을 정지. 영상과 같은 16:9 + cover라서
     창 크기와 무관하게 픽셀이 정확히 정렬됨.
     마스크는 세로(하늘~지평선 위) × 가로(양옆 나무 회피)
     교집합, 경계는 그라디언트로 부드럽게 블렌드.
     비디오와 같은 이유로 A/B 두 장을 겹쳐 크로스페이드 ── */
  .sky-freeze {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2.5s ease;
    -webkit-mask-image:
      linear-gradient(to bottom,
        black 0%, black 42%, transparent 58%),
      linear-gradient(to right,
        transparent 16%, black 28%, black 68%, transparent 80%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to bottom,
        black 0%, black 42%, transparent 58%),
      linear-gradient(to right,
        transparent 16%, black 28%, black 68%, transparent 80%);
    mask-composite: intersect;
  }
  .sky-freeze.on { opacity: 1; }
  #freezeA { background-image: var(--freeze-a); }
  #freezeB { background-image: var(--freeze-b); }

  /* ── 플레이트 패치: 영상에 구워진 내루미를 지우는 정지 조각.
     .sky-freeze와 같은 이유로 A/B 두 장을 겹쳐 크로스페이드한다.
     배경과 똑같이 cover/center라서 화면비가 뭐든 픽셀이 맞는다 ── */
  .plate {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2.5s ease;
  }
  .plate.on { opacity: 1; }
  #plateA { background-image: var(--plate-a); }
  #plateB { background-image: var(--plate-b); }

  /* ── 내루미: #stage가 프레임 사각형(=배경 영상이 cover로 차지하는 상자)이라
     자식은 % 좌표만으로 배치된다. JS 기하 계산 없음.
     z-index를 주지 말 것 — .rain/.vignette와 같은 레벨이라 DOM 순서로
     결정된다(마크업에서 .rain 앞) ── */
  #stage { position: fixed; pointer-events: none; }

  /* transform은 속성이 하나뿐이라 두 코드가 같은 요소에 쓰면 서로 덮어쓴다.
     그래서 역할별로 겹을 나눠 각자 자기 transform만 소유하게 한다:
     #stage=배경 셰이크 / #naeru-move=폴짝·이동 / #naeru-act=움찔·두리번 /
     #naeru-face=방향(뒤집기). CROP box(576×496 @ 1744,1328 / 3840×2160)를
     프레임 비율로 환산한 값 — matte.py의 CROP_ORIGIN/CROP_SIZE와 반드시
     같이 맞출 것(tools/naeru-split/coords.py가 원본) */
  #naeru-move {
    position: absolute;
    left: 45.4167%; top: 61.4815%; width: 15%; height: 22.9630%;
  }
  #naeru-act, #naeru-face { position: absolute; inset: 0; }
  /* 회전·스쿼시의 기준점은 발끝이다. 크롭 상단이 y1328, 발끝이 y1720이므로
     세로 (1720-1328)/496 = 79.03%, 가로는 몸 중심 x2020 →
     (2020-1744)/576 = 47.92%. 틀리면 기울일 때 발이 지면에서 뜬다 */
  #naeru-act, #naeru-face { transform-origin: 47.9167% 79.0323%; }
  .naeru, #naeruStill {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity 2.5s ease;
  }
  .naeru.on, #naeruStill.on { opacity: 1; }
  /* 공 IIFE의 headAt()이 겨냥하는, 화면에 안 보이는 기준점. #naeru-face
     안에 있어서 폴짝·움찔·뒤집기 중에도 getBoundingClientRect()로 실제
     렌더 위치를 그대로 읽을 수 있다. 프레임 좌표 (1995,1399) → 크롭
     (1744,1328,576,496) 기준 (43.5764%, 14.3145%) */
  #naeru-head { position: absolute; left: 43.5764%; top: 14.3145%; width: 1px; height: 1px; }

  /* ── 비 레이어: 하늘 프리즈 위에서도 비가 계속 내리도록
     영상이 아닌 DOM에서 렌더. 줄기는 수직 텍스처, 레이어를
     skewX로 기울여 낙하 방향 = 줄기 축. 텍스처 높이(1024px)
     단위로 background-position을 굴리므로 완벽 루프.
     원경(가늘고 느림)/근경(굵고 빠름) 2겹으로 깊이감 ──── */
  .rain {
    position: fixed;
    inset: -14% -8%;
    pointer-events: none;
    transform: skewX(-8deg);
    background-repeat: repeat;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2.5s ease, visibility 2.5s;
    animation: rainfall linear infinite;
    animation-play-state: paused;
  }
  .rain-far  { background-image: url("img/rain-far.png");  animation-duration: 1.8s; }
  .rain-near { background-image: url("img/rain-near.png"); animation-duration: 0.95s; }
  @keyframes rainfall { to { background-position: 0 1024px; } }
  body[data-weather="rain"] .rain {
    visibility: visible;
    animation-play-state: running;
  }
  body[data-weather="rain"] .rain-far  { opacity: 0.5; }
  body[data-weather="rain"] .rain-near { opacity: 0.62; }
  /* 밤에는 줄기가 너무 하얗게 뜨지 않게 */
  body[data-weather="rain"][data-variant^="night"] .rain-far  { opacity: 0.26; }
  body[data-weather="rain"][data-variant^="night"] .rain-near { opacity: 0.34; }

  /* 은은한 비네트 — cozy한 깊이감, 밤에는 조금 더 깊게 */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      ellipse at center,
      transparent 55%,
      rgba(10, 14, 25, 0.42) 100%
    );
    opacity: 0.85;
    transition: opacity 2.5s ease;
  }
  body[data-variant^="night"] .vignette { opacity: 1; }
  body[data-variant="day"]    .vignette { opacity: 0.6; }

  /* ── 시계: 내루미를 가리지 않도록 상단 배치 ─────── */
  .clock-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8vh;
    user-select: none;
  }

  .clock-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .time {
    font-size: clamp(3.5rem, 10vw, 7.5rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: rgba(255, 252, 245, 0.96);
    text-shadow:
      0 2px 24px rgba(20, 25, 40, 0.55),
      0 0 60px rgba(255, 240, 210, 0.25);
    font-variant-numeric: tabular-nums;
  }

  .time .colon { animation: blink 2s ease-in-out infinite; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  .date {
    font-size: clamp(1rem, 2.2vw, 1.5rem);
    font-weight: 400;
    letter-spacing: 0.18em;
    color: rgba(255, 250, 240, 0.85);
    text-shadow: 0 1px 12px rgba(20, 25, 40, 0.6);
  }

  /* ── 프레임 박스: 배경 영상이 cover로 실제 차지하는 사각형.
     이 안에서는 좌표를 프레임 비율로 쓸 수 있어서, 영상에 구워진
     내루미 머리 같은 지점을 화면비와 무관하게 정확히 가리킬 수 있다.
     cover 계산을 개체마다 하지 않고 이 상자 하나에만 하는 게 요점 ── */
  #frame {
    position: fixed;
    pointer-events: none;
    z-index: 1;              /* 비네트 위, 시계 아래 */
  }
  #ball, #bonk {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    will-change: transform, opacity;
  }
  #ball svg { display: block; width: 100%; height: 100%; }
  #bonk {
    border-radius: 50%;
    border: 2px solid rgba(255, 252, 245, 0.85);
  }
  .clock-wrap { z-index: 2; }

  /* 움직임 최소화 설정 존중: 영상 없이 정지 프레임만 표시
     (JS도 이 경우 영상을 아예 로드하지 않음) */
  @media (prefers-reduced-motion: reduce) {
    .clock-inner, .time .colon { animation: none !important; }
    .rain { display: none !important; }
    video.bg, .naeru { display: none !important; }
    .sky-freeze, .plate, #naeruStill { transition: none !important; }
    #frame { display: none !important; }
  }
</style>
</head>
<body>

<div class="bg-still"></div>

<video id="bgA" class="bg" muted loop playsinline preload="auto"></video>
<video id="bgB" class="bg" muted loop playsinline preload="none"></video>

<div id="freezeA" class="sky-freeze"></div>
<div id="freezeB" class="sky-freeze"></div>

<div id="plateA" class="plate"></div>
<div id="plateB" class="plate"></div>

<!-- 배경 영상에서 내루미를 지운 자리에 다시 얹는 DOM 내루미.
     plate 위, .rain/.vignette 아래 — 구워져 있던 내루미 위로 비·비네트가
     얹혀 있었으므로 그래야 지금과 톤이 같다 -->
<div id="stage">
  <div id="naeru-move"><div id="naeru-act"><div id="naeru-face">
    <video id="naeruA" class="naeru" muted loop playsinline preload="auto"></video>
    <video id="naeruB" class="naeru" muted loop playsinline preload="none"></video>
    <img id="naeruStill" alt="">
    <div id="naeru-head"></div>
  </div></div></div>
</div>

<div class="rain rain-far"></div>
<div class="rain rain-near"></div>

<div class="vignette"></div>

<!-- 가끔 날아와 내루미 머리를 때리고 사라지는 공.
     프레임 박스 안에 비율로 배치되므로 화면비가 뭐든 머리에 맞는다 -->
<div id="frame">
  <div id="ball">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="47" fill="#f4ecdb"/>
      <path d="M50,50 L50,3 A47,47 0 0 1 90.7,26.5 Z" fill="#d9755a"/>
      <path d="M50,50 L90.7,73.5 A47,47 0 0 1 50,97 Z" fill="#5e97b3"/>
      <path d="M50,50 L9.3,73.5 A47,47 0 0 1 9.3,26.5 Z" fill="#e0b45f"/>
      <circle cx="50" cy="50" r="47" fill="none"
              stroke="rgba(62,46,36,.20)" stroke-width="3"/>
      <circle cx="34" cy="32" r="11" fill="#fffaf0" opacity=".55"/>
    </svg>
  </div>
  <div id="bonk"></div>
</div>

<div class="clock-wrap">
  <div class="clock-inner">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
  </div>
</div>

<script>
/* ── 프레임 사각형 계산: 배경 영상이 cover로 차지하는 16:9 상자.
   #frame(공)과 #stage(내루미) 둘 다 이 식 하나에 맞춘다 — 공 IIFE가 이미
   6개 화면비에서 검증한 수식 그대로, 개체마다 따로 계산하지 않는 게 요점.
   독립 IIFE들이 각자 자기 요소에 대고 부르므로 이 함수 자체는 상태가 없다 ── */
function layoutFrameBox(el) {
  var AR = 16 / 9, vw = innerWidth, vh = innerHeight, W, H;
  if (vw / vh >= AR) { W = vw; H = vw / AR; } else { H = vh; W = vh * AR; }
  el.style.width  = W + "px";
  el.style.height = H + "px";
  el.style.left   = ((vw - W) / 2) + "px";
  el.style.top    = ((vh - H) / 2) + "px";
  return { W: W, H: H };
}
</script>

<script>
(function () {
  var TZ = "Asia/Seoul";

  /* ── 시간대 → 배경 밴드 ──────────────────────────
     서울의 실제 일출·일몰(Open-Meteo daily) 기준:
     dawn = 일출−40분~+50분, dusk = 일몰−50분~+40분,
     그 사이가 day, 나머지가 night. 실황을 아직 못 받았으면
     고정 밴드(05–08/08–17/17–20/20–05)로 폴백.
     서울에 비가 오면 "-rain" 변형(흐린 그레이딩+비 레이어).
     URL 강제: ?v=dawn|day|dusk|night, ?h=22, ?w=rain|clear */
  var sun = null;                    // {sr, ss} 자정 기준 분 단위

  function bandFor(min) {
    if (sun) {
      if (min >= sun.sr - 40 && min < sun.sr + 50) return "dawn";
      if (min >= sun.sr + 50 && min < sun.ss - 50) return "day";
      if (min >= sun.ss - 50 && min < sun.ss + 40) return "dusk";
      return "night";
    }
    var h = Math.floor(min / 60);
    if (h >= 5 && h < 8)   return "dawn";
    if (h >= 8 && h < 17)  return "day";
    if (h >= 17 && h < 20) return "dusk";
    return "night";
  }

  var params  = new URLSearchParams(location.search);
  var forced  = params.get("v");
  var fakeH   = params.get("h");
  var forcedW = params.get("w");
  if (["dawn", "day", "dusk", "night"].indexOf(forced) < 0) forced = null;
  if (["rain", "clear"].indexOf(forcedW) < 0) forcedW = null;

  /* 직전 방문에서 저장한 날씨·일출일몰(3시간 이내)로 즉시
     시작해서 첫 화면부터 정확한 변형을 띄우고, 실황 도착 후
     다르면 크로스페이드로 정정 */
  var WKEY    = "naeru-weather";
  var cachedW = null;
  try {
    var c = JSON.parse(localStorage.getItem(WKEY) || "null");
    if (c && Date.now() - c.t < 3 * 3600000 &&
        (c.w === "rain" || c.w === "clear")) {
      cachedW = c.w;
      if (typeof c.sr === "number" && typeof c.ss === "number") {
        sun = { sr: c.sr, ss: c.ss };
      }
    }
  } catch (e) {}
  var weather = forcedW || cachedW || "clear";

  function seoulMinutes(now) {
    if (fakeH !== null) return (parseInt(fakeH, 10) % 24) * 60;
    var t = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(now);
    var p = {};
    t.forEach(function (x) { p[x.type] = x.value; });
    return (parseInt(p.hour, 10) % 24) * 60 + parseInt(p.minute, 10);
  }

  function currentVariant() {
    var band = forced || bandFor(seoulMinutes(new Date()));
    return band + (weather === "rain" ? "-rain" : "");
  }

  /* ── 서울 실황 (Open-Meteo, 키 불필요·CORS 허용) ──
     WMO 코드가 강수(이슬비·비·눈·소나기·뇌우)면 rain.
     일출·일몰도 같은 요청으로 받아 밴드 계산에 사용 */
  var METEO = "https://api.open-meteo.com/v1/forecast" +
              "?latitude=37.5665&longitude=126.978" +
              "&current=weather_code" +
              "&daily=sunrise,sunset&forecast_days=1" +
              "&timezone=Asia%2FSeoul";
  var RAINY = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67,
               71, 73, 75, 77, 80, 81, 82, 85, 86, 95, 96, 99];

  function minutesOf(iso) {     // "2026-07-10T05:17" → 317
    var m = /T(\d\d):(\d\d)/.exec(iso || "");
    return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
  }

  var lastFetch = 0;
  function fetchWeather() {
    if (forcedW) return Promise.resolve();
    return fetch(METEO)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var c = d && d.current && d.current.weather_code;
        weather   = RAINY.indexOf(c) >= 0 ? "rain" : "clear";
        lastFetch = Date.now();
        if (d && d.daily) {
          var sr = minutesOf(d.daily.sunrise && d.daily.sunrise[0]);
          var ss = minutesOf(d.daily.sunset  && d.daily.sunset[0]);
          if (sr !== null && ss !== null) sun = { sr: sr, ss: ss };
        }
        try {
          localStorage.setItem(WKEY, JSON.stringify({
            w: weather, t: lastFetch,
            sr: sun && sun.sr, ss: sun && sun.ss
          }));
        } catch (e) {}
      })
      .catch(function () {});   // 실패 시 마지막 상태 유지
  }

  /* ── A/B 비디오 + 하늘 프리즈 크로스페이드 ────── */
  var vids    = [document.getElementById("bgA"), document.getElementById("bgB")];
  var freezes = [document.getElementById("freezeA"), document.getElementById("freezeB")];
  var slot    = 0;          // 현재 활성 슬롯 (0=A, 1=B) — plate·naeru도 같이 씀
  var active  = null;       // 현재 변형 이름
  var root    = document.documentElement;
  var noMotion =
    params.get("still") === "1" ||    // ?still=1 — 브라우저 픽셀 diff용 강제
    matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* HEVC 10-bit(같은 화질, 용량↓)를 지원하면 우선 사용,
     아니면 H.264. 재생 에러 시에도 H.264로 폴백 */
  var HEVC = document.createElement("video")
    .canPlayType('video/mp4; codecs="hvc1.2.4.L153.B0"') !== "";

  function srcOf(v) {
    return "img/meadow-" + v + (HEVC ? ".hevc" : "") + ".mp4";
  }
  function freezeOf(v) { return 'url("img/sky-' + v + '.jpg")'; }

  vids.forEach(function (v) {
    v.addEventListener("error", function () {
      if (!HEVC || !v.getAttribute("src")) return;
      HEVC = false;
      v.src = srcOf(active);
      v.play().catch(function () {});
    });
  });

  /* ── 플레이트 + 내루미 ───────────────────────────
     plate는 .sky-freeze와 똑같이 배경 cover 그대로라 좌표 계산이 없다.
     내루미는 #stage(아래 layoutStage) 안에서 % 좌표만 쓴다 ── */
  var plates      = [document.getElementById("plateA"), document.getElementById("plateB")];
  var naeruVideos = [document.getElementById("naeruA"), document.getElementById("naeruB")];
  var naeruStill  = document.getElementById("naeruStill");
  var stage       = document.getElementById("stage");
  function layoutStage() { layoutFrameBox(stage); }
  addEventListener("resize", layoutStage);
  layoutStage();

  function plateOf(v) { return 'url("img/plate-' + v + '.png")'; }
  function naeruStillOf(v) { return "img/naeru-" + v + ".png"; }
  function naeruSrcOf(v, fmt) { return "img/naeru-" + v + "." + fmt; }

  /* Safari는 VP9 webm을 재생은 하되 알파를 무시해 검은 사각형으로 그린다.
     canPlayType으로는 구분이 안 되므로, 16×16 완전 투명 프로브를 캔버스에
     그려 실제 알파를 읽는다. 본편을 받기 전에 판정해야 검은 사각형이 안 뜬다.
     noMotion이면 영상 자체를 안 쓰므로 프로브도 건너뛴다 */
  var naeruFormat = null;             // "webm" | "mp4" — 판정 후 확정
  var naeruStillFallback = false;     // mp4마저 실패하면 영구히 정지본으로
  var naeruFormatReady = noMotion ? Promise.resolve("still") : new Promise(function (resolve) {
    var probe = document.createElement("video");
    probe.muted = true; probe.playsInline = true;
    var done = false;
    function finish(fmt) {
      if (done) return;
      done = true;
      naeruFormat = fmt;
      resolve(fmt);
    }
    probe.addEventListener("loadeddata", function () {
      try {
        var c = document.createElement("canvas");
        c.width = c.height = 2;
        var ctx = c.getContext("2d");
        ctx.drawImage(probe, 0, 0, 2, 2);
        finish(ctx.getImageData(0, 0, 1, 1).data[3] === 0 ? "webm" : "mp4");
      } catch (e) { finish("mp4"); }
    });
    probe.addEventListener("error", function () { finish("mp4"); });
    probe.src = "img/alpha-probe.webm";
    probe.load();
    setTimeout(function () { finish("mp4"); }, 1200);
  });

  naeruVideos.forEach(function (v) {
    v.addEventListener("error", function () {
      if (naeruStillFallback || !v.getAttribute("src")) return;
      if (naeruFormat === "webm") {          // webm이 깨졌으면 mp4로
        naeruFormat = "mp4";
        v.src = naeruSrcOf(active, "mp4");
        v.play().catch(function () {});
      } else {                               // mp4마저 실패 → 정지본 후퇴
        naeruStillFallback = true;
        naeruVideos.forEach(function (x) { x.classList.remove("on"); });
        naeruStill.src = naeruStillOf(active);
        naeruStill.classList.add("on");
      }
    });
  });

  function setNaeru(targetSlot, variant) {
    naeruStill.src = naeruStillOf(variant);      // reduced-motion·최종 폴백 둘 다 이걸 씀
    if (noMotion || naeruStillFallback) {
      naeruStill.classList.add("on");
      return;
    }
    naeruFormatReady.then(function (fmt) {
      if (naeruStillFallback) return;            // 기다리는 사이 폴백 확정된 경우
      var vNew = naeruVideos[targetSlot], vOld = naeruVideos[1 - targetSlot];
      vNew.poster = naeruStillOf(variant);
      vNew.src = naeruSrcOf(variant, fmt);
      try { vNew.currentTime = 0; } catch (e) {}
      vNew.play().catch(function () {});
      vNew.classList.add("on");
      vOld.classList.remove("on");
      setTimeout(function () {
        vOld.pause();
        vOld.removeAttribute("src");
        vOld.load();
      }, 3000);
    });
  }

  function show(variant) {           // 최초 로드: 즉시 표시
    active = variant;
    document.body.dataset.variant = variant;
    document.body.dataset.weather = weather;
    root.style.setProperty("--still", freezeOf(variant));
    root.style.setProperty("--freeze-a", freezeOf(variant));
    freezes[slot].classList.add("on");
    root.style.setProperty("--plate-a", plateOf(variant));
    plates[slot].classList.add("on");
    setNaeru(slot, variant);
    if (noMotion) return;            // 움직임 최소화: 배경 영상 로드 생략
    var v = vids[slot];
    v.poster = "img/sky-" + variant + ".jpg";
    v.src = srcOf(variant);
    v.classList.add("on");
    v.play().catch(function () {});
  }

  function crossfadeTo(variant) {    // 시간대·날씨 변경: 부드럽게 전환
    active = variant;
    document.body.dataset.variant = variant;
    document.body.dataset.weather = weather;
    var oldSlot = slot, newSlot = 1 - slot;
    slot = newSlot;
    root.style.setProperty(newSlot === 0 ? "--freeze-a" : "--freeze-b",
                           freezeOf(variant));
    root.style.setProperty(newSlot === 0 ? "--plate-a" : "--plate-b",
                           plateOf(variant));
    plates[newSlot].classList.add("on");
    plates[oldSlot].classList.remove("on");
    setNaeru(newSlot, variant);
    if (noMotion) {                  // 정지 프레임끼리 즉시 교체
      freezes[newSlot].classList.add("on");
      freezes[oldSlot].classList.remove("on");
      root.style.setProperty("--still", freezeOf(variant));
      return;
    }
    var vNew = vids[newSlot], vOld = vids[oldSlot];
    vNew.src = srcOf(variant);
    vNew.load();
    vNew.addEventListener("canplay", function onReady() {
      vNew.removeEventListener("canplay", onReady);
      // 같은 푸티지이므로 재생 위치를 맞추면 완전한 색상 디졸브가 됨
      try { vNew.currentTime = vOld.currentTime; } catch (e) {}
      vNew.play().catch(function () {});
      requestAnimationFrame(function () {
        vNew.classList.add("on");
        freezes[newSlot].classList.add("on");
        vOld.classList.remove("on");
        freezes[oldSlot].classList.remove("on");
      });
      setTimeout(function () {       // 페이드 종료 후 이전 영상 해제
        vOld.pause();
        vOld.removeAttribute("src");
        vOld.load();
        // 프레임 드랍 대비 정지 프레임도 현재 변형으로 교체
        root.style.setProperty("--still", freezeOf(variant));
      }, 3000);
    });
  }

  /* ── 시계 ──────────────────────────────────────── */
  function render() {
    var now = new Date();

    // 서울 시각 HH:MM
    var t = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(now);
    var parts = {};
    t.forEach(function (p) { parts[p.type] = p.value; });
    var hour = String(parseInt(parts.hour, 10) % 24).padStart(2, "0");

    document.getElementById("time").innerHTML =
      hour + '<span class="colon">:</span>' + parts.minute;

    // Jul 3, 2026 형태
    document.getElementById("date").textContent =
      new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, month: "short", day: "numeric", year: "numeric"
      }).format(now);

    // 시간대가 바뀌었으면 배경 크로스페이드
    var v = currentVariant();
    if (v !== active) crossfadeTo(v);
  }

  /* ── 시작: 캐시·강제값이 있으면 대기 없이 즉시 표시,
     캐시 없는 첫 방문만 실황을 최대 900ms 기다림
     (지연·실패 시 일단 맑음으로 시작, 도착하면 전환) ── */
  function sync() {
    var v = currentVariant();
    if (v !== active) crossfadeTo(v);
  }
  var booted = false;
  function boot() {
    if (booted) { sync(); return; }
    booted = true;
    show(currentVariant());
    render();
    setInterval(function () {        // 날씨 실황 5분 주기 갱신
      if (document.hidden) return;   // 복귀 시 아래 핸들러가 재조회
      fetchWeather().then(sync);
    }, 300000);
  }
  fetchWeather().then(boot);
  if (forcedW || cachedW) boot();
  else setTimeout(boot, 900);

  // 탭이 숨겨지면 영상을 멈춰 배터리 절약, 다시 보이면
  // 영상 재개 + 시계·배경 즉시 갱신 + 날씨 재확인
  // (백그라운드에선 타이머가 제한돼 실황이 밀릴 수 있음)
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      vids[0].pause();
      vids[1].pause();
      return;
    }
    if (!booted) return;
    if (!noMotion && vids[slot].src) {
      vids[slot].play().catch(function () {});
    }
    render();
    if (Date.now() - lastFetch > 60000) fetchWeather().then(sync);
  });

  // 다음 분 경계에 맞춰 갱신 (초 표시가 없으므로 분 단위면 충분)
  function tick() {
    render();
    setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
  }
  setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
})();
</script>

<script>
/* ── 공 콩 ────────────────────────────────────────────────────────
   몇 분에 한 번, 화면 밖에서 공이 날아와 내루미 머리를 때리고 튕겨
   나간다. 시계·배경 코드와 독립된 IIFE라 여기서 터져도 본체는 멀쩡.

   왜 DOM인가: 배경은 316프레임 핑퐁 루프라 영상에 구우면 (1) 13초마다
   반복돼서 "가끔"이 안 되고 (2) 후반부가 역재생이라 때린 게 도로 안
   때린 게 된다. 랜덤 타이밍은 구조상 DOM일 수밖에 없다.

   왜 이건 좌표가 안 어긋나는가: 위치 계산을 개체마다 하지 않는다.
   #frame 하나만 cover 사각형으로 맞춰두고 공은 그 안에서 프레임
   비율로 움직이므로, 화면비가 뭐든 머리 위치와 크기가 같이 따라간다.

   맞는 연기는 공 쪽(찌그러짐 + 임팩트 링) + 배경 190ms 흔들림에 더해,
   내루미 쪽도 hit()가 window.naeru.flinch(dir)를 불러 함께 움찔한다
   (naeru-split/PLAN §4.4 — 내루미가 DOM으로 분리되기 전엔 구워진
   캐릭터라 움찔이 불가능했던 시절의 흔적이 이 함수였다).

   ?ball=0 끄기 / ?ball=1 즉시·반복(빈도 튜닝용) ─────────────────── */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var flag = new URLSearchParams(location.search).get("ball");
  if (flag === "0") return;
  var DEBUG = flag === "1";

  // window.naeru가 없을 때(행동 IIFE가 꺼졌거나 터졌을 때)의 폴백 조준점.
  // 있으면 naeru.headAt()이 폴짝·움찔 중의 실제 위치를 대신 준다
  var HEAD_U = 0.523, HEAD_V = 0.634;
  var BALL_W = 0.024;                   // 프레임 폭 대비 공 지름
  var IN_MS  = 640, HIT_MS = 110, OUT_MS = 820;
  var FIRST  = [20000, 45000];          // 첫 등장까지
  var GAP    = [120000, 360000];        // 그 뒤 간격 — 여기만 만지면 됨

  var frame = document.getElementById("frame");
  var ball  = document.getElementById("ball");
  var bonk  = document.getElementById("bonk");
  var root  = document.documentElement;
  var W = 0, H = 0;                     // 프레임 박스 크기(px)

  function layout() {
    var box = layoutFrameBox(frame);      // #stage와 같은 공용 식(전역 함수)
    W = box.W; H = box.H;
    // 좌우 마진을 반지름만큼 당겨두면 transform 좌표 = 공의 중심
    var d = BALL_W * W;
    ball.style.width = ball.style.height = d + "px";
    ball.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
  }
  addEventListener("resize", layout);
  layout();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function qbez(p0, c, p1, t) {         // 2차 베지어 = 던진 궤적
    var u = 1 - t;
    return [u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0],
            u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]];
  }

  function place(u, v, rot, sx, sy) {
    ball.style.transform =
      "translate(" + (u * W).toFixed(1) + "px," + (v * H).toFixed(1) + "px)" +
      " rotate(" + rot.toFixed(1) + "deg) scale(" + sx.toFixed(3) + "," +
      sy.toFixed(3) + ")";
  }

  function shake() {
    var t0 = performance.now(), MS = 190;
    (function step(now) {
      var t = (now - t0) / MS;
      if (t >= 1) { root.style.setProperty("--bg-shake", "none"); return; }
      var damp = (1 - t) * (1 - t);
      root.style.setProperty("--bg-shake",
        "scale(1.008) translate(" +
        (Math.sin(t * Math.PI * 6) * 3.2 * damp).toFixed(2) + "px," +
        (Math.cos(t * Math.PI * 5) * 2.0 * damp).toFixed(2) + "px)");
      requestAnimationFrame(step);
    })(t0);
  }

  function ring(head) {                 // 임팩트 순간 퍼지는 원
    var d = BALL_W * W * 2.0;
    var at = "translate(" + (head.x * W).toFixed(1) + "px," +
             (head.y * H).toFixed(1) + "px)";
    bonk.style.transition = "none";
    bonk.style.width = bonk.style.height = d + "px";
    bonk.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
    bonk.style.borderWidth = Math.max(1.5, d * 0.045).toFixed(1) + "px";
    bonk.style.transform = at + " scale(.35)";
    bonk.style.opacity = ".85";
    requestAnimationFrame(function () {
      bonk.style.transition =
        "transform .42s cubic-bezier(.2,.7,.3,1), opacity .42s ease-out";
      bonk.style.transform = at + " scale(1.5)";
      bonk.style.opacity = "0";
    });
  }

  function bounce(dir, spin, head) {    // 머리에서 튕겨 날아가며 사라짐
    var p0 = [head.x, head.y];
    var c  = [head.x + dir * 0.26, head.y - 0.24];
    var p1 = [head.x + dir * 0.72, head.y + 0.12];
    var t0 = performance.now();
    (function step(now) {
      var t = (now - t0) / OUT_MS;
      if (t >= 1) {
        ball.style.opacity = "0";
        if (window.naeru) window.naeru.busy = false;
        schedule();
        return;
      }
      var p = qbez(p0, c, p1, t);
      place(p[0], p[1], spin * (1 + t * 1.4), 1, 1);
      ball.style.opacity = String(Math.max(0, 1 - Math.max(0, (t - .55) / .45)));
      requestAnimationFrame(step);
    })(t0);
  }

  function hit(dir, spin, head) {       // 찌그러졌다 돌아오는 한 박자
    ring(head);
    shake();
    if (window.naeru) window.naeru.flinch(dir);   // 맞은 놈이 더 흔들리는 게 맞다
    var t0 = performance.now();
    (function step(now) {
      var t = (now - t0) / HIT_MS;
      if (t >= 1) { bounce(dir, spin, head); return; }
      var k = Math.sin(t * Math.PI);
      place(head.x, head.y, spin, 1 + .30 * k, 1 - .28 * k);
      requestAnimationFrame(step);
    })(t0);
  }

  function toss() {
    var dir = Math.random() < 0.5 ? 1 : -1;        // 1 = 왼쪽에서 날아옴
    // 목표점은 이 던지기 하나에 고정 — 도중에 폴짝이 끼어들어도 흔들리지
    // 않게. window.naeru 없으면(행동 IIFE 꺼짐/에러) 상수로 폴백
    var head = window.naeru ? window.naeru.headAt() : { x: HEAD_U, y: HEAD_V };
    if (window.naeru) window.naeru.busy = true;    // 날아오는 동안 새 행동 금지
    // 프레임은 항상 뷰포트보다 넓으므로, 프레임 밖 = 화면 밖이 보장된다
    var p0 = [dir > 0 ? -0.14 : 1.14, rand(0.20, 0.32)];
    var p1 = [head.x, head.y];
    // 조절점을 출발 높이에 두고 가로로 절반쯤 밀면 포물선 낙하가 된다
    var c  = [p0[0] + (p1[0] - p0[0]) * 0.55, p0[1] - 0.04];
    var spin = rand(140, 300) * dir;
    var t0 = performance.now();
    ball.style.opacity = "1";
    (function step(now) {
      var t = (now - t0) / IN_MS;
      if (t >= 1) { hit(dir, spin, head); return; }
      var e = t * t * .35 + t * .65;               // 끝에서 살짝 가속
      var p = qbez(p0, c, p1, e);
      place(p[0], p[1], spin * e, 1, 1);
      requestAnimationFrame(step);
    })(t0);
  }

  function schedule(first) {
    var ms = DEBUG ? (first ? 1000 : 5000)
                   : rand.apply(null, first ? FIRST : GAP);
    setTimeout(function () {
      if (document.hidden) { schedule(); return; }  // 숨은 탭에선 건너뜀
      // 폴짝·두리번 중이면 미룬다. 조준점은 던지는 순간 한 번만 읽으므로
      // 그때 내루미가 공중이면 640ms 뒤엔 이미 내려와 있어 빗나간다
      if (window.naeru && window.naeru.busy) { schedule(); return; }
      toss();
    }, ms);
  }
  schedule(true);
})();
</script>

<script>
/* ── 내루미 행동: 제자리 반응 — 폴짝 · 두리번 · 좌우 뒤집기.
   (움찔은 공 IIFE의 hit()가 window.naeru.flinch()로 직접 부른다.)
   공 IIFE와 같은 패턴의 독립 IIFE — 여기가 터져도 시계·배경·공은 살아야
   한다. window.naeru를 공개해서 공 IIFE와 최소한의 계약만 주고받는다.

   진폭 상한은 구워진 접지 그림자가 정한다(그림자가 몸을 안 따라오므로):
   수직(폴짝)은 자기 키의 15% — 자유. 수평(움찔·두리번)은 ±20px@4K(폭의
   6%)까지만. 회전은 2.5deg까지만 — 넘으면 발이 미끄러진 것처럼 보인다.

   transform은 요소 하나에 하나씩: #naeru-move=폴짝(translateY) /
   #naeru-act=움찔·두리번(rotate·translateX·scale) / #naeru-face=방향
   (scaleX). 겹을 안 지키면 서로 덮어쓴다.

   ?act=0 전체 끄기 / ?act=hop|look|flip 해당 동작만 5초 간격 반복 ───── */
(function () {
  var params = new URLSearchParams(location.search);
  // ?still=1(정지 프레임 강제)일 땐 동작도 멈춰야 스크린샷이 결정적이 된다 —
  // 브라우저 픽셀 diff가 이걸 쓴다
  if (params.get("still") === "1") return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var actFlag = params.get("act");
  if (actFlag === "0") return;
  var DEBUG = ["hop", "look", "flip"].indexOf(actFlag) >= 0 ? actFlag : null;

  var move = document.getElementById("naeru-move");
  var act  = document.getElementById("naeru-act");
  var face = document.getElementById("naeru-face");
  var head = document.getElementById("naeru-head");
  var stage = document.getElementById("stage");
  if (!move || !act || !face || !head || !stage) return;

  var facing = 1;              // 1 = 원래 방향, -1 = 좌우 뒤집힘
  var HOP_GAP  = [25000, 90000];
  var LOOK_GAP = [40000, 120000];

  window.naeru = {
    busy:   false,      // 공이 날아오는 동안(또는 자체 행동 중) 새 행동 금지
    flinch: flinch,
    headAt: headAt
  };

  function rand(a, b) { return a + Math.random() * (b - a); }

  function headAt() {                   // 머리 꼭대기의 현재 화면 좌표(프레임 비율)
    var r = head.getBoundingClientRect();
    var s = stage.getBoundingClientRect();
    // #stage가 아직 크기를 못 받은 순간의 폴백. 프레임 비율이어야 한다 —
    // 크롭 기준 비율(0.436, 0.143)을 넣으면 공이 엉뚱한 데로 날아간다
    if (!s.width || !s.height) return { x: 1995 / 3840, y: 1399 / 2160 };
    return { x: (r.left - s.left) / s.width, y: (r.top - s.top) / s.height };
  }

  function setMove(t) { move.style.transform = t; }
  function setAct(t)  { act.style.transform  = t; }

  // 공용 타이밍 헬퍼: dur(ms)짜리 구간을 진행률 0→1로 fn에 넘겨 반복 호출.
  // sequence()가 여러 구간을 이어붙여 폴짝·두리번의 여러 박자를 만든다
  function tick(dur, fn, done) {
    var t0 = performance.now();
    (function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      fn(t);
      if (t < 1) requestAnimationFrame(step);
      else if (done) done();
    })(t0);
  }
  function sequence(steps, onDone) {
    var i = 0;
    function next() {
      if (i >= steps.length) { if (onDone) onDone(); return; }
      var s = steps[i++];
      tick(s.dur, s.fn, next);
    }
    next();
  }

  function hop(forceFlip) {
    window.naeru.busy = true;
    var doDouble = Math.random() < 0.2;             // 가끔(20%) 2연속
    // 방향 전환은 공중에서만 한다(§4.5) — 구워진 그림자는 안 뒤집히므로 땅에
    // 붙은 채로 홱 뒤집히면 티가 난다. 뒤집힌 상태면 되돌릴 확률을 높게 둬서
    // 오래 거울상으로 남지 않게 한다(그래도 전환은 늘 공중에서 일어난다)
    var willFlip = forceFlip || Math.random() < (facing < 0 ? 0.7 : 0.2);
    var didFlip  = false;

    sequence([
      { dur: 110, fn: function (t) {                 // 웅크림
          setAct("scale(" + (1 + 0.06 * t) + "," + (1 - 0.08 * t) + ")");
      } },
      { dur: 260, fn: function (t) {                 // 상승 ease-out
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-13 * e) + "%)");
          setAct("scale(" + (1.06 - 0.09 * t) + "," + (0.92 + 0.13 * t) + ")");
          if (willFlip && !didFlip && t > 0.4) {   // 정점 부근에서 전환
            didFlip = true;
            facing = -facing;
            face.style.transform = facing < 0 ? "scaleX(-1)" : "";
          }
      } },
      { dur: 220, fn: function (t) {                 // 하강 ease-in — 착지 직전 스케일은 중립
          var e = t * t;
          setMove("translateY(" + (-13 * (1 - e)) + "%)");
          setAct("scale(" + (0.97 + 0.03 * e) + "," + (1.05 - 0.05 * e) + ")");
      } },
      { dur: 90, fn: function (t) {                  // 착지
          setAct("scale(" + (1 + 0.05 * t) + "," + (1 - 0.06 * t) + ")");
      } },
      { dur: 120, fn: function (t) {                 // 착지 복귀
          setAct("scale(" + (1.05 - 0.05 * t) + "," + (0.94 + 0.06 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct("");   // 방향(facing)은 유지 — 되돌리기도 다음 폴짝의 공중에서
      if (doDouble) setTimeout(hopAgain, 60);
      else { window.naeru.busy = false; schedule("hop"); }
    });
  }

  function hopAgain() {                               // 70% 높이로 한 번 더
    sequence([
      { dur: 90, fn: function (t) {
          setAct("scale(" + (1 + 0.05 * t) + "," + (1 - 0.07 * t) + ")");
      } },
      { dur: 200, fn: function (t) {
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-9.1 * e) + "%)");
          setAct("scale(" + (1.05 - 0.08 * t) + "," + (0.93 + 0.12 * t) + ")");
      } },
      { dur: 170, fn: function (t) {
          var e = t * t;
          setMove("translateY(" + (-9.1 * (1 - e)) + "%)");
          setAct("scale(" + (0.97 + 0.03 * t) + "," + (1.05 - 0.05 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct("");
      window.naeru.busy = false;
      schedule("hop");
    });
  }

  function look() {                                   // 몸 전체를 갸웃 = 두리번
    window.naeru.busy = true;
    var dir = Math.random() < 0.5 ? 1 : -1;
    sequence([
      { dur: 380, fn: function (t) {                  // 한쪽으로
          var e = 1 - Math.pow(1 - t, 2);
          setAct("rotate(" + (dir * 2 * e) + "deg) translateX(" + (dir * 0.8 * e) + "%)");
      } },
      { dur: 700, fn: function () {} },                // 정지
      { dur: 420, fn: function (t) {                  // 반대쪽으로
          var k = dir * 2 * (1 - 2 * t), kx = dir * 0.8 * (1 - 2 * t);
          setAct("rotate(" + k + "deg) translateX(" + kx + "%)");
      } },
      { dur: 450, fn: function (t) {                  // 복귀
          var e = 1 - Math.pow(1 - t, 2);
          setAct("rotate(" + (-dir * 2 * (1 - e)) + "deg) translateX(" +
                 (-dir * 0.8 * (1 - e)) + "%)");
      } }
    ], function () {
      setAct("");
      window.naeru.busy = false;
      schedule("look");
    });
  }

  function flinch(dir) {                               // 공에 맞을 때 — 공 IIFE가 호출
    dir = dir || (Math.random() < 0.5 ? 1 : -1);
    sequence([
      { dur: 90, fn: function (t) {                    // 90ms에 최대
          setAct("translateX(" + (dir * 0.9 * t) + "%) rotate(" + (dir * 2 * t) +
                 "deg) scale(" + (1 + 0.04 * t) + "," + (1 - 0.06 * t) + ")");
      } },
      { dur: 320, fn: function (t) {                   // 스프링 복귀
          var damp = (1 - t) * (1 - t);
          var k = Math.cos(t * Math.PI * 2.4) * damp;
          setAct("translateX(" + (dir * 0.9 * k) + "%) rotate(" + (dir * 2 * k) +
                 "deg) scale(" + (1 + 0.04 * k) + "," + (1 - 0.06 * k) + ")");
      } }
    ], function () { setAct(""); });
    // #stage가 --bg-shake 그룹이라 배경 셰이크 + 이 움찔이 합성된다.
    // 셰이크는 #stage, 움찔은 #naeru-act로 겹이 나뉘어 서로 안 덮어쓴다.
  }

  function schedule(kind) {
    var gap = kind === "hop" ? HOP_GAP : LOOK_GAP;
    var ms = DEBUG ? 5000 : rand(gap[0], gap[1]);
    setTimeout(function () {
      if (document.hidden) { schedule(kind); return; }   // 숨은 탭에선 건너뜀
      if (window.naeru.busy) { schedule(kind); return; }  // 공 날아오는 중 등
      // 무엇을 할지는 kind가 정한다. DEBUG는 빈도만 바꾼다 —
      // 여기서 DEBUG로 분기하면 상시 모드에서 look이 영영 안 돈다
      if (kind === "look") look();
      else hop(DEBUG === "flip");
    }, ms);
  }

  if (DEBUG) {
    schedule(DEBUG === "look" ? "look" : "hop");
  } else {
    schedule("hop");
    schedule("look");
  }
})();
</script>

</body>
</html>
