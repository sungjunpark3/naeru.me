<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1f2e">
<meta name="robots" content="noindex, nofollow">
<title>Naerum Naerum</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="내루미">
<meta property="og:url" content="https://naeru.me/">
<meta property="og:image" content="https://naeru.me/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap"
      rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1f2e; /* 영상 로딩 전 어두운 배경 */
    font-family: "Comfortaa", "Avenir Next", "Apple SD Gothic Neo",
                 -apple-system, sans-serif;
  }

  /* 배경은 **정지 이미지**다(2026-09-04 — 바람·구름이 도는 4K 영상은 임시로
     포기). img/bg-<변형>.jpg는 그 변형의 첫 프레임에 내루미를 **구워서 지운**
     것이라, 예전처럼 런타임에 patch를 덧대는 레이어가 아예 없다. 움직이는 건
     DOM 내루미·비·공뿐이다. 영상 복귀는 meadow-*.mp4가 그대로 있으니 가능. */

  /* 루프 순간 브라우저가 비디오를 한 프레임 놓쳐도
     어두운 배경 대신 동일한 정지 프레임이 보이도록,
     첫 프레임(=핑퐁 마지막 프레임)을 영상 뒤에 깔아둠 */
  .bg-still {
    position: fixed;
    inset: 0;
    background-image: var(--still);
    background-size: cover;
    background-position: center;
  }

  /* 공에 맞는 순간 배경 전체를 아주 잠깐 흔든다. 겹들을 같은 값으로
     움직여야 정렬이 유지되고, 살짝 확대해서 흔들린 만큼 가장자리에
     빈 틈이 생기지 않게 한다 (기본값 none이면 아무 영향 없음).
     배경·#stage를 같이 넣어야 흔들릴 때 내루미가 배경에서 떨어져 보이지 않는다 */
  .bg-still, .bg-layer, #stage {
    transform: var(--bg-shake, none);
  }

  /* ── 배경 정지 이미지 A/B. 시간대·날씨가 바뀌면 2.5초 크로스페이드.
     cover/center라 화면비가 뭐든 #stage와 픽셀이 맞는다 ── */
  .bg-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2.5s ease;
  }
  .bg-layer.on { opacity: 1; }
  #bgA { background-image: var(--bg-a); }
  #bgB { background-image: var(--bg-b); }

  /* ── 내루미: #stage가 프레임 사각형(=배경 영상이 cover로 차지하는 상자)이라
     자식은 % 좌표만으로 배치된다. JS 기하 계산 없음.
     z-index를 주지 말 것 — .rain/.vignette와 같은 레벨이라 DOM 순서로
     결정된다(마크업에서 .rain 앞) ── */
  #stage { position: fixed; pointer-events: none; }

  /* transform은 속성이 하나뿐이라 두 코드가 같은 요소에 쓰면 서로 덮어쓴다.
     그래서 역할별로 겹을 나눠 각자 자기 transform만 소유하게 한다:
     #stage=배경 셰이크 / #naeru-move=폴짝·이동 / #naeru-act=움찔·두리번 /
     #naeru-face=방향(뒤집기). CROP box(576×496 @ 1744,1328 / 3840×2160)를
     프레임 비율로 환산한 값 — matte.py의 CROP_ORIGIN/CROP_SIZE와 반드시
     같이 맞출 것(tools/naeru-split/coords.py가 원본) */
  #naeru-move {
    position: absolute;
    left: 45.4167%; top: 61.4815%; width: 15%; height: 22.9630%;
  }
  #naeru-act, #naeru-face { position: absolute; inset: 0; }
  /* 회전·스쿼시의 기준점은 발끝이다. 크롭 상단이 y1328, 발끝이 y1720이므로
     세로 (1720-1328)/496 = 79.03%, 가로는 몸 중심 x2020 →
     (2020-1744)/576 = 47.92%. 틀리면 기울일 때 발이 지면에서 뜬다 */
  #naeru-act, #naeru-face { transform-origin: 47.9167% 79.0323%; }
  .naeru, #naeruStill {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity 2.5s ease;
  }
  .naeru.on, #naeruStill.on { opacity: 1; }

  /* 혀 개그용 두 장. 영상을 세운 그 프레임의 "혀 없는 몸"과 "혀"라서, 둘을
     겹치면 원래 화면과 픽셀이 같다 — 바꿔치는 순간이 안 보인다.
     DOM 순서상 영상·정지본보다 뒤에 있어 위에 그려진다 */
  #naeruNt, #tongue {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; pointer-events: none;
  }
  /* 혀는 입 안으로 빨려 들어가므로 기준점이 입이다.
     크롭 (243, 152) → (243/576, 152/496) */
  #tongue { transform-origin: 42.1875% 30.6452%; will-change: transform; }
  /* 공 IIFE의 headAt()이 겨냥하는, 화면에 안 보이는 기준점. #naeru-face
     안에 있어서 폴짝·움찔·뒤집기 중에도 getBoundingClientRect()로 실제
     렌더 위치를 그대로 읽을 수 있다. 프레임 좌표 (1995,1399) → 크롭
     (1744,1328,576,496) 기준 (43.5764%, 14.3145%) */
  #naeru-head { position: absolute; left: 43.5764%; top: 14.3145%; width: 1px; height: 1px; }
  /* 나비가 앉는 자리 = 두 눈 사이. 나비는 늘 기준 프레임(79)에서 영상을
     세우고 앉으므로, 여러 프레임의 평균이 아니라 **그 프레임의** 눈 중점을
     쓴다 — 실측 크롭 (243.5, 119.5) → 576×496 기준 백분율 */
  #naeru-brow { position: absolute; left: 42.2743%; top: 24.0927%; width: 1px; height: 1px; }

  /* ── 비 레이어: 하늘 프리즈 위에서도 비가 계속 내리도록
     영상이 아닌 DOM에서 렌더. 줄기는 수직 텍스처, 레이어를
     skewX로 기울여 낙하 방향 = 줄기 축. 텍스처 높이(1024px)
     단위로 background-position을 굴리므로 완벽 루프.
     원경(가늘고 느림)/근경(굵고 빠름) 2겹으로 깊이감 ──── */
  .rain {
    position: fixed;
    inset: -14% -8%;
    pointer-events: none;
    transform: skewX(-8deg);
    background-repeat: repeat;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2.5s ease, visibility 2.5s;
    animation: rainfall linear infinite;
    animation-play-state: paused;
  }
  .rain-far  { background-image: url("img/rain-far.png");  animation-duration: 1.8s; }
  .rain-near { background-image: url("img/rain-near.png"); animation-duration: 0.95s; }
  @keyframes rainfall { to { background-position: 0 1024px; } }
  body[data-weather="rain"] .rain {
    visibility: visible;
    animation-play-state: running;
  }
  body[data-weather="rain"] .rain-far  { opacity: 0.5; }
  body[data-weather="rain"] .rain-near { opacity: 0.62; }
  /* 밤에는 줄기가 너무 하얗게 뜨지 않게 */
  body[data-weather="rain"][data-variant^="night"] .rain-far  { opacity: 0.26; }
  body[data-weather="rain"][data-variant^="night"] .rain-near { opacity: 0.34; }

  /* 은은한 비네트 — cozy한 깊이감, 밤에는 조금 더 깊게 */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      ellipse at center,
      transparent 55%,
      rgba(10, 14, 25, 0.42) 100%
    );
    opacity: 0.85;
    transition: opacity 2.5s ease;
  }
  body[data-variant^="night"] .vignette { opacity: 1; }
  body[data-variant="day"]    .vignette { opacity: 0.6; }

  /* ── 시계: 내루미를 가리지 않도록 상단 배치 ─────── */
  .clock-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8vh;
    user-select: none;
  }

  .clock-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .time {
    font-size: clamp(3.5rem, 10vw, 7.5rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: rgba(255, 252, 245, 0.96);
    text-shadow:
      0 2px 24px rgba(20, 25, 40, 0.55),
      0 0 60px rgba(255, 240, 210, 0.25);
    font-variant-numeric: tabular-nums;
  }

  .time .colon { animation: blink 2s ease-in-out infinite; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* 시계 아래 한 줄: 기온 · 하늘 · 다음 일출/일몰.
     날씨 실황은 배경 변형을 고르려고 어차피 받아오는 것이라, 띄우는 데
     추가 요청이 없다. 날짜보다 한 단계 작고 옅게 둬서 시계를 안 흐린다 */
  .info {
    margin-top: 0.15rem;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    font-weight: 400;
    letter-spacing: 0.12em;
    color: rgba(255, 250, 240, 0.62);
    text-shadow: 0 1px 10px rgba(20, 25, 40, 0.6);
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .info.on { opacity: 1; }
  .info .sep { opacity: 0.45; margin: 0 0.5em; }

  .date {
    font-size: clamp(1rem, 2.2vw, 1.5rem);
    font-weight: 400;
    letter-spacing: 0.18em;
    color: rgba(255, 250, 240, 0.85);
    text-shadow: 0 1px 12px rgba(20, 25, 40, 0.6);
  }

  /* ── 프레임 박스: 배경 영상이 cover로 실제 차지하는 사각형.
     이 안에서는 좌표를 프레임 비율로 쓸 수 있어서, 영상에 구워진
     내루미 머리 같은 지점을 화면비와 무관하게 정확히 가리킬 수 있다.
     cover 계산을 개체마다 하지 않고 이 상자 하나에만 하는 게 요점 ── */
  #frame {
    position: fixed;
    pointer-events: none;
    z-index: 1;              /* 비네트 위, 시계 아래 */
  }
  #ball, #bonk {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    will-change: transform, opacity;
  }
  #ball svg { display: block; width: 100%; height: 100%; }
  #bonk {
    border-radius: 50%;
    border: 2px solid rgba(255, 252, 245, 0.85);
  }

  /* 공은 DOM으로 그리므로 배경 그레이딩을 안 받는다. 내루미는 변형별로 8벌을
     따로 구워서 맞지만 공은 한 벌뿐이라, 밤·비에서 혼자 형광처럼 뜬다.
     CLAUDE.md §4의 밴드별 체인을 CSS 필터로 근사한다 — 정확할 필요는 없고
     "혼자 튀지 않을" 정도면 된다. 임팩트 링(#bonk)도 같이 먹는 게 자연스럽다.
     dusk는 원본 무보정이라 필터 없음.
     `$="-rain"`이 night-rain도 잡으므로 night-rain 규칙을 뒤에 둔다(같은 우선순위) */
  /* 변형(시간대·날씨) 보정과 계절 보정을 **곱해서** 건다. 각각 따로
     filter를 쓰면 나중 규칙이 앞을 덮어써서 하나만 남는다 */
  .graded { filter: var(--grade, none) var(--season, none); transition: filter 2.5s ease; }
  body[data-variant="dawn"]       .graded { --grade: brightness(1.04) saturate(.93); }
  body[data-variant="day"]        .graded { --grade: brightness(1.08) saturate(1.06); }
  body[data-variant="night"]      .graded { --grade: brightness(.60)  saturate(.45); }
  body[data-variant$="-rain"]     .graded { --grade: brightness(.97)  saturate(.32); }
  body[data-variant="night-rain"] .graded { --grade: brightness(.50)  saturate(.28); }

  /* ── 계절 ────────────────────────────────────────────────────
     배경은 계절별로 따로 구워서(bg-<변형>-<계절>.jpg) 화질이 좋다.
     내루미·공·나비는 한 벌뿐이라 여기서 델타만 입힌다 — 안 그러면 겨울 배경
     위에 여름 톤 캐릭터가 혼자 떠 있는다. 여름은 원본이라 필터 없음 */
  :root { --season: none; }
  html[data-season="spring"] { --season: saturate(1.05); }
  html[data-season="autumn"] { --season: sepia(.12) saturate(1.06); }
  /* 겨울은 .55까지 빼면 캐릭터가 배경에 묻혀 초점이 사라진다 — 배경보다는
     조금 더 선명하게 남겨 둔다 */
  html[data-season="winter"] { --season: saturate(.68) brightness(1.04); }
  #stage { filter: var(--season, none); transition: filter 2.5s ease; }

  /* 눈·낙엽. 비 레이어와 같은 타일·키프레임을 쓰고, 옆으로 흔들리는 것만
     더했다(비는 곧게 떨어지지만 눈과 낙엽은 흔들린다) */
  .fall {
    position: fixed;
    inset: -14% -8%;
    pointer-events: none;
    background-repeat: repeat;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2.5s ease, visibility 2.5s;
    animation: rainfall linear infinite, sway ease-in-out infinite;
    animation-play-state: paused;
  }
  .fall-far  { background-image: var(--fall-far);  animation-duration: 19s, 13s; }
  .fall-near { background-image: var(--fall-near); animation-duration: 12s, 8s; }
  @keyframes sway {
    0%, 100% { transform: translateX(-1.6%); }
    50%      { transform: translateX(1.6%); }
  }
  /* 비가 올 땐 안 띄운다 — 비와 눈이 같이 내리면 이상하다 */
  html[data-season="winter"] body:not([data-weather="rain"]) .fall,
  html[data-season="autumn"] body:not([data-weather="rain"]) .fall {
    visibility: visible;
    animation-play-state: running;
  }
  html[data-season="winter"] body:not([data-weather="rain"]) .fall-far  { opacity: 0.50; }
  html[data-season="winter"] body:not([data-weather="rain"]) .fall-near { opacity: 0.68; }
  html[data-season="autumn"] body:not([data-weather="rain"]) .fall-far  { opacity: 0.55; }
  html[data-season="autumn"] body:not([data-weather="rain"]) .fall-near { opacity: 0.75; }

  /* 머리 위에 잠깐 뜨는 기호(별·zzz·물음표). #naeru-act의 자식이라 폴짝·움찔을
     따라가고, #naeru-face 밖이라 좌우 뒤집기에는 안 따라간다 — 기호가 거울상이
     되면 안 되기 때문. 크기는 #naeru-move 상자 기준 %라 화면비와 무관하다 */
  #emote {
    position: absolute;
    left: 33%; top: -12%; width: 24%; height: 24%;
    opacity: 0;
    will-change: transform, opacity;
  }
  #emote svg { display: block; width: 100%; height: 100%; overflow: visible; }

  #flit { position: absolute; left: 0; top: 0; opacity: 0;
          will-change: transform, opacity; }

  /* 반딧불이용 두 번째 프레임 상자. #frame과 같은 사각형이지만 **변형별
     그레이딩 필터를 안 받는다**(.graded가 아니다) — 밤 필터가 brightness .60
     이라 그걸 먹으면 빛나야 할 것이 도로 어두워진다 */
  #glow { position: fixed; pointer-events: none; z-index: 1; }
  .ff {
    position: absolute; left: 0; top: 0; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 247, 198, 0.95) 0%, rgba(255, 228, 130, 0.5) 34%,
      rgba(255, 214, 90, 0) 70%);
    opacity: 0;
    will-change: transform, opacity;
  }
  #flit svg { display: block; width: 100%; height: 100%; }
  #flit-wings { transform-box: fill-box; transform-origin: 50% 52%; }

  .clock-wrap { z-index: 2; }

  /* 움직임 최소화 설정 존중: 영상 없이 정지 프레임만 표시
     (JS도 이 경우 영상을 아예 로드하지 않음) */
  @media (prefers-reduced-motion: reduce) {
    .clock-inner, .time .colon { animation: none !important; }
    .rain, .fall { display: none !important; }
    .naeru, #naeruNt, #tongue { display: none !important; }
    #glow { display: none !important; }
    .bg-layer, #naeruStill { transition: none !important; }
    #frame { display: none !important; }
  }
</style>
</head>
<body>

<div class="bg-still"></div>

<div id="bgA" class="bg-layer"></div>
<div id="bgB" class="bg-layer"></div>

<!-- 배경 영상에서 내루미를 지운 자리에 다시 얹는 DOM 내루미.
     배경 위, .rain/.vignette 아래 — 구워져 있던 내루미 위로 비·비네트가
     얹혀 있었으므로 그래야 지금과 톤이 같다 -->
<div id="stage">
  <div id="naeru-move"><div id="naeru-act"><div id="naeru-face">
    <video id="naeruA" class="naeru" muted loop playsinline preload="auto"></video>
    <video id="naeruB" class="naeru" muted loop playsinline preload="none"></video>
    <img id="naeruStill" alt="">
    <img id="naeruNt" alt="">
    <img id="tongue" alt="">
    <div id="naeru-head"></div>
    <div id="naeru-brow"></div>
  </div><div id="emote" class="graded"></div></div></div>
</div>

<div class="rain rain-far"></div>
<div class="rain rain-near"></div>

<!-- 겨울 눈 / 가을 낙엽. 텍스처는 JS가 계절에 따라 --fall-* 로 꽂는다 -->
<div class="fall fall-far"></div>

<!-- 가끔 날아와 내루미 머리를 때리고 사라지는 공.

  <div id="ball">
    <!-- 애플뮤직 앱아이콘 빨강(2026-09-04 지정). 아이콘의 그러데이션은

      <ellipse cx="66" cy="44" rx="24" ry="17" fill="#fdf3dc" opacity=".92"/>
      <ellipse cx="32" cy="62" rx="16" ry="12" fill="#f2dcae" opacity=".9"/>

<script>
/* ── 프레임 사각형 계산: 배경 영상이 cover로 차지하는 16:9 상자.
   #frame(공)과 #stage(내루미) 둘 다 이 식 하나에 맞춘다 — 공 IIFE가 이미
   6개 화면비에서 검증한 수식 그대로, 개체마다 따로 계산하지 않는 게 요점.
   독립 IIFE들이 각자 자기 요소에 대고 부르므로 이 함수 자체는 상태가 없다 ── */
function layoutFrameBox(el) {
  var AR = 16 / 9, vw = innerWidth, vh = innerHeight, W, H;
  if (vw / vh >= AR) { W = vw; H = vw / AR; } else { H = vh; W = vh * AR; }
  el.style.width  = W + "px";
  el.style.height = H + "px";
  el.style.left   = ((vw - W) / 2) + "px";
  el.style.top    = ((vh - H) / 2) + "px";
  return { W: W, H: H };
}
</script>

<script>
(function () {
  var TZ = "Asia/Seoul";

  /* ── 시간대 → 배경 밴드 ──────────────────────────
     서울의 실제 일출·일몰(Open-Meteo daily) 기준:
     dawn = 일출−40분~+50분, dusk = 일몰−50분~+40분,
     그 사이가 day, 나머지가 night. 실황을 아직 못 받았으면
     고정 밴드(05–08/08–17/17–20/20–05)로 폴백.
     서울에 비가 오면 "-rain" 변형(흐린 그레이딩+비 레이어).
     URL 강제: ?v=dawn|day|dusk|night, ?h=22, ?w=rain|clear */
  var sun = null;                    // {sr, ss} 자정 기준 분 단위

  function bandFor(min) {
    if (sun) {
      if (min >= sun.sr - 40 && min < sun.sr + 50) return "dawn";
      if (min >= sun.sr + 50 && min < sun.ss - 50) return "day";
      if (min >= sun.ss - 50 && min < sun.ss + 40) return "dusk";
      return "night";
    }
    var h = Math.floor(min / 60);
    if (h >= 5 && h < 8)   return "dawn";
    if (h >= 8 && h < 17)  return "day";
    if (h >= 17 && h < 20) return "dusk";
    return "night";
  }

  var params  = new URLSearchParams(location.search);
  var forced  = params.get("v");
  var fakeH   = params.get("h");
  var forcedW = params.get("w");
  if (["dawn", "day", "dusk", "night"].indexOf(forced) < 0) forced = null;
  if (["rain", "clear"].indexOf(forcedW) < 0) forcedW = null;

  /* 직전 방문에서 저장한 날씨·일출일몰(3시간 이내)로 즉시
     시작해서 첫 화면부터 정확한 변형을 띄우고, 실황 도착 후
     다르면 크로스페이드로 정정 */
  var WKEY    = "naeru-weather";
  var cachedW = null;
  var temp    = null;    // 기온(°C) — 화면 표시용
  var code    = null;    // WMO 코드 — 화면 표시용
  var srNext  = null;    // 내일 일출(자정 기준 분) — 해 진 뒤 "다음 일출"에 쓴다
  try {
    var c = JSON.parse(localStorage.getItem(WKEY) || "null");
    if (c && Date.now() - c.t < 3 * 3600000 &&
        (c.w === "rain" || c.w === "clear")) {
      cachedW = c.w;
      if (typeof c.sr === "number" && typeof c.ss === "number") {
        sun = { sr: c.sr, ss: c.ss };
      }
      if (typeof c.sr2 === "number") srNext = c.sr2;
      if (typeof c.tp === "number") temp = c.tp;
      if (typeof c.cd === "number") code = c.cd;
    }
  } catch (e) {}
  var weather = forcedW || cachedW || "clear";

  function seoulMinutes(now) {
    if (fakeH !== null) return (parseInt(fakeH, 10) % 24) * 60;
    var t = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(now);
    var p = {};
    t.forEach(function (x) { p[x.type] = x.value; });
    return (parseInt(p.hour, 10) % 24) * 60 + parseInt(p.minute, 10);
  }

  /* ── 계절 (기상학적 4계절: 3~5 봄, 6~8 여름, 9~11 가을, 12~2 겨울) ──
     여름이 원본 톤이라 여름만 접미사가 없다. `?s=` 로 강제 가능 */
  var forcedS = params.get("s");
  if (["spring", "summer", "autumn", "winter"].indexOf(forcedS) < 0) forcedS = null;

  function seasonOf(now) {
    if (forcedS) return forcedS;
    var m = parseInt(new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, month: "numeric"
    }).format(now), 10);
    return (m === 12 || m <= 2) ? "winter"
         : m <= 5 ? "spring"
         : m <= 8 ? "summer" : "autumn";
  }

  var season = seasonOf(new Date());

  function currentVariant() {
    var band = forced || bandFor(seoulMinutes(new Date()));
    return band + (weather === "rain" ? "-rain" : "");
  }

  /* ── 서울 실황 (Open-Meteo, 키 불필요·CORS 허용) ──
     WMO 코드가 강수(이슬비·비·눈·소나기·뇌우)면 rain.
     일출·일몰도 같은 요청으로 받아 밴드 계산에 사용 */
  var METEO = "https://api.open-meteo.com/v1/forecast" +
              "?latitude=37.5665&longitude=126.978" +
              "&current=weather_code,temperature_2m" +
              "&daily=sunrise,sunset&forecast_days=2" +
              "&timezone=Asia%2FSeoul";
  var RAINY = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67,
               71, 73, 75, 77, 80, 81, 82, 85, 86, 95, 96, 99];

  function minutesOf(iso) {     // "2026-07-10T05:17" → 317
    var m = /T(\d\d):(\d\d)/.exec(iso || "");
    return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : null;
  }

  var lastFetch = 0;
  function fetchWeather() {
    if (forcedW) return Promise.resolve();
    return fetch(METEO)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var c = d && d.current && d.current.weather_code;
        weather   = RAINY.indexOf(c) >= 0 ? "rain" : "clear";
        lastFetch = Date.now();
        if (typeof c === "number") code = c;
        if (d && d.current && typeof d.current.temperature_2m === "number") {
          temp = d.current.temperature_2m;
        }
        if (d && d.daily) {
          var sr = minutesOf(d.daily.sunrise && d.daily.sunrise[0]);
          var ss = minutesOf(d.daily.sunset  && d.daily.sunset[0]);
          if (sr !== null && ss !== null) sun = { sr: sr, ss: ss };
          srNext = minutesOf(d.daily.sunrise && d.daily.sunrise[1]);
        }
        try {
          localStorage.setItem(WKEY, JSON.stringify({
            w: weather, t: lastFetch,
            sr: sun && sun.sr, ss: sun && sun.ss,
            sr2: srNext, tp: temp, cd: code
          }));
        } catch (e) {}
        renderInfo();
      })
      .catch(function () {});   // 실패 시 마지막 상태 유지
  }

  /* ── A/B 비디오 + 하늘 프리즈 크로스페이드 ────── */
  var slot    = 0;          // 현재 활성 슬롯 (0=A, 1=B) — 배경·naeru가 같이 씀
  var active  = null;       // 현재 변형 이름
  var root    = document.documentElement;
  var noMotion =
    params.get("still") === "1" ||    // ?still=1 — 브라우저 픽셀 diff용 강제
    matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── 배경 + 내루미 ─────────────────────────────
     배경은 cover 그대로라 좌표 계산이 없다.
     내루미는 #stage(아래 layoutStage) 안에서 % 좌표만 쓴다 ── */
  var bgs         = [document.getElementById("bgA"), document.getElementById("bgB")];
  var naeruVideos = [document.getElementById("naeruA"), document.getElementById("naeruB")];
  var naeruStill  = document.getElementById("naeruStill");
  var stage       = document.getElementById("stage");
  function layoutStage() { layoutFrameBox(stage); }
  addEventListener("resize", layoutStage);
  layoutStage();

  /* 분리 자산(배경·내루미)은 **한 벌로 맞아야** 한다. 서로 다른 배포본이
     섞이면 실루엣을 두르는 테두리가 생긴다. _headers가 /img/*에
     stale-while-revalidate=604800을 주므로 브라우저는 max-age가 지나도 이번
     방문엔 옛 파일을 그대로 쓴다 — 하루에 여러 번 배포하면 세대가 섞인다.
     그래서 URL에 판번호를 붙여 한 벌로 받게 한다.
     **bg-*.jpg / naeru-*.* 를 다시 구우면 이 값을 반드시 올릴 것.**
     (배경 영상 meadow-*는 안 바뀌므로 그대로 둔다) */
  var ASSET_V = "20260905d";
  function av(u) { return u + "?v=" + ASSET_V; }
  document.documentElement.dataset.av = ASSET_V;   // 혀 IIFE가 캐시 판번호를 쓴다

  function bgOf(v) {
    var suffix = season === "summer" ? "" : "-" + season;   // 여름이 원본
    return 'url("' + av("img/bg-" + v + suffix + ".jpg") + '")';
  }
  function naeruStillOf(v) { return av("img/naeru-" + v + ".png"); }
  function naeruSrcOf(v, fmt) { return av("img/naeru-" + v + "." + fmt); }

  /* Safari는 VP9 webm을 재생은 하되 알파를 무시해 검은 사각형으로 그린다.
     canPlayType으로는 구분이 안 되므로, 16×16 완전 투명 프로브를 캔버스에
     그려 실제 알파를 읽는다. 본편을 받기 전에 판정해야 검은 사각형이 안 뜬다.
     noMotion이면 영상 자체를 안 쓰므로 프로브도 건너뛴다 */
  var naeruFormat = null;             // "webm" | "mp4" — 판정 후 확정
  var naeruStillFallback = false;     // mp4마저 실패하면 영구히 정지본으로
  var naeruFormatReady = noMotion ? Promise.resolve("still") : new Promise(function (resolve) {
    var probe = document.createElement("video");
    probe.muted = true; probe.playsInline = true;
    var done = false;
    function finish(fmt) {
      if (done) return;
      done = true;
      naeruFormat = fmt;
      resolve(fmt);
    }
    probe.addEventListener("loadeddata", function () {
      try {
        var c = document.createElement("canvas");
        c.width = c.height = 2;
        var ctx = c.getContext("2d");
        ctx.drawImage(probe, 0, 0, 2, 2);
        finish(ctx.getImageData(0, 0, 1, 1).data[3] === 0 ? "webm" : "mp4");
      } catch (e) { finish("mp4"); }
    });
    probe.addEventListener("error", function () { finish("mp4"); });
    probe.src = av("img/alpha-probe.webm");
    probe.load();
    // 숨은 탭에서는 프로브도 안 받아지므로(크롬 실측) 시간초과로 mp4를 확정하면
    // 안 된다 — 크롬에 HEVC 알파를 물리게 된다. 보일 때까지 판정을 미룬다.
    // 그동안 배경은 --still 바닥이 이미 같은 그림을 칠하고 있어 티가 안 난다
    (function tmo() {
      setTimeout(function () {
        if (document.hidden) { tmo(); return; }
        finish("mp4");
      }, 1200);
    })();
  });

  naeruVideos.forEach(function (v) {
    v.addEventListener("error", function () {
      if (naeruStillFallback || !v.getAttribute("src")) return;
      if (naeruFormat === "webm") {          // webm이 깨졌으면 mp4로
        naeruFormat = "mp4";
        v.src = naeruSrcOf(active, "mp4");
        v.play().catch(function () {});
      } else {                               // mp4마저 실패 → 정지본 후퇴
        naeruStillFallback = true;
        naeruVideos.forEach(function (x) { x.classList.remove("on"); });
        naeruStill.src = naeruStillOf(active);
        naeruStill.classList.add("on");
      }
    });
  });

  /* 배경과 내루미는 **반드시 같은 프레임에** 켠다. 따로 켜지면 둘 중 하나가
     눈에 보인다: 배경만 먼저 = 내루미가 지워진 빈 초원,
     내루미만 먼저 = 구워진 것과 DOM 것이 겹쳐 이중노출. 첫 접속에서 오류처럼
     보이던 게 이것이다. 둘 다 준비된 뒤 함께 켜면, 켜지기 전 화면은 예전
     사이트와 똑같은 (내루미가 구워진) 배경이라 아무 일도 안 일어나 보인다.
     페이드 중에도 안전하다 — 배경이 지운 양과 스프라이트가 그리는 양이
     같은 불투명도로 상쇄돼서 합이 원본과 같다. */
  function whenDecoded(url) {                    // 이미지 1장이 그려질 준비가 될 때까지
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = img.onerror = function () { resolve(); };
      img.src = url;
    });
  }

  function firstFrameReady(v) {                  // 영상의 첫 프레임이 디코드될 때까지
    return new Promise(function (resolve) {
      if (v.readyState >= 2) { resolve(); return; }
      var done = false;
      function go() { if (!done) { done = true; resolve(); } }
      v.addEventListener("loadeddata", go, { once: true });
      v.addEventListener("error", go, { once: true });
      setTimeout(go, 4000);                      // 느린 회선에서 영원히 안 켜지는 것 방지
    });
  }

  /* 영상이 실제로 흐르는지 감시한다. poster가 깔려 있어서 재생이 막혀도
     "정지한 내루미"로 그럴듯하게 보이기 때문에, 안 도는 걸 눈으로는 못 잡는다
     (숨쉬는 모션이 사라졌다는 제보가 이것이었다). 안 흐르면 다시 play(),
     그래도 안 되면 다른 코덱으로, 마지막엔 정지본으로 내린다.

     **숨은 탭에서는 판정하지 않는다.** 우리가 visibilitychange에서 일부러
     멈춰 뒀고, 크롬은 숨은 탭의 영상을 아예 안 받기도 한다(실측: localhost
     webm이 90초 넘게 readyState 0). 그 상태를 "재생 실패"로 읽으면 코덱을
     바꿨다가 정지본으로 내려앉고, 그게 영구 래치라 탭으로 돌아와도 영영 안
     돈다 — "몇 분 움직이다 이후로 정지"의 정체가 이것이다(2026-09-04 제보,
     retried=1 + still=on 상태로 재현).

     진행 판정은 currentTime 비교가 아니라 timeupdate 이벤트로 한다. 이 영상은
     13.17초 핑퐁 루프라 1.8초 창에서 루프를 넘기면 currentTime이 **작아진다**
     — `> t0`로 재면 정상 재생을 정지로 오판한다(t0가 11.4초 이후면 항상). */
  var naeruGaveUp = 0;                           // 복구를 몇 번이나 시도했나

  function watchPlayback(v, variant, fmt) {
    var moved = false;
    function mark() { moved = true; }
    v.addEventListener("timeupdate", mark);
    function stop() { v.removeEventListener("timeupdate", mark); }

    function judge(second) {
      moved = false;
      setTimeout(function () {
        if (!v.isConnected || naeruStillFallback) { stop(); return; }
        if (document.hidden) { judge(second); return; }   // 숨은 동안은 보류
        if (moved) { stop(); return; }                    // 잘 돌고 있다
        if (!second) {                                    // 한 번은 다시 눌러본다
          v.play().catch(function () {});
          judge(true);
          return;
        }
        stop();
        var alt = fmt === "webm" ? "mp4" : "webm";
        if (!v.dataset.retried) {              // 코덱 한 번만 바꿔본다
          v.dataset.retried = "1";
          naeruFormat = alt;
          v.src = naeruSrcOf(variant, alt);
          v.play().catch(function () {});
          watchPlayback(v, variant, alt);
          return;
        }
        naeruStillFallback = true;             // 둘 다 안 돌면 정지본
        naeruVideos.forEach(function (x) { x.classList.remove("on"); });
        naeruStill.src = naeruStillOf(variant);
        naeruStill.classList.add("on");
      }, 1800);
    }
    judge(false);
  }

  /* 정지본으로 내려앉은 걸 되돌린다. 위 판정이 아무리 조심해도 한 번 틀리면
     그 세션 내내 멈춘 채로 남는 게 더 나쁘므로, 탭이 다시 보일 때 한 번씩
     되살려 본다. 진짜로 못 트는 환경(코덱 미지원 등)에서 정지본↔영상이
     깜빡이지 않게 3번까지만. */
  function recoverNaeru() {
    if (noMotion || !naeruStillFallback || naeruGaveUp >= 3) return;
    naeruGaveUp++;
    naeruStillFallback = false;
    naeruVideos.forEach(function (x) { delete x.dataset.retried; });
    // 정지본은 여기서 내리지 않는다 — setNaeru가 영상을 켜는 순간에 내린다.
    // 먼저 지우면 영상이 준비될 때까지(최대 4초) 내루미가 통째로 사라진다
    setNaeru(slot, active);
  }

  function setNaeru(targetSlot, variant) {
    naeruStill.src = naeruStillOf(variant);      // reduced-motion·최종 폴백 둘 다 이걸 씀
    if (noMotion || naeruStillFallback) {
      whenDecoded(naeruStillOf(variant)).then(function () {
        naeruStill.classList.add("on");
        bgs[targetSlot].classList.add("on");
        bgs[1 - targetSlot].classList.remove("on");
      });
      return;
    }
    naeruFormatReady.then(function (fmt) {
      if (naeruStillFallback) return;            // 기다리는 사이 폴백 확정된 경우
      var vNew = naeruVideos[targetSlot], vOld = naeruVideos[1 - targetSlot];
      vNew.poster = naeruStillOf(variant);
      vNew.src = naeruSrcOf(variant, fmt);
      try { vNew.currentTime = 0; } catch (e) {}
      vNew.play().catch(function () {});
      Promise.all([firstFrameReady(vNew),
                   whenDecoded(bgOf(variant).replace(/^url\("|"\)$/g, ""))
      ]).then(function () {
        vNew.classList.add("on");
        naeruStill.classList.remove("on");   // 영상이 뜨는 바로 그 순간에 내린다
        bgs[targetSlot].classList.add("on");  // ← 배경은 여기서만 켠다
        bgs[1 - targetSlot].classList.remove("on");
        vOld.classList.remove("on");
        watchPlayback(vNew, variant, fmt);
      });
      setTimeout(function () {
        vOld.pause();
        vOld.removeAttribute("src");
        vOld.load();
      }, 3000);
    });
  }

  /* 계절을 문서에 반영한다. CSS는 html[data-season]으로 보정 필터와 눈·낙엽
     표시를 고르고, 텍스처 경로는 판번호가 붙어야 해서 JS가 꽂는다 */
  function applySeason() {
    root.dataset.season = season;
    var tex = season === "winter" ? ["snow-far", "snow-near"]
            : season === "autumn" ? ["leaf-far", "leaf-near"] : null;
    root.style.setProperty("--fall-far",  tex ? 'url("' + av("img/" + tex[0] + ".png") + '")' : "none");
    root.style.setProperty("--fall-near", tex ? 'url("' + av("img/" + tex[1] + ".png") + '")' : "none");
  }

  function show(variant) {           // 최초 로드: 즉시 표시
    active = variant;
    document.body.dataset.variant = variant;
    document.body.dataset.weather = weather;
    root.style.setProperty("--still", bgOf(variant));   // 즉시 칠할 바닥
    root.style.setProperty("--bg-a", bgOf(variant));
    setNaeru(slot, variant);           // 배경은 내루미와 같이 켜진다
  }

  function crossfadeTo(variant) {    // 시간대·날씨 변경: 부드럽게 전환
    active = variant;
    document.body.dataset.variant = variant;
    document.body.dataset.weather = weather;
    var newSlot = 1 - slot;
    slot = newSlot;
    root.style.setProperty(newSlot === 0 ? "--bg-a" : "--bg-b", bgOf(variant));
    setNaeru(newSlot, variant);        // 배경·내루미가 같은 프레임에 교체된다
    setTimeout(function () {           // 페이드가 끝나면 바닥도 현재 변형으로
      root.style.setProperty("--still", bgOf(variant));
    }, 2600);
  }

  /* ── 시계 아래 한 줄: 기온 · 하늘 · 다음 일출/일몰 ──────────
     실황은 배경 변형을 고르려고 어차피 받는 것이라 추가 요청이 없다.
     아직 못 받았으면 아무것도 안 띄운다(빈 자리가 뜨는 것보다 낫다). */
  function skyOf(c) {
    if (c === 0) return "맑음";
    if (c === 1) return "대체로 맑음";
    if (c === 2) return "구름 조금";
    if (c === 3) return "흐림";
    if (c === 45 || c === 48) return "안개";
    if (c >= 51 && c <= 57) return "이슬비";
    if (c >= 61 && c <= 67) return "비";
    if (c >= 71 && c <= 77) return "눈";
    if (c >= 80 && c <= 82) return "소나기";
    if (c === 85 || c === 86) return "진눈깨비";
    if (c >= 95) return "뇌우";
    return "";
  }

  function hhmm(min) {
    var h = Math.floor(min / 60) % 24, m = min % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }

  var infoEl = document.getElementById("info");

  function renderInfo() {
    var bits = [];
    if (typeof temp === "number") bits.push(Math.round(temp) + "°");
    var sky = code === null ? "" : skyOf(code);
    if (sky) bits.push(sky);
    if (sun) {
      // 지금 기준 **다음에 올** 해를 띄운다. 해가 진 뒤엔 내일 일출
      var now = seoulMinutes(new Date());
      if (now < sun.sr)      bits.push("일출 " + hhmm(sun.sr));
      else if (now < sun.ss) bits.push("일몰 " + hhmm(sun.ss));
      else if (srNext !== null) bits.push("일출 " + hhmm(srNext));
    }
    if (!bits.length) { infoEl.classList.remove("on"); return; }
    infoEl.innerHTML = bits.join('<span class="sep">·</span>');
    infoEl.classList.add("on");
  }

  /* ── 시계 ──────────────────────────────────────── */
  function render() {
    var now = new Date();

    // 서울 시각 HH:MM
    var t = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(now);
    var parts = {};
    t.forEach(function (p) { parts[p.type] = p.value; });
    var hour = String(parseInt(parts.hour, 10) % 24).padStart(2, "0");

    document.getElementById("time").innerHTML =
      hour + '<span class="colon">:</span>' + parts.minute;

    // Jul 3, 2026 형태
    document.getElementById("date").textContent =
      new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, month: "short", day: "numeric", year: "numeric"
      }).format(now);

    renderInfo();

    // 시간대나 계절이 바뀌었으면 배경 크로스페이드.
    // 계절은 변형 이름에 안 들어가므로 따로 비교해야 한다
    var v = currentVariant();
    var s2 = seasonOf(new Date());
    if (s2 !== season) { season = s2; applySeason(); crossfadeTo(v); }
    else if (v !== active) crossfadeTo(v);
  }

  /* ── 시작: 캐시·강제값이 있으면 대기 없이 즉시 표시,
     캐시 없는 첫 방문만 실황을 최대 900ms 기다림
     (지연·실패 시 일단 맑음으로 시작, 도착하면 전환) ── */
  function sync() {
    var v = currentVariant();
    if (v !== active) crossfadeTo(v);
  }
  var booted = false;
  function boot() {
    if (booted) { sync(); return; }
    booted = true;
    applySeason();
    show(currentVariant());
    render();
    setInterval(function () {        // 날씨 실황 5분 주기 갱신
      if (document.hidden) return;   // 복귀 시 아래 핸들러가 재조회
      fetchWeather().then(sync);
    }, 300000);
  }
  fetchWeather().then(boot);
  if (forcedW || cachedW) boot();
  else setTimeout(boot, 900);

  // 탭이 숨겨지면 영상을 멈춰 배터리 절약, 다시 보이면
  // 영상 재개 + 시계·배경 즉시 갱신 + 날씨 재확인
  // (백그라운드에선 타이머가 제한돼 실황이 밀릴 수 있음)
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      naeruVideos[0].pause();                    // 숨은 탭에서 디코딩 낭비 방지
      naeruVideos[1].pause();
      return;
    }
    if (!booted) return;
    // 내루미 재개가 빠져 있어서, 한 번 멈추면 poster만 남아 "숨쉬는 모션이
    // 사라진" 것처럼 보였다
    if (!noMotion && !naeruStillFallback && naeruVideos[slot].src) {
      naeruVideos[slot].play().catch(function () {});
    }
    recoverNaeru();                              // 숨은 사이 정지본으로 내려앉았으면 복구
    render();
    if (Date.now() - lastFetch > 60000) fetchWeather().then(sync);
  });

  // 다음 분 경계에 맞춰 갱신 (초 표시가 없으므로 분 단위면 충분)
  function tick() {
    render();
    setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
  }
  setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
})();
</script>

<script>
/* ── 공 콩 ────────────────────────────────────────────────────────
   몇 분에 한 번, 화면 밖에서 공이 날아와 내루미 머리를 때리고 튕겨
   나간다. 시계·배경 코드와 독립된 IIFE라 여기서 터져도 본체는 멀쩡.

   왜 DOM인가: 배경은 316프레임 핑퐁 루프라 영상에 구우면 (1) 13초마다
   반복돼서 "가끔"이 안 되고 (2) 후반부가 역재생이라 때린 게 도로 안
   때린 게 된다. 랜덤 타이밍은 구조상 DOM일 수밖에 없다.

   왜 이건 좌표가 안 어긋나는가: 위치 계산을 개체마다 하지 않는다.
   #frame 하나만 cover 사각형으로 맞춰두고 공은 그 안에서 프레임
   비율로 움직이므로, 화면비가 뭐든 머리 위치와 크기가 같이 따라간다.

   맞는 연기는 공 쪽(찌그러짐 + 임팩트 링) + 배경 190ms 흔들림에 더해,
   내루미 쪽도 hit()가 window.naeru.flinch(dir)를 불러 함께 움찔한다.
   그 뒤 공은 옆 풀밭에 떨어져 통통 구르다 멈추고 사라진다(drop)
   (naeru-split/PLAN §4.4 — 내루미가 DOM으로 분리되기 전엔 구워진
   캐릭터라 움찔이 불가능했던 시절의 흔적이 이 함수였다).

   ?ball=0 끄기 / ?ball=1 즉시·반복(빈도 튜닝용) ─────────────────── */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var flag = new URLSearchParams(location.search).get("ball");
  if (flag === "0") return;
  var DEBUG = flag === "1";

  // window.naeru가 없을 때(행동 IIFE가 꺼졌거나 터졌을 때)의 폴백 조준점.
  // 있으면 naeru.headAt()이 폴짝·움찔 중의 실제 위치를 대신 준다
  var HEAD_U = 0.523, HEAD_V = 0.634;
  var BALL_W = 0.024;                   // 프레임 폭 대비 공 지름
  var IN_MS  = 640, HIT_MS = 110, OUT_MS = 820;
  var FIRST  = [7000, 15000];           // 첫 등장까지
  var GAP    = [40000, 120000];         // 그 뒤 간격 — 여기만 만지면 됨

  var frame = document.getElementById("frame");
  var ball  = document.getElementById("ball");
  var bonk  = document.getElementById("bonk");
  var root  = document.documentElement;
  var W = 0, H = 0;                     // 프레임 박스 크기(px)

  function layout() {
    var box = layoutFrameBox(frame);      // #stage와 같은 공용 식(전역 함수)
    W = box.W; H = box.H;
    // 좌우 마진을 반지름만큼 당겨두면 transform 좌표 = 공의 중심
    var d = BALL_W * W;
    ball.style.width = ball.style.height = d + "px";
    ball.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
  }
  addEventListener("resize", layout);
  layout();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function qbez(p0, c, p1, t) {         // 2차 베지어 = 던진 궤적
    var u = 1 - t;
    return [u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0],
            u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]];
  }

  function place(u, v, rot, sx, sy) {
    ball.style.transform =
      "translate(" + (u * W).toFixed(1) + "px," + (v * H).toFixed(1) + "px)" +
      " rotate(" + rot.toFixed(1) + "deg) scale(" + sx.toFixed(3) + "," +
      sy.toFixed(3) + ")";
  }

  function shake() {
    var t0 = performance.now(), MS = 190;
    (function step(now) {
      var t = (now - t0) / MS;
      if (t >= 1) { root.style.setProperty("--bg-shake", "none"); return; }
      var damp = (1 - t) * (1 - t);
      root.style.setProperty("--bg-shake",
        "scale(1.008) translate(" +
        (Math.sin(t * Math.PI * 6) * 3.2 * damp).toFixed(2) + "px," +
        (Math.cos(t * Math.PI * 5) * 2.0 * damp).toFixed(2) + "px)");
      requestAnimationFrame(step);
    })(t0);
  }

  function ring(head) {                 // 임팩트 순간 퍼지는 원
    var d = BALL_W * W * 2.0;
    var at = "translate(" + (head.x * W).toFixed(1) + "px," +
             (head.y * H).toFixed(1) + "px)";
    bonk.style.transition = "none";
    bonk.style.width = bonk.style.height = d + "px";
    bonk.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
    bonk.style.borderWidth = Math.max(1.5, d * 0.045).toFixed(1) + "px";
    bonk.style.transform = at + " scale(.35)";
    bonk.style.opacity = ".85";
    requestAnimationFrame(function () {
      bonk.style.transition =
        "transform .42s cubic-bezier(.2,.7,.3,1), opacity .42s ease-out";
      bonk.style.transform = at + " scale(1.5)";
      bonk.style.opacity = "0";
    });
  }

  /* 맞은 뒤: 튕겨 올랐다가 내루미 옆 풀밭에 떨어져 두어 번 통통 구르고
     멈춘 다음 사라진다. 화면 밖으로 날려버리는 것보다 "맞고 떨어졌다"가
     읽히고, 공이 어디로 갔는지 눈이 따라갈 수 있다.

     떨어지는 자리는 가로 0.40~0.62로 묶는다 — 세로 모바일에서 보이는 구간이
     프레임 가로 37~63%뿐이라 그 밖에 떨어지면 화면 밖에서 사라진다.
     지면(0.835)은 발끝(0.796)보다 아래로 잡아 공이 앞쪽에 놓인 것처럼 보이게 했다 */
  var GROUND_V = 0.835, GRAVITY = 2.6, BOUNCE_E = 0.42;

  function drop(dir, spin, head) {
    var ballR = (BALL_W / 2) * (W / H);        // 공 반지름을 세로 비율로
    var restV = GROUND_V - ballR;
    var u = head.x, v = head.y;
    var vx = dir * 0.14, vy = -0.30;           // 프레임 비율/초
    var rot = spin * 0.25, squash = 0, settled = 0;
    var last = performance.now();

    (function step(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      vy += GRAVITY * dt;
      u += vx * dt;
      v += vy * dt;
      if (v >= restV) {                        // 착지 — 튕기고 감쇠
        v = restV;
        if (vy > 0.07) { vy = -vy * BOUNCE_E; vx *= 0.72; squash = 1; }
        else { vy = 0; vx *= 0.86; settled += dt; }
      }
      u = Math.max(0.40, Math.min(0.62, u));
      rot += vx * dt * 900;                    // 구르는 만큼 돌린다
      squash = Math.max(0, squash - dt * 9);
      place(u, v, rot, 1 + squash * 0.22, 1 - squash * 0.18);

      if (settled < 0.6) { requestAnimationFrame(step); return; }  // 멈춘 걸 보여준 뒤
      // 멈춘 뒤 잠깐 두었다가 페이드아웃
      ball.style.transition = "opacity .8s ease";
      ball.style.opacity = "0";
      setTimeout(function () {
        ball.style.transition = "";
        if (window.naeru) window.naeru.busy = false;
        schedule();
      }, 850);
    })(last);
  }

  function hit(dir, spin, head) {       // 찌그러졌다 돌아오는 한 박자
    ring(head);
    shake();
    if (window.naeru) window.naeru.flinch(dir);   // 맞은 놈이 더 흔들리는 게 맞다
    var t0 = performance.now();
    (function step(now) {
      var t = (now - t0) / HIT_MS;
      if (t >= 1) { drop(dir, spin, head); return; }
      var k = Math.sin(t * Math.PI);
      place(head.x, head.y, spin, 1 + .30 * k, 1 - .28 * k);
      requestAnimationFrame(step);
    })(t0);
  }

  function toss() {
    var dir = Math.random() < 0.5 ? 1 : -1;        // 1 = 왼쪽에서 날아옴
    // 목표점은 이 던지기 하나에 고정 — 도중에 폴짝이 끼어들어도 흔들리지
    // 않게. window.naeru 없으면(행동 IIFE 꺼짐/에러) 상수로 폴백
    var head = window.naeru ? window.naeru.headAt() : { x: HEAD_U, y: HEAD_V };
    if (window.naeru) window.naeru.busy = true;    // 날아오는 동안 새 행동 금지
    // 프레임은 항상 뷰포트보다 넓으므로, 프레임 밖 = 화면 밖이 보장된다
    var p0 = [dir > 0 ? -0.14 : 1.14, rand(0.20, 0.32)];
    var p1 = [head.x, head.y];
    // 조절점을 출발 높이에 두고 가로로 절반쯤 밀면 포물선 낙하가 된다
    var c  = [p0[0] + (p1[0] - p0[0]) * 0.55, p0[1] - 0.04];
    var spin = rand(140, 300) * dir;
    var t0 = performance.now();
    ball.style.opacity = "1";
    (function step(now) {
      var t = (now - t0) / IN_MS;
      if (t >= 1) { hit(dir, spin, head); return; }
      var e = t * t * .35 + t * .65;               // 끝에서 살짝 가속
      var p = qbez(p0, c, p1, e);
      place(p[0], p[1], spin * e, 1, 1);
      requestAnimationFrame(step);
    })(t0);
  }

  function schedule(first) {
    var ms = DEBUG ? (first ? 1000 : 5000)
                   : rand.apply(null, first ? FIRST : GAP);
    setTimeout(function () {
      if (document.hidden) { schedule(); return; }  // 숨은 탭에선 건너뜀
      // 폴짝·두리번 중이면 미룬다. 조준점은 던지는 순간 한 번만 읽으므로
      // 그때 내루미가 공중이면 640ms 뒤엔 이미 내려와 있어 빗나간다.
      // 나비가 와 있을 때도 미룬다 — 둘이 겹치면 어디를 봐야 할지 모른다
      if (window.naeru && (window.naeru.busy || window.naeru.hold)) { schedule(); return; }
      toss();
    }, ms);
  }
  schedule(true);
})();
</script>

<script>
/* ── 내루미 행동: 제자리 반응 — 폴짝 · 두리번 · 좌우 뒤집기.
   (움찔은 공 IIFE의 hit()가 window.naeru.flinch()로 직접 부른다.)
   공 IIFE와 같은 패턴의 독립 IIFE — 여기가 터져도 시계·배경·공은 살아야
   한다. window.naeru를 공개해서 공 IIFE와 최소한의 계약만 주고받는다.

   진폭 상한은 구워진 접지 그림자가 정한다(그림자가 몸을 안 따라오므로):
   수직(폴짝)은 자기 키의 15% — 자유. 수평(움찔·두리번)은 ±20px@4K(폭의
   6%)까지만. 회전은 2.5deg까지만 — 넘으면 발이 미끄러진 것처럼 보인다.

   transform은 요소 하나에 하나씩: #naeru-move=폴짝(translateY) /
   #naeru-act=움찔·두리번(rotate·translateX·scale) / #naeru-face=방향
   (scaleX). 겹을 안 지키면 서로 덮어쓴다.

   ?act=0 전체 끄기 / ?act=hop|look|flip 해당 동작만 5초 간격 반복 ───── */
(function () {
  var params = new URLSearchParams(location.search);
  // ?still=1(정지 프레임 강제)일 땐 동작도 멈춰야 스크린샷이 결정적이 된다 —
  // 브라우저 픽셀 diff가 이걸 쓴다
  if (params.get("still") === "1") return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var actFlag = params.get("act");
  if (actFlag === "0") return;
  var IDLE_KINDS = ["doze", "stretch", "shiver", "idle"];
  var DEBUG = ["hop", "look", "flip"].concat(IDLE_KINDS).indexOf(actFlag) >= 0
              ? actFlag : null;

  var move = document.getElementById("naeru-move");
  var act  = document.getElementById("naeru-act");
  var face = document.getElementById("naeru-face");
  var head = document.getElementById("naeru-head");
  var brow = document.getElementById("naeru-brow");
  var stage = document.getElementById("stage");
  if (!move || !act || !face || !head || !brow || !stage) return;

  var facing = 1;              // 1 = 원래 방향, -1 = 좌우 뒤집힘
  var HOP_GAP  = [8000, 30000];
  var LOOK_GAP = [13000, 40000];
  var IDLE_GAP = [30000, 80000];   // 졸기·기지개·부르르가 도는 간격

  window.naeru = {
    busy:   false,      // 공이 날아오는 동안(또는 자체 행동 중) 새 행동 금지
    /* 나비가 오는 동안 통째로 잡아 둔다. busy와 따로 둔 이유: 나비가 busy를
       직접 잡으면 앉는 순간의 peek()이 자기 자신 때문에 건너뛰어진다.
       hold는 "새 동작을 시작하지 마라"만 뜻하고, peek는 busy만 본다. */
    hold:   false,
    flinch: flinch,
    peek:   peek,       // 나비 IIFE가 "머리에 앉았다"고 알릴 때 쓴다
    headAt: headAt,     // 머리 꼭대기 — 공의 조준점
    browAt: browAt      // 두 눈 사이 — 나비가 앉는 자리
  };

  function rand(a, b) { return a + Math.random() * (b - a); }

  function anchorAt(el, fx, fy) {        // 기준점의 현재 화면 좌표(프레임 비율)
    var r = el.getBoundingClientRect();
    var s = stage.getBoundingClientRect();
    // #stage가 아직 크기를 못 받은 순간의 폴백. 프레임 비율이어야 한다 —
    // 크롭 기준 비율(0.436, 0.143)을 넣으면 공이 엉뚱한 데로 날아간다
    if (!s.width || !s.height) return { x: fx, y: fy };
    return { x: (r.left - s.left) / s.width, y: (r.top - s.top) / s.height };
  }
  function headAt() { return anchorAt(head, 1995 / 3840, 1399 / 2160); }
  function browAt() { return anchorAt(brow, 2000 / 3840, 1445 / 2160); }

  function setMove(t) { move.style.transform = t; }
  function setAct(t)  { act.style.transform  = t; }

  // 공용 타이밍 헬퍼: dur(ms)짜리 구간을 진행률 0→1로 fn에 넘겨 반복 호출.
  // sequence()가 여러 구간을 이어붙여 폴짝·두리번의 여러 박자를 만든다
  function tick(dur, fn, done) {
    var t0 = performance.now();
    (function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      fn(t);
      if (t < 1) requestAnimationFrame(step);
      else if (done) done();
    })(t0);
  }
  function sequence(steps, onDone) {
    var i = 0;
    function next() {
      if (i >= steps.length) { if (onDone) onDone(); return; }
      var s = steps[i++];
      tick(s.dur, s.fn, next);
    }
    next();
  }

  function hop(forceFlip) {
    window.naeru.busy = true;
    var doDouble = Math.random() < 0.2;             // 가끔(20%) 2연속
    // 방향 전환은 공중에서만 한다(§4.5) — 구워진 그림자는 안 뒤집히므로 땅에
    // 붙은 채로 홱 뒤집히면 티가 난다. 뒤집힌 상태면 되돌릴 확률을 높게 둬서
    // 오래 거울상으로 남지 않게 한다(그래도 전환은 늘 공중에서 일어난다)
    var willFlip = forceFlip || Math.random() < (facing < 0 ? 0.7 : 0.2);
    var didFlip  = false;

    sequence([
      { dur: 110, fn: function (t) {                 // 웅크림
          setAct("scale(" + (1 + 0.06 * t) + "," + (1 - 0.08 * t) + ")");
      } },
      { dur: 260, fn: function (t) {                 // 상승 ease-out
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-13 * e) + "%)");
          setAct("scale(" + (1.06 - 0.09 * t) + "," + (0.92 + 0.13 * t) + ")");
          if (willFlip && !didFlip && t > 0.4) {   // 정점 부근에서 전환
            didFlip = true;
            facing = -facing;
            face.style.transform = facing < 0 ? "scaleX(-1)" : "";
          }
      } },
      { dur: 220, fn: function (t) {                 // 하강 ease-in — 착지 직전 스케일은 중립
          var e = t * t;
          setMove("translateY(" + (-13 * (1 - e)) + "%)");
          setAct("scale(" + (0.97 + 0.03 * e) + "," + (1.05 - 0.05 * e) + ")");
      } },
      // 착지에 아주 짧은 가로 미끄러짐을 얹는다 — 무게가 실렸다가 버티는 한 박자.
      // 0.5%=2.9px@4K로 §4.1 수평 상한(20px) 한참 아래다
      { dur: 90, fn: function (t) {                  // 착지
          setAct("translateX(" + (facing * 0.5 * t).toFixed(2) + "%) scale(" +
                 (1 + 0.05 * t) + "," + (1 - 0.06 * t) + ")");
      } },
      { dur: 120, fn: function (t) {                 // 착지 복귀
          setAct("translateX(" + (facing * 0.5 * (1 - t)).toFixed(2) + "%) scale(" +
                 (1.05 - 0.05 * t) + "," + (0.94 + 0.06 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct("");   // 방향(facing)은 유지 — 되돌리기도 다음 폴짝의 공중에서
      if (doDouble) setTimeout(hopAgain, 60);
      else { window.naeru.busy = false; schedule("hop"); }
    });
  }

  function hopAgain() {                               // 70% 높이로 한 번 더
    sequence([
      { dur: 90, fn: function (t) {
          setAct("scale(" + (1 + 0.05 * t) + "," + (1 - 0.07 * t) + ")");
      } },
      { dur: 200, fn: function (t) {
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-9.1 * e) + "%)");
          setAct("scale(" + (1.05 - 0.08 * t) + "," + (0.93 + 0.12 * t) + ")");
      } },
      { dur: 170, fn: function (t) {
          var e = t * t;
          setMove("translateY(" + (-9.1 * (1 - e)) + "%)");
          setAct("translateX(" + (facing * 0.4 * (1 - t)).toFixed(2) + "%) scale(" +
                 (0.97 + 0.03 * t) + "," + (1.05 - 0.05 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct("");
      window.naeru.busy = false;
      schedule("hop");
    });
  }

  /* 좌우로 뒤뚱뒤뚱. 한 번 갸웃하고 마는 게 아니라 6~8초 동안 계속 흔든다.
     사인파 한 줄로 만들고, 앞뒤 0.9초는 진폭을 0에서 키웠다 0으로 줄여서
     시작·끝이 툭 튀지 않게 한다(들어올 때 이미 기울어 있으면 순간이동처럼 보임).
     진폭은 §4.1 상한 안: 회전 2.2deg(<2.5), 가로 1.2%=7px@4K(<20px).
     기울 때 살짝 눌러주면 무게가 실려 뒤뚱거리는 느낌이 난다 */
  function look() {
    window.naeru.busy = true;
    var dir = Math.random() < 0.5 ? 1 : -1;
    var dur = rand(6000, 8000);
    var period = rand(1500, 1900);                    // 한 번 왕복하는 데 걸리는 시간
    tick(dur, function (t) {
      var ms = t * dur;
      var env = Math.min(1, ms / 900, (dur - ms) / 900);   // 시작·끝 진폭 봉투
      var k = Math.sin(ms / period * Math.PI * 2) * env * dir;
      setAct("rotate(" + (k * 2.2).toFixed(2) + "deg) translateX(" +
             (k * 1.2).toFixed(2) + "%) scale(" +
             (1 + Math.abs(k) * 0.012).toFixed(4) + "," +
             (1 - Math.abs(k) * 0.016).toFixed(4) + ")");
    }, function () {
      setAct("");
      window.naeru.busy = false;
      schedule("look");
    });
  }

  function flinch(dir) {                               // 공에 맞을 때 — 공 IIFE가 호출
    dir = dir || (Math.random() < 0.5 ? 1 : -1);
    sequence([
      { dur: 90, fn: function (t) {                    // 90ms에 최대
          setAct("translateX(" + (dir * 0.9 * t) + "%) rotate(" + (dir * 2 * t) +
                 "deg) scale(" + (1 + 0.04 * t) + "," + (1 - 0.06 * t) + ")");
      } },
      { dur: 320, fn: function (t) {                   // 스프링 복귀
          var damp = (1 - t) * (1 - t);
          var k = Math.cos(t * Math.PI * 2.4) * damp;
          setAct("translateX(" + (dir * 0.9 * k) + "%) rotate(" + (dir * 2 * k) +
                 "deg) scale(" + (1 + 0.04 * k) + "," + (1 - 0.06 * k) + ")");
      } }
    ], function () { setAct(""); });
    // #stage가 --bg-shake 그룹이라 배경 셰이크 + 이 움찔이 합성된다.
    // 셰이크는 #stage, 움찔은 #naeru-act로 겹이 나뉘어 서로 안 덮어쓴다.
  }

  /* ── 머리 위 기호 ──────────────────────────────────────────────
     밝은 노을 하늘부터 밤까지 다 얹히므로, 획을 두 번 그린다: 굵은 어두운
     획을 깔고 그 위에 크림색 — 어느 배경에서도 읽힌다(공 테두리와 같은 이유) */
  var emote = document.getElementById("emote");
  var emoteBusy = false;
  var DARK = 'stroke="rgba(58,42,30,.5)" stroke-width="8.5" fill="none" ' +
             'stroke-linecap="round" stroke-linejoin="round"';
  var LITE = 'stroke="#fdf6e4" stroke-width="3.6" fill="none" ' +
             'stroke-linecap="round" stroke-linejoin="round"';
  var ZS   = '<path d="M5 31h9l-9 8h9"/><path d="M17 18h11l-11 10h11"/>' +
             '<path d="M31 5h9l-9 8h9"/>';
  var QS   = '<path d="M13 14a7 7 0 1 1 7.2 7v3.6"/>';
  var EMOTE = {
    zzz:  '<svg viewBox="0 0 45 45"><g ' + DARK + '>' + ZS + '</g><g ' + LITE + '>' +
          ZS + '</g></svg>',
    what: '<svg viewBox="0 0 45 45"><g ' + DARK + '>' + QS +
          '</g><circle cx="20.2" cy="31.5" r="4.6" fill="rgba(58,42,30,.5)"/><g ' +
          LITE + '>' + QS + '</g>' +
          '<circle cx="20.2" cy="31.5" r="2.3" fill="#fdf6e4"/></svg>'
  };

  function showEmote(kind, hold) {
    if (emoteBusy) return;
    emoteBusy = true;
    emote.innerHTML = EMOTE[kind];
    sequence([
      { dur: 240, fn: function (t) {                 // 통 튀어 오른다
          var e = 1 - Math.pow(1 - t, 3);
          emote.style.opacity = Math.min(1, t * 2.4).toFixed(3);
          emote.style.transform = "translateY(" + (-9 * e).toFixed(1) + "%) scale(" +
                                  (0.45 + 0.65 * e).toFixed(3) + ")";
      } },
      { dur: hold || 900, fn: function (t) {         // 천천히 떠 있는다
          emote.style.transform = "translateY(" + (-9 - 5 * t).toFixed(1) + "%) scale(1.1)";
      } },
      { dur: 420, fn: function (t) {
          emote.style.opacity = (1 - t).toFixed(3);
          emote.style.transform = "translateY(" + (-14 - 7 * t).toFixed(1) + "%) scale(" +
                                  (1.1 - 0.12 * t).toFixed(3) + ")";
      } }
    ], function () { emote.style.opacity = "0"; emote.innerHTML = ""; emoteBusy = false; });
  }

  /* ── 꾸벅꾸벅 졸기 ─────────────────────────────────────────────
     **내려앉는 걸 translateY로 하면 안 된다** — 구워진 접지 그림자는 안
     따라오므로 발이 땅에 박힌 것처럼 보인다. scaleY 압축이면 origin이
     발끝이라 접지가 그대로 유지된다(§4.1). 기울기는 1.6deg로 상한(2.5) 안 */
  function doze() {
    window.naeru.busy = true;
    var night = (document.body.dataset.variant || "").indexOf("night") === 0;
    var dir = facing > 0 ? -1 : 1;                   // 얼굴 쪽으로 고개가 떨어진다
    var nods = 2 + (Math.random() < 0.5 ? 1 : 0);
    var sink = 1000;
    if (night) showEmote("zzz", nods * (sink + 200));

    function pose(k) {                               // k: 0=깨어있음 1=푹 숙임
      setAct("rotate(" + (dir * 1.6 * k).toFixed(2) + "deg) scale(" +
             (1 + 0.012 * k).toFixed(4) + "," + (1 - 0.045 * k).toFixed(4) + ")");
    }
    var steps = [];
    for (var i = 0; i < nods; i++) {
      steps.push({ dur: sink, fn: function (t) { pose(t * t); } });        // 스르르
      steps.push({ dur: 190,  fn: function (t) { pose(1 - t); } });        // 화들짝
    }
    sequence(steps, function () {
      setAct(""); window.naeru.busy = false; schedule("idle");
    });
  }

  /* 기지개 — 웅크렸다 위로 쭉. 발끝 origin이라 세로로 늘려도 접지는 그대로 */
  function stretch() {
    window.naeru.busy = true;
    sequence([
      { dur: 240, fn: function (t) {
          setAct("scale(" + (1 + 0.03 * t) + "," + (1 - 0.04 * t) + ")");
      } },
      { dur: 640, fn: function (t) {
          var e = 1 - Math.pow(1 - t, 2);
          setAct("scale(" + (1.03 - 0.06 * e) + "," + (0.96 + 0.10 * e) + ")");
      } },
      { dur: 540, fn: function (t) {
          var e = t * t;
          setAct("scale(" + (0.97 + 0.03 * e) + "," + (1.06 - 0.06 * e) + ")");
      } }
    ], function () { setAct(""); window.naeru.busy = false; schedule("idle"); });
  }

  /* 비 올 때 부르르. 빠르게(13Hz) 아주 작게(0.45%=2.6px@4K) — 진폭을 키우면
     떠는 게 아니라 미끄러지는 것처럼 보인다 */
  function shiver() {
    window.naeru.busy = true;
    var dur = rand(800, 1200), dir = Math.random() < 0.5 ? 1 : -1;
    tick(dur, function (t) {
      var env = Math.sin(Math.PI * t);               // 시작·끝 진폭 봉투
      var k = Math.sin(t * dur / 1000 * Math.PI * 2 * 13) * env * dir;
      setAct("translateX(" + (k * 0.45).toFixed(3) + "%) rotate(" +
             (k * 0.5).toFixed(2) + "deg) scale(" +
             (1 + Math.abs(k) * 0.006).toFixed(4) + "," +
             (1 - Math.abs(k) * 0.008).toFixed(4) + ")");
    }, function () { setAct(""); window.naeru.busy = false; schedule("idle"); });
  }

  /* 클릭·터치하면 화들짝 놀라 통 뛴다. 지금까지 내루미는 사용자를 전혀
     모르는 존재였다 — 반응 하나로 "살아있다"가 크게 붙는다. */
  function poke(dir) {
    if (window.naeru.busy || window.naeru.hold) return;
    window.naeru.busy = true;
    var d = dir || 1;
    sequence([
      { dur: 80, fn: function (t) {                  // 움찔 웅크림
          setAct("translateX(" + (d * 0.5 * t).toFixed(2) + "%) scale(" +
                 (1 + 0.08 * t) + "," + (1 - 0.10 * t) + ")");
      } },
      { dur: 240, fn: function (t) {                 // 통 튀어오름
          var e = 1 - Math.pow(1 - t, 2);
          setMove("translateY(" + (-10 * e) + "%)");
          setAct("translateX(" + (d * 0.5 * (1 - t)).toFixed(2) + "%) scale(" +
                 (1.08 - 0.11 * t) + "," + (0.90 + 0.15 * t) + ")");
      } },
      { dur: 200, fn: function (t) {                 // 하강
          var e = t * t;
          setMove("translateY(" + (-10 * (1 - e)) + "%)");
          setAct("scale(" + (0.97 + 0.03 * e) + "," + (1.05 - 0.05 * e) + ")");
      } },
      { dur: 110, fn: function (t) {
          setAct("scale(" + (1 + 0.06 * t) + "," + (1 - 0.07 * t) + ")");
      } },
      { dur: 150, fn: function (t) {
          setAct("scale(" + (1.06 - 0.06 * t) + "," + (0.93 + 0.07 * t) + ")");
      } }
    ], function () {
      setMove(""); setAct(""); window.naeru.busy = false;
    });
  }

  /* #stage가 pointer-events:none이라 히트 영역을 따로 두지 않고, 눌린 점이
     #naeru-move 상자에서 캐릭터가 실제로 차지하는 비율 안인지 본다.
     pointerdown이라 마우스와 터치가 한 경로로 처리된다(모바일 중복 없음). */
  var HIT = { x0: 0.20, x1: 0.80, y0: 0.13, y1: 0.79 };
  var lastPoke = 0;
  addEventListener("pointerdown", function (e) {
    var r = move.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
    if (u < HIT.x0 || u > HIT.x1 || v < HIT.y0 || v > HIT.y1) return;
    if (performance.now() - lastPoke < 500) return;      // 연타 방지
    lastPoke = performance.now();
    poke(u < 0.5 ? -1 : 1);                              // 눌린 쪽 반대로 움찔
  }, { passive: true });

  /* 나비가 앉았을 때의 짧은 갸웃. 공 IIFE의 flinch와 달리 busy를 존중한다 —
     폴짝 중에 끼어들면 #naeru-act를 서로 덮어쓴다.

     물음표는 **여기서만** 띄운다. 두리번에 확률로 붙여 놨더니 아무 일도 없는데
     혼자 "?"가 떠서 뜬금없었다(2026-09-05 제보). peek()은 나비 IIFE만 부르므로
     이 자리에 두면 나비와 물음표가 구조적으로 한 쌍이 된다 — busy라 갸웃을
     건너뛰면 물음표도 같이 안 뜬다. */
  function peek(dir) {
    // 기호가 먼저다 — busy면 갸웃(#naeru-act)만 건너뛰고 물음표는 그대로 뜬다.
    // 반대로 두면 폴짝 중에 나비가 앉을 때 물음표까지 사라져서 "나비는 왔는데
    // 아무 반응이 없는" 그림이 된다
    showEmote("what", 900);
    if (window.naeru.busy) return;
    window.naeru.busy = true;
    dir = dir || 1;
    function pose(k) {
      setAct("rotate(" + (dir * 1.8 * k).toFixed(2) + "deg) translateX(" +
             (dir * 0.6 * k).toFixed(2) + "%)");
    }
    sequence([
      { dur: 300,  fn: function (t) { pose(1 - Math.pow(1 - t, 2)); } },
      { dur: 1000, fn: function ()  { pose(1); } },
      { dur: 460,  fn: function (t) { pose(1 - t * t); } }
    ], function () { setAct(""); window.naeru.busy = false; });
  }

  /* 무엇을 할지 고른다. 밤엔 졸기, 비엔 부르르가 많아지게 — 이미 있는
     시간대·날씨 상태에 붙여야 "반응하고 있다"로 읽힌다 */
  function idle() {
    if (DEBUG === "doze")    { doze();    return; }
    if (DEBUG === "stretch") { stretch(); return; }
    if (DEBUG === "shiver")  { shiver();  return; }
    var night = (document.body.dataset.variant || "").indexOf("night") === 0;
    var rain  = document.body.dataset.weather === "rain";
    var r = Math.random();
    if (rain && r < 0.45) { shiver(); return; }
    if (r < (night ? 0.75 : 0.30)) { doze(); return; }
    stretch();
  }

  function schedule(kind) {
    var gap = kind === "hop" ? HOP_GAP : kind === "look" ? LOOK_GAP : IDLE_GAP;
    var ms = DEBUG ? 5000 : rand(gap[0], gap[1]);
    setTimeout(function () {
      if (document.hidden) { schedule(kind); return; }   // 숨은 탭에선 건너뜀
      // 공이 날아오는 중, 자체 동작 중, 나비가 와 있는 중이면 미룬다
      if (window.naeru.busy || window.naeru.hold) { schedule(kind); return; }
      // 무엇을 할지는 kind가 정한다. DEBUG는 빈도만 바꾼다 —
      // 여기서 DEBUG로 분기하면 상시 모드에서 look이 영영 안 돈다
      if (kind === "look") look();
      else if (kind === "idle") idle();
      else hop(DEBUG === "flip");
    }, ms);
  }

  if (DEBUG) {
    schedule(DEBUG === "look" ? "look"
             : IDLE_KINDS.indexOf(DEBUG) >= 0 ? "idle" : "hop");
  } else {
    schedule("hop");
    schedule("look");
    schedule("idle");
  }
})();
</script>

<script>
/* ── 나비 ──────────────────────────────────────────────────────────
   가끔 한 마리가 날아와 내루미 머리에 잠깐 앉았다 간다.

   공과 같은 이유로 #frame 안에 있다 — 랜덤 타이밍이라 영상에 못 굽고,
   프레임 비율 좌표라야 화면비가 뭐든 머리에 맞는다. #frame이 변형별
   그레이딩 필터를 갖고 있어서 밤·비에서 혼자 뜨는 것도 자동으로 해결된다.

   앉아 있는 동안은 window.naeru.headAt()을 매 프레임 따라간다 — 그래야
   앉은 채로 폴짝 뛰어도 머리에 붙어 있다. busy는 잡지 않는다(나비를 얹은
   채 뛰는 게 더 재미있다). 앉는 순간에만 peek()으로 갸웃하게 하고, 그건
   busy를 존중하므로 폴짝 중이면 그냥 건너뛴다.

   ?flit=0 끄기 / ?flit=1 자주 ─────────────────────────────────── */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var flag = new URLSearchParams(location.search).get("flit");
  if (flag === "0") return;
  var DEBUG = flag === "1";

  var FIRST = [20000, 50000];
  var GAP   = [70000, 180000];
  var RETRY = [7000, 14000];
  /* 앉을 때 영상을 세운다 — **이게 핵심이다.** 나비는 #naeru-brow(고정 %)를
     따라가는데 영상 속 얼굴은 계속 움직이므로, 영상을 그대로 두면 코에
     붙어 있질 못한다. 세우는 프레임은 혀 개그와 같은 기준 프레임 79이고,
     그 프레임의 눈 위치에 맞춰 #naeru-brow를 잡아 뒀다. 핑퐁이라 한 바퀴에
     두 번(3.29초, 9.875초) 지나가므로, 비행 시간(IN_MS)만큼 앞에서 출발하면
     도착이 곧 그 프레임이 된다. */
  var REF_FRAME = 79, FPS = 24, N_FRAMES = 316;
  var LOOP  = N_FRAMES / FPS;
  var MARKS = [REF_FRAME / FPS, (N_FRAMES - REF_FRAME) / FPS];
  var WINDOW = 1.5 / FPS;
  // 두 눈 사이(크롭 좌표로 62px)에 앉으므로 그보다 좁아야 눈을 안 덮는다.
  // 0.023이면 크롭 환산 87px이라 양쪽 눈을 가렸다(실측)
  var SIZE  = 0.016;                    // 프레임 폭 대비 날개폭
  var IN_MS = 2600, OUT_MS = 2200;

  var frame = document.getElementById("frame");
  var flit  = document.getElementById("flit");
  var wings = document.getElementById("flit-wings");
  var W = 0, H = 0;
  var vid = null;                       // 이번 방문 동안 세워 둘 영상

  function activeVideo() {
    var vs = [document.getElementById("naeruA"), document.getElementById("naeruB")];
    for (var i = 0; i < vs.length; i++) {
      if (vs[i] && vs[i].classList.contains("on") && vs[i].getAttribute("src") && !vs[i].paused) {
        return vs[i];
      }
    }
    return null;
  }

  function layout() {
    var box = layoutFrameBox(frame);
    W = box.W; H = box.H;
    var d = SIZE * W;
    flit.style.width = flit.style.height = d + "px";
    flit.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
  }
  addEventListener("resize", layout);
  layout();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function place(u, v, rot) {
    flit.style.transform = "translate(" + (u * W).toFixed(1) + "px," +
      (v * H).toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg)";
  }
  function flap(hz, now) {              // 날개는 접힘(0.15)~펼침(1) 사이를 오간다
    var k = (Math.sin(now / 1000 * Math.PI * 2 * hz) + 1) / 2;
    wings.style.transform = "scaleX(" + (0.15 + 0.85 * k).toFixed(3) + ")";
  }

  function perch() {                    // 앉는 자리 = 두 눈 사이
    return window.naeru ? window.naeru.browAt() : { x: 0.521, y: 0.669 };
  }

  function leave(dir) {
    if (vid) { vid.play().catch(function () {}); vid = null; }   // 다시 움직인다
    var from = perch(), t0 = performance.now();
    var to = [dir > 0 ? 1.15 : -0.15, rand(0.12, 0.26)];
    (function step(now) {
      var t = (now - t0) / OUT_MS;
      if (t >= 1) { flit.style.opacity = "0"; hold(false); schedule(); return; }
      flap(9, now);
      var e = t * t * 0.7 + t * 0.3;
      var u = from.x + (to[0] - from.x) * e;
      var v = from.y + (to[1] - from.y) * e + Math.sin(t * Math.PI * 3.5) * 0.022;
      place(u, v, Math.sin(t * Math.PI * 3.5) * 12);
      flit.style.opacity = (1 - Math.max(0, (t - 0.75) * 4)).toFixed(3);
      requestAnimationFrame(step);
    })(t0);
  }

  function sit(dir) {
    // 코에 닿는 순간 영상을 세운다. 기준 프레임에 맞춰 도착했더라도 rAF와
    // 영상 시계가 몇 ms 어긋날 수 있으므로 그 프레임으로 스냅한다 —
    // 한두 프레임 차이는 눈에 안 보이지만 눈 위치는 정확해진다
    if (vid) {
      var m = MARKS[0];
      for (var i = 1; i < MARKS.length; i++) {
        if (Math.abs(vid.currentTime - MARKS[i]) < Math.abs(vid.currentTime - m)) m = MARKS[i];
      }
      vid.pause();
      try { vid.currentTime = m + 0.01; } catch (e) {}
    }
    var t0 = performance.now(), DUR = rand(3500, 6500);
    if (window.naeru) window.naeru.peek(-dir);   // 앉은 쪽으로 갸웃
    (function step(now) {
      var t = now - t0;
      if (t >= DUR) { leave(-dir); return; }
      // 앉아 있을 땐 날개를 편 채로 두고 2.5초마다 한 번 짧게 접는다.
      // 반반으로 여닫게 하면 절반의 시간 동안 얇은 조각으로만 보인다
      var ph = (t / 2500) % 1;
      var fold = ph < 0.12 ? Math.sin(ph / 0.12 * Math.PI) : 0;
      wings.style.transform = "scaleX(" + (1 - 0.72 * fold).toFixed(3) + ")";
      var p = perch();
      place(p.x, p.y, 0);
      requestAnimationFrame(step);
    })(t0);
  }

  var holdTimer = null;
  function hold(on) {
    if (!window.naeru) return;
    window.naeru.hold = on;
    clearTimeout(holdTimer);
    // 안전장치: 탭이 숨는 등으로 비행 rAF가 끊기면 hold가 남아 모든 동작이
    // 영영 멈춘다. 방문 최대 길이(약 11초)의 두 배 남짓에서 강제로 푼다
    if (on) holdTimer = setTimeout(function () { window.naeru.hold = false; }, 25000);
  }

  function arrive(v) {
    vid = v;
    var dir = Math.random() < 0.5 ? 1 : -1;      // 1 = 왼쪽에서 날아옴
    var p0 = [dir > 0 ? -0.15 : 1.15, rand(0.16, 0.30)];
    var t0 = performance.now();
    flit.style.opacity = "1";
    (function step(now) {
      var t = (now - t0) / IN_MS;
      var p1 = perch();                        // 목표는 매 프레임 갱신 — 폴짝해도 따라간다
      if (t >= 1) { sit(dir); return; }
      flap(11, now);
      var e = 1 - Math.pow(1 - t, 2);            // 다가오며 느려진다
      var u = p0[0] + (p1.x - p0[0]) * e;
      var v = p0[1] + (p1.y - p0[1]) * e + Math.sin(t * Math.PI * 4.5) * 0.030 * (1 - e);
      place(u, v, Math.sin(t * Math.PI * 4.5) * 14 * (1 - e));
      requestAnimationFrame(step);
    })(t0);
  }

  /* 도착이 곧 기준 프레임이 되도록, 그 프레임보다 비행 시간만큼 앞에서
     출발한다. 최대 한 바퀴(13.2초)면 반드시 온다 */
  function waitForLaunch(v) {
    var giveUp = performance.now() + 16000;
    (function step(now) {
      if (!v.isConnected || v.paused || document.hidden || now > giveUp) {
        hold(false); schedule("retry"); return;
      }
      var t = v.currentTime;
      for (var i = 0; i < MARKS.length; i++) {
        var launch = (MARKS[i] - IN_MS / 1000 + LOOP) % LOOP;
        if (Math.abs(t - launch) < WINDOW) { arrive(v); return; }
      }
      requestAnimationFrame(step);
    })(performance.now());
  }

  function schedule(kind) {
    var gap = kind === "first" ? FIRST : kind === "retry" ? RETRY : GAP;
    var ms = DEBUG ? (kind === "first" ? 1500 : 6000) : rand.apply(null, gap);
    setTimeout(function () {
      if (document.hidden) { schedule("retry"); return; }
      // 공이 날아오는 중이거나 자체 동작 중이면 미룬다
      if (window.naeru && (window.naeru.busy || window.naeru.hold)) { schedule("retry"); return; }
      var v = activeVideo();
      if (!v) { hold(true); arrive(null); return; }   // 정지본 폴백 등 — 그냥 날아온다
      hold(true);                                     // 기다리는 동안부터 잡아 둔다
      waitForLaunch(v);
    }, ms);
  }
  schedule("first");
})();
</script>

<script>
/* ── 반딧불이 ──────────────────────────────────────────────────────
   밤에만, 비가 안 올 때만 몇 마리가 초원 위를 천천히 떠다닌다.

   #frame이 아니라 #glow에 들어간다 — #frame은 변형별 그레이딩 필터를
   받는데(밤이면 brightness .60) 빛나야 할 것이 그걸 먹으면 도로 어두워진다.
   좌표계는 #frame과 똑같이 layoutFrameBox로 잡으므로 화면비와 무관하다.

   경로는 주기가 서로 다른 사인 둘을 겹쳐 만든다(리사주) — 난수 걸음보다
   훨씬 부드럽고, 상태를 저장할 게 없어서 코드가 짧다. 밝기는 그와 또 다른
   주기로 깜빡여서 규칙성이 안 느껴진다.

   ?ff=0 끄기 ─────────────────────────────────────────────────── */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (new URLSearchParams(location.search).get("ff") === "0") return;

  var N = 6;
  var glow = document.getElementById("glow");
  if (!glow) return;
  var W = 0, H = 0;

  function layout() {
    var box = layoutFrameBox(glow);
    W = box.W; H = box.H;
    var d = 0.009 * W;                       // 빛 번짐 포함한 지름
    for (var i = 0; i < bugs.length; i++) {
      bugs[i].el.style.width = bugs[i].el.style.height = d + "px";
      bugs[i].el.style.margin = (-d / 2) + "px 0 0 " + (-d / 2) + "px";
    }
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  // 초원 위쪽만 — 하늘로 올라가거나 발밑으로 내려가면 반딧불이로 안 보인다
  var bugs = [];
  for (var i = 0; i < N; i++) {
    var el = document.createElement("div");
    el.className = "ff";
    glow.appendChild(el);
    // 가로는 세로 모바일에서 보이는 구간(프레임 37~63%)을 크게 안 벗어나게,
    // 세로는 지평선(y≈0.588) 아래 초원에 머물게 잡았다. 실측 범위는
    // 가로 0.17~0.83, 세로 0.57~0.85
    bugs.push({
      el: el,
      cx: rand(0.28, 0.72), cy: rand(0.62, 0.80),
      ax: rand(0.05, 0.11), ay: rand(0.02, 0.045),
      px: rand(9000, 17000), py: rand(5000, 11000),
      ph: rand(0, 6.283),
      blink: rand(1700, 3400), bph: rand(0, 6.283)
    });
  }
  addEventListener("resize", layout);
  layout();

  function on() {
    // 겨울엔 안 나온다 — 반딧불이는 여름 벌레다
    return (document.body.dataset.variant || "").indexOf("night") === 0 &&
           document.body.dataset.weather !== "rain" &&
           document.documentElement.dataset.season !== "winter";
  }

  var running = false;

  function step(now) {
    if (!on()) {                              // 밤이 아니면 조용히 끈다
      for (var k = 0; k < bugs.length; k++) bugs[k].el.style.opacity = "0";
      running = false;
      setTimeout(check, 2000);
      return;
    }
    for (var j = 0; j < bugs.length; j++) {
      var b = bugs[j];
      var u = b.cx + Math.sin(now / b.px * 6.283 + b.ph) * b.ax
                   + Math.sin(now / (b.px * 0.37) + b.ph) * b.ax * 0.25;
      var v = b.cy + Math.cos(now / b.py * 6.283 + b.ph) * b.ay
                   + Math.sin(now / (b.py * 0.53) + b.ph) * b.ay * 0.3;
      b.el.style.transform = "translate(" + (u * W).toFixed(1) + "px," +
                             (v * H).toFixed(1) + "px)";
      // 깜빡임: 대체로 어둡고 가끔 밝게 — sin을 세제곱해 봉우리를 좁힌다
      var k2 = (Math.sin(now / b.blink * 6.283 + b.bph) + 1) / 2;
      b.el.style.opacity = (0.06 + 0.94 * k2 * k2 * k2).toFixed(3);
    }
    requestAnimationFrame(step);
  }

  function check() {
    if (running) return;
    if (document.hidden || !on()) { setTimeout(check, 2000); return; }
    running = true;
    requestAnimationFrame(step);
  }
  check();
  document.addEventListener("visibilitychange", check);
})();
</script>

<script>
/* ── 혀 날름 ────────────────────────────────────────────────────────
   가끔 혀를 쏙 집어넣었다가 다시 뺀다.

   **316프레임 루프에는 혀가 들어간 프레임이 없다.** 혀 영역의 프레임간 변화가
   평균 1.81이고 실루엣 화소수도 75,375~84,075라 혀가 빠질 여지가 없다 —
   재생 구간이나 속도로는 못 만든다. 그래서 혀를 지운 몸(naeru-<변형>-nt.png)과
   혀만(tongue-<변형>.png)을 따로 구웠다(tools/naeru-split/tongue.py).

   두 장은 **기준 프레임 79 한 장씩**이다. 그래서 루프가 그 프레임에 왔을 때만
   시작하고, 그 순간 영상을 세운다. 세운 프레임과 정지본이 같은 그림이라
   바꿔치는 순간이 안 보이고, 몸이 멈춘 채로 혀만 움직인다 — 만화에서 한 동작을
   보여줄 때 몸을 붙잡아 두는 것과 같다. 전 프레임을 구우면 몸도 계속 숨쉬게
   할 수 있지만 변형당 영상이 한 벌 더 생기고(+7MB) 인페인팅이 1,272번이라
   1초짜리 개그에는 값이 안 맞는다.

   핑퐁이라 기준 프레임은 한 바퀴에 두 번(3.29초, 9.875초) 지나간다.

   ?tongue=0 끄기 / ?tongue=1 자주 ──────────────────────────────── */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  /* **기본은 꺼져 있다.** 동작 자체는 되지만 아직 불안정해서 감춰 뒀다
     (2026-09-05 "낼름거림은 저장은 하되 보이지 않게"). ?tongue=1로만 나온다.
     자산(naeru-<변형>-nt.png, tongue-<변형>.png)과 tools/naeru-split/tongue.py는
     그대로 남겨 둔다 — 다시 켤 때 여기 한 줄만 되돌리면 된다. */
  var flag = new URLSearchParams(location.search).get("tongue");
  if (flag !== "1" && flag !== "2") return;
  var DEBUG = flag === "1";

  var REF_FRAME = 79, FPS = 24, N_FRAMES = 316;   // tongue.py의 REF와 같아야 한다
  var MARKS = [REF_FRAME / FPS, (N_FRAMES - REF_FRAME) / FPS];
  var WINDOW = 1.5 / FPS;                          // 이 안에 들어오면 그 프레임으로 본다
  var FIRST = [10000, 22000];
  var GAP   = [35000, 85000];
  var RETRY = [7000, 14000];      // 그림이 아직이거나 다른 동작 중이라 미룰 때
  var IN_MS = 220, HOLD_MS = 420, OUT_MS = 280;

  var nt   = document.getElementById("naeruNt");
  var tong = document.getElementById("tongue");
  if (!nt || !tong) return;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function ver() { return "?v=" + (document.documentElement.dataset.av || "0"); }
  function activeVideo() {
    return document.querySelector("#naeruA.on, #naeruB.on");
  }

  /* 미리 받아둬야 바꿔칠 때 안 깜빡인다. **src를 넣고 바로 complete를 보면
     안 된다** — 갓 시작한 요청이라 항상 false라서 첫 시도가 늘 미뤄졌다
     (2026-09-05 "낼름거리는 모션 안 나오는데"의 원인). onload로 기다린다. */
  var ready = false, loadedFor = null;

  function preload(variant) {
    if (loadedFor === variant) return;
    loadedFor = variant;
    ready = false;
    var left = 2;
    function ok() { if (--left === 0) ready = true; }
    nt.onload = tong.onload = ok;
    nt.onerror = tong.onerror = function () { loadedFor = null; };  // 다음에 다시
    nt.src   = "img/naeru-" + variant + "-nt.png" + ver();
    tong.src = "img/tongue-" + variant + ".png" + ver();
  }

  function tick(dur, fn, done) {
    var t0 = performance.now();
    (function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      fn(t);
      if (t < 1) requestAnimationFrame(step);
      else if (done) done();
    })(t0);
  }

  function place(k) {          // k: 1=완전히 나옴 0=입 안
    tong.style.transform = "scale(" + k.toFixed(4) + ") rotate(" +
                           ((1 - k) * -7).toFixed(2) + "deg)";
  }

  function play(v) {
    if (window.naeru) window.naeru.busy = true;
    v.pause();
    nt.style.opacity = "1";
    tong.style.opacity = "1";
    place(1);
    tick(IN_MS, function (t) {                     // 쏙 — 끝에서 빨라진다
      place(1 - (t * t) * 0.94);
    }, function () {
      place(0.06);
      setTimeout(function () {
        tick(OUT_MS, function (t) {                // 다시 뿅, 살짝 넘겼다 제자리
          var e = 1 - Math.pow(1 - t, 3);
          place(0.06 + 1.02 * e - (Math.sin(t * Math.PI) * 0.08));
        }, function () {
          tong.style.opacity = "0";
          nt.style.opacity = "0";
          tong.style.transform = "";
          v.play().catch(function () {});
          if (window.naeru) window.naeru.busy = false;
          schedule();
        });
      }, HOLD_MS);
    });
  }

  /* 기준 프레임이 지나갈 때까지 지켜본다. 최대 한 바퀴(13.2초)면 반드시 온다 */
  function waitForFrame(v) {
    var giveUp = performance.now() + 16000;
    (function step(now) {
      if (!v.isConnected || v.paused || document.hidden) { schedule("retry"); return; }
      if (now > giveUp) { schedule("retry"); return; }
      var t = v.currentTime;
      for (var i = 0; i < MARKS.length; i++) {
        if (Math.abs(t - MARKS[i]) < WINDOW) { play(v); return; }
      }
      requestAnimationFrame(step);
    })(performance.now());
  }

  function schedule(kind) {
    var gap = kind === "first" ? FIRST : kind === "retry" ? RETRY : GAP;
    var ms = DEBUG ? (kind === "first" ? 2000 : 5000) : rand.apply(null, gap);
    setTimeout(function () {
      preload(document.body.dataset.variant || "dusk");
      var v = activeVideo();
      // 미루는 이유는 전부 잠깐짜리(그림 로딩·다른 동작 중)라 짧게 다시 온다.
      // 여기서 GAP을 다시 잡으면 한 번 어긋날 때마다 1~2분씩 밀린다
      if (document.hidden || !v || v.paused || !v.getAttribute("src") || !ready ||
          (window.naeru && (window.naeru.busy || window.naeru.hold))) {
        schedule("retry"); return;
      }
      waitForFrame(v);
    }, ms);
  }
  preload(document.body.dataset.variant || "dusk");   // 첫 시도 전에 미리 받아둔다
  schedule("first");
})();
</script>

</body>
